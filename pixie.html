      if (industry === 'tuition centres') return 'For a tuition centre, an admissions website can start from around ₹6,990–₹9,990 depending on requirements 😊';
      if (industry === 'clinics' || industry === 'healthcare' || industry === 'hospitals') return 'For a clinic, a simple website can start from around ₹6,990–₹14,990 depending on requirements 😊';
      return 'A simple business website can start from around ₹6,990–₹9,990 depending on requirements 😊';
    }

    function getV4PricingReply(message) {
      traceFunction('getV4PricingReplyAffordable');
      const type = detectProjectType(message) || discovery.projectType || 'Website';
      const line = getAffordablePriceLine(type, discovery.industry);
      const rec = buildV4Recommendation();
      discovery.v4 = discovery.v4 && typeof discovery.v4 === 'object' ? discovery.v4 : {};
      discovery.v4.recommendationDone = true;
      discovery.stage = 'complete';
      saveDiscovery();
      return `${line}\n\nPricing is never fixed — it depends on features, pages, integrations, content, and requirements.\n\n${rec.solution}\n\nWould you like a quick affordable estimate from our team? ✨\n\n[[CONTACT_CARDS]]`;
    }

    function getCostReply(message) {
      traceFunction('getCostReplyAffordable');
      const type = detectProjectType(message) || discovery.projectType || 'Website';
      const line = getAffordablePriceLine(type, discovery.industry);
      return `${line}\n\nPixel Code Media focuses on premium quality with affordable, flexible pricing.\n\nFinal pricing depends on features and requirements — you can start small and scale later.`;
    }

    function getContextualCostReply(message) {
      traceFunction('getContextualCostReplyAffordable');
      return getCostReply(message);
    }

    function estimateBudget() {
      traceFunction('estimateBudgetAffordable');
      return `${getAffordablePriceLine(discovery.projectType || 'Website', discovery.industry)} Pricing is flexible and depends on features and requirements. Start small, then scale when needed.`;
    }


    /* PIXIE PROFESSIONAL DISCOVERY CONSULTANT — FINAL OVERRIDE
       Purpose: understand the visitor's business situation before recommending anything.
       This engine maintains an internal business profile and asks one natural next question at a time. */

    const PIXIE_PROFILE_FIELDS = [
      'businessType',
      'industry',
      'currentChallenges',
      'businessGoals',
      'existingSystems',
      'targetCustomers',
      'growthStage',
      'budgetExpectations',
      'timeline',
      'decisionMakerStatus'
    ];

    function createPixieReply(rawMessage) {
      traceFunction('createPixieReplyDiscoveryConsultant');
      const text = String(rawMessage || '').trim();
      const message = normalize(text);
      const userTurns = getUserTurnCount();
      ensureConsultantProfile();

      if (isReset(message)) {
        discovery = { ...defaultDiscovery };
        discovery.businessProfile = createEmptyBusinessProfile();
        discovery.stage = 'business_discovery';
        pixieVariationMemory = Object.create(null);
        saveDiscovery();
        return 'Fresh start ✨\n\nI’ll understand the business first, then recommend what fits.\n\nWhat kind of business are you running or planning?';
      }

      if (isLeadCaptureActive()) return handleLeadCapture(text);

      const profileBefore = cloneProfile(discovery.businessProfile);
      updateBusinessProfileFromMessage(text, message);
      saveDiscovery();

      if (isGreeting(message) && message.length <= 18 && userTurns <= 1 && getProfileCompletionScore() === 0) {
        return 'Hi 👋 I’m Pixie.\n\nI work like a business discovery consultant — not a sales bot.\n\nTell me a little about your business first. Are you running a school, clinic, travel agency, retail store, service business, or something else?';
      }

      if (isClearlyUnrelated(message) && !hasAnyBusinessProfileSignal()) return getBusinessOnlyRedirect();

      if (isContactIntent(message)) return getConsultantContactReply();

      const knowledgeReply = getConsultantKnowledgeReply(message);
      if (knowledgeReply) {
        const q = getNextConsultantQuestion('knowledge');
        return q ? `${knowledgeReply}\n\nTo guide you properly: ${q}` : knowledgeReply;
      }

      const wantsRecommendation = matches(message, ['recommend', 'recommendation', 'suggest', 'proposal', 'summary', 'snapshot', 'plan', 'roadmap', 'estimate', 'quote', 'cost', 'price', 'pricing', 'timeline', 'how long']);
      const score = getProfileCompletionScore();

      if (wantsRecommendation) {
        if (score >= 6 || (score >= 4 && (isCostIntent(message) || isTimelineIntent(message)))) {
          return generateConsultantRecommendation(message);
        }
        const q = getNextConsultantQuestion('estimate');
        return `I can give you a useful direction, but I don’t want to guess too early.\n\nSo far I understand:\n${formatKnownProfileBrief()}\n\n${q}`;
      }

      if (!isBusinessRelevant(message) && !hasAnyBusinessProfileSignal()) return getBusinessOnlyRedirect();

      return buildConsultantDiscoveryReply(profileBefore, message);
    }

    function createEmptyBusinessProfile() {
      traceFunction('createEmptyBusinessProfile');
      return {
        businessType: null,
        industry: null,
        currentChallenges: [],
        businessGoals: [],
        existingSystems: [],
        targetCustomers: null,
        growthStage: null,
        budgetExpectations: null,
        timeline: null,
        decisionMakerStatus: null,
        solutionInterest: null,
        businessName: null,
        notes: [],
        lastAsked: null,
        updatedAt: new Date().toISOString()
      };
    }

    function ensureConsultantProfile() {
      traceFunction('ensureConsultantProfile');
      if (!discovery || typeof discovery !== 'object') discovery = { ...defaultDiscovery };
      if (!discovery.businessProfile || typeof discovery.businessProfile !== 'object') discovery.businessProfile = createEmptyBusinessProfile();
      const p = discovery.businessProfile;
      PIXIE_PROFILE_FIELDS.forEach((field) => {
        if (!(field in p)) p[field] = field === 'currentChallenges' || field === 'businessGoals' || field === 'existingSystems' ? [] : null;
      });
      if (!Array.isArray(p.currentChallenges)) p.currentChallenges = p.currentChallenges ? [String(p.currentChallenges)] : [];
      if (!Array.isArray(p.businessGoals)) p.businessGoals = p.businessGoals ? [String(p.businessGoals)] : [];
      if (!Array.isArray(p.existingSystems)) p.existingSystems = p.existingSystems ? [String(p.existingSystems)] : [];
      if (!Array.isArray(p.notes)) p.notes = [];
      return p;
    }

    function cloneProfile(profile) {
      traceFunction('cloneProfile');
      return JSON.parse(JSON.stringify(profile || createEmptyBusinessProfile()));
    }

    function updateBusinessProfileFromMessage(text, message) {
      traceFunction('updateBusinessProfileFromMessage');
      const p = ensureConsultantProfile();
      const insight = analyzeMessage(text, discovery.stage || 'business_discovery');
      const detectedIndustry = detectIndustry(message);
      const detectedType = detectBusinessType(message, insight.projectType);
      const detectedChallenges = detectCurrentChallenges(message);
      const detectedGoals = detectBusinessGoals(message, insight.goal);
      const detectedSystems = detectExistingSystems(message);
      const detectedCustomers = detectTargetCustomers(message, insight.audience);
      const detectedStage = detectGrowthStage(message);
      const detectedBudget = detectBudget(message, discovery.stage) || detectBudgetExpectation(message);
      const detectedTimeline = detectTimeline(message, discovery.stage);
      const detectedDecision = detectDecisionMakerStatus(message);
      const detectedBusinessName = detectBusinessName(text);

      if (detectedType) p.businessType = detectedType;
      if (detectedIndustry) {
        p.industry = displayIndustry(detectedIndustry);
        discovery.industry = detectedIndustry;
      }
      if (insight.projectType) {
        p.solutionInterest = insight.projectType;
        discovery.projectType = insight.projectType;
      }
      if (detectedBusinessName) {
        p.businessName = detectedBusinessName;
        discovery.businessName = detectedBusinessName;
      }
      if (detectedChallenges.length) p.currentChallenges = unique([...p.currentChallenges, ...detectedChallenges]).slice(0, 8);
      if (detectedGoals.length) {
        p.businessGoals = unique([...p.businessGoals, ...detectedGoals]).slice(0, 8);
        discovery.goal = p.businessGoals.join(' + ');
      }
      if (detectedSystems.length) p.existingSystems = unique([...p.existingSystems, ...detectedSystems]).slice(0, 8);
      if (detectedCustomers) {
        p.targetCustomers = detectedCustomers;
        discovery.audience = detectedCustomers;
      }
      if (detectedStage) p.growthStage = detectedStage;
      if (detectedBudget) {
        p.budgetExpectations = detectedBudget;
        discovery.budget = detectedBudget;
      }
      if (detectedTimeline) {
        p.timeline = detectedTimeline;
        discovery.timeline = detectedTimeline;
      }
      if (detectedDecision) p.decisionMakerStatus = detectedDecision;

      // Natural follow-up answers: if Pixie asked a field and the message is short, map it to that field.
      const last = p.lastAsked;
      if (last && text.length > 1) {
        if (last === 'businessType' && !p.businessType) p.businessType = cleanSentence(text);
        if (last === 'industry' && !p.industry && !detectedIndustry) p.industry = cleanSentence(text);
        if (last === 'currentChallenges' && !detectedChallenges.length) p.currentChallenges = unique([...p.currentChallenges, cleanSentence(text)]).slice(0, 8);
        if (last === 'businessGoals' && !detectedGoals.length) p.businessGoals = unique([...p.businessGoals, cleanSentence(text)]).slice(0, 8);
        if (last === 'existingSystems' && !detectedSystems.length) p.existingSystems = unique([...p.existingSystems, cleanSentence(text)]).slice(0, 8);
        if (last === 'targetCustomers' && !p.targetCustomers) p.targetCustomers = cleanSentence(text);
        if (last === 'growthStage' && !p.growthStage) p.growthStage = cleanSentence(text);
        if (last === 'budgetExpectations' && !p.budgetExpectations) p.budgetExpectations = cleanSentence(text);
        if (last === 'timeline' && !p.timeline) p.timeline = cleanSentence(text);
        if (last === 'decisionMakerStatus' && !p.decisionMakerStatus) p.decisionMakerStatus = cleanSentence(text);
      }

      p.notes = [...p.notes, cleanSentence(text)].slice(-10);
      p.updatedAt = new Date().toISOString();
      discovery.stage = getConsultantStage();
    }

    function detectBusinessType(message, projectType) {
      traceFunction('detectBusinessType');
      if (matches(message, ['startup', 'new company'])) return 'startup';
      if (matches(message, ['agency'])) return 'agency';
      if (matches(message, ['clinic', 'hospital', 'school', 'tuition', 'shop', 'store', 'restaurant', 'factory', 'travel agency', 'recruitment agency', 'construction company', 'builder', 'gym', 'salon'])) return cleanSentence(message.match(/(clinic|hospital|school|tuition centre|tuition center|shop|store|restaurant|factory|travel agency|recruitment agency|construction company|builder|gym|salon)/i)?.[0] || 'business');
      if (matches(message, ['service business'])) return 'service business';
      if (matches(message, ['b2b'])) return 'B2B business';
      if (matches(message, ['b2c'])) return 'B2C business';
      if (projectType) return `business interested in ${projectType.toLowerCase()}`;
      return null;
    }

    function detectCurrentChallenges(message) {
      traceFunction('detectCurrentChallenges');
      const items = [];
      const map = [
        ['not getting enough leads', ['no leads', 'less leads', 'need leads', 'more leads', 'lead generation', 'not getting customers', 'more customers', 'more admissions', 'more appointments']],
        ['missed follow-ups', ['missed follow up', 'missed follow-up', 'follow up problem', 'followup', 'follow-up', 'forget to call']],
        ['manual work', ['manual work', 'manual process', 'too much manual', 'save time', 'paper work', 'paperwork']],
        ['poor online presence', ['no website', 'online presence', 'google visibility', 'not visible online', 'need website']],
        ['operations are hard to manage', ['hard to manage', 'management problem', 'manage better', 'operations problem', 'tracking problem']],
        ['scattered data', ['excel', 'spreadsheet', 'google sheet', 'data scattered', 'records scattered']],
        ['booking or scheduling issues', ['booking problem', 'appointment problem', 'scheduling problem', 'slots', 'calendar']],
        ['payment or fee tracking issues', ['payment issue', 'fees problem', 'fee tracking', 'billing problem', 'invoice problem']],
        ['trust or credibility gap', ['trust', 'credibility', 'portfolio', 'reviews', 'brand image']],
        ['customer communication gaps', ['communication problem', 'whatsapp only', 'parent communication', 'patient communication', 'client communication']]
      ];
      map.forEach(([label, keys]) => { if (matches(message, keys)) items.push(label); });
      return items;
    }

    function detectBusinessGoals(message, fallbackGoal) {
      traceFunction('detectBusinessGoals');
      const items = [];
      const map = [
        ['get more leads/customers', ['more leads', 'lead generation', 'more customers', 'more clients', 'more sales', 'growth']],
        ['increase admissions', ['admission', 'admissions']],
        ['get more appointments/bookings', ['appointment', 'appointments', 'booking', 'bookings']],
        ['improve management/control', ['management', 'manage better', 'control', 'tracking', 'reports', 'dashboard']],
        ['automate repeated work', ['automation', 'automate', 'save time', 'reminders']],
        ['build online trust', ['online presence', 'trust', 'credibility', 'website', 'portfolio', 'branding']],
        ['sell online', ['ecommerce', 'e-commerce', 'online sales', 'sell online', 'online orders']],
        ['improve customer experience', ['customer experience', 'user experience', 'ui ux', 'ui/ux', 'easy for customers']]
      ];
      map.forEach(([label, keys]) => { if (matches(message, keys)) items.push(label); });
      if (fallbackGoal && !items.length) items.push(fallbackGoal);
      return unique(items);
    }

    function detectExistingSystems(message) {
      traceFunction('detectExistingSystems');
      const items = [];
      const map = [
        ['WhatsApp', ['whatsapp']],
        ['Excel / Google Sheets', ['excel', 'google sheet', 'spreadsheet']],
        ['manual records', ['manual', 'paper', 'register', 'notebook']],
        ['existing website', ['already have website', 'existing website', 'old website', 'current website']],
        ['CRM', ['crm']],
        ['ERP', ['erp']],
        ['social media', ['instagram', 'facebook', 'social media']],
        ['Google Business Profile', ['google business', 'google maps', 'gbp']],
        ['no system yet', ['nothing', 'no system', 'starting from scratch', 'not using anything']]
      ];
      map.forEach(([label, keys]) => { if (matches(message, keys)) items.push(label); });
      return items;
    }

    function detectTargetCustomers(message, fallbackAudience) {
      traceFunction('detectTargetCustomers');
      if (fallbackAudience) return fallbackAudience;
      const audiences = [];
      if (matches(message, ['parents', 'parent'])) audiences.push('parents');
      if (matches(message, ['students', 'student'])) audiences.push('students');
      if (matches(message, ['patients', 'patient'])) audiences.push('patients');
      if (matches(message, ['candidates', 'candidate', 'job seekers'])) audiences.push('candidates');
      if (matches(message, ['clients', 'client'])) audiences.push('clients');
      if (matches(message, ['customers', 'customer', 'buyers'])) audiences.push('customers');
      if (matches(message, ['staff', 'employees', 'team'])) audiences.push('staff/team');
      if (matches(message, ['vendors', 'suppliers'])) audiences.push('vendors/suppliers');
      if (matches(message, ['agents', 'brokers'])) audiences.push('agents/brokers');
      return audiences.length ? unique(audiences).join(' and ') : null;
    }

    function detectGrowthStage(message) {
      traceFunction('detectGrowthStage');
      if (matches(message, ['idea stage', 'planning stage', 'not started'])) return 'idea/planning stage';
      if (matches(message, ['just starting', 'starting', 'new business', 'startup'])) return 'new / early stage';
      if (matches(message, ['running business', 'already running', 'existing business'])) return 'existing business';
      if (matches(message, ['growing', 'expanding', 'scale', 'scaling', 'multiple branches'])) return 'growth / scaling stage';
      if (matches(message, ['established', 'many years', 'enterprise'])) return 'established stage';
      return null;
    }

    function detectBudgetExpectation(message) {
      traceFunction('detectBudgetExpectation');
      if (matches(message, ['low budget', 'tight budget', 'small budget', 'affordable', 'cheap'])) return 'lean / affordable budget';
      if (matches(message, ['medium budget', 'moderate budget'])) return 'medium budget';
      if (matches(message, ['premium', 'high budget', 'enterprise budget'])) return 'premium budget';
      if (matches(message, ['not sure budget', 'budget not sure', 'no idea budget'])) return 'not sure yet';
      return null;
    }

    function detectDecisionMakerStatus(message) {
      traceFunction('detectDecisionMakerStatus');
      if (matches(message, ['i am owner', "i'm owner", 'owner', 'founder', 'director', 'decision maker', 'i decide', 'my business'])) return 'decision maker / owner';
      if (matches(message, ['partner', 'co founder', 'co-founder'])) return 'co-decision maker';
      if (matches(message, ['need approval', 'ask my boss', 'ask partner', 'management approval', 'not decision maker'])) return 'needs approval';
      if (matches(message, ['for my client', 'client project'])) return 'consulting for a client';
      return null;
    }

    function detectBusinessName(text) {
      traceFunction('detectBusinessName');
      const m = String(text || '').match(/(?:business name|company name|clinic name|school name|centre name|center name|brand name)\s*[:=-]\s*([^,;\n]+)/i);
      return m ? cleanSentence(m[1]) : null;
    }

    function getConsultantStage() {
      traceFunction('getConsultantStage');
      const p = ensureConsultantProfile();
      if (!p.businessType && !p.industry) return 'business_type';
      if (!p.currentChallenges.length && !p.businessGoals.length) return 'situation';
      if (!p.existingSystems.length) return 'existing_systems';
      if (!p.targetCustomers) return 'target_customers';
      if (!p.growthStage) return 'growth_stage';
      if (!p.budgetExpectations) return 'budget_expectations';
      if (!p.timeline) return 'timeline';
      if (!p.decisionMakerStatus) return 'decision_maker';
      return 'profile_ready';
    }

    function getProfileCompletionScore() {
      traceFunction('getProfileCompletionScore');
      const p = ensureConsultantProfile();
      let score = 0;
      if (p.businessType) score += 1;
      if (p.industry) score += 1;
      if (p.currentChallenges.length) score += 1;
      if (p.businessGoals.length) score += 1;
      if (p.existingSystems.length) score += 1;
      if (p.targetCustomers) score += 1;
      if (p.growthStage) score += 1;
      if (p.budgetExpectations) score += 1;
      if (p.timeline) score += 1;
      if (p.decisionMakerStatus) score += 1;
      return score;
    }

    function hasAnyBusinessProfileSignal() {
      traceFunction('hasAnyBusinessProfileSignal');
      return getProfileCompletionScore() > 0 || Boolean(ensureConsultantProfile().solutionInterest);
    }

    function buildConsultantDiscoveryReply(profileBefore, message) {
      traceFunction('buildConsultantDiscoveryReply');
      const p = ensureConsultantProfile();
      const acknowledgement = getProfileAcknowledgement(profileBefore, p);
      const insight = getConsultantInsightLine();
      const score = getProfileCompletionScore();
      const q = getNextConsultantQuestion('conversation');

      if (score >= 8) {
        return `${acknowledgement}\n\n${formatConsultantUnderstanding()}\n\nI’m close to a proper recommendation now. ${q || 'Would you like me to turn this into a practical recommendation and phased roadmap?'}`;
      }

      return [acknowledgement, insight, q].filter(Boolean).join('\n\n');
    }

    function getProfileAcknowledgement(before, after) {
      traceFunction('getProfileAcknowledgement');
      const changes = [];
      if (!before.industry && after.industry) changes.push(`you’re in ${after.industry}`);
      if (!before.businessType && after.businessType) changes.push(`it’s ${withArticle(after.businessType)}`);
      if ((!before.currentChallenges || !before.currentChallenges.length) && after.currentChallenges.length) changes.push(`the pressure point is ${listFew(after.currentChallenges, 2)}`);
      if ((!before.businessGoals || !before.businessGoals.length) && after.businessGoals.length) changes.push(`the goal is ${listFew(after.businessGoals, 2)}`);
      if ((!before.existingSystems || !before.existingSystems.length) && after.existingSystems.length) changes.push(`you’re currently using ${listFew(after.existingSystems, 2)}`);
      if (!before.targetCustomers && after.targetCustomers) changes.push(`the users/customers are ${after.targetCustomers}`);
      if (!before.growthStage && after.growthStage) changes.push(`you’re at ${after.growthStage}`);
      if (!before.budgetExpectations && after.budgetExpectations) changes.push(`budget expectation is ${after.budgetExpectations}`);
      if (!before.timeline && after.timeline) changes.push(`timing is ${after.timeline}`);
      if (!before.decisionMakerStatus && after.decisionMakerStatus) changes.push(`decision status is ${after.decisionMakerStatus}`);

      if (changes.length) return `Got it — ${changes.slice(0, 2).join(', ')}.`;
      if (after.industry || after.businessType) return 'That helps — I’m building the business picture step by step.';
      return 'Interesting. I’ll understand the business first before suggesting anything.';
    }

    function getConsultantInsightLine() {
      traceFunction('getConsultantInsightLine');
      const p = ensureConsultantProfile();
      const industryKey = discovery.industry;
      const play = getPlaybook(industryKey);
      if (p.currentChallenges.length && p.businessGoals.length) return `Consultant view: this sounds less like “buy a service” and more like solving ${listFew(p.currentChallenges, 2)} so you can ${listFew(p.businessGoals, 2)}.`;
      if (play && p.industry) return `For ${withArticle(p.industry)}, I’d usually look at ${listFew(play.problems, 3)} before deciding whether a website, software, automation, or marketing makes sense.`;
      if (p.solutionInterest) return `${p.solutionInterest} might be right — but I’d still validate the business problem, users, current process, budget, and timeline first.`;
      return 'The useful recommendation will come from the situation: what is painful now, what outcome matters, and what systems you already use.';
    }

    function getNextConsultantQuestion(context) {
      traceFunction('getNextConsultantQuestion');
      const p = ensureConsultantProfile();
      let field = null;
      let question = '';

      if (!p.businessType && !p.industry) {
        field = 'businessType';
        question = 'Are you running a school, clinic, travel agency, retail shop, service business, or something else?';
      } else if (!p.currentChallenges.length && !p.businessGoals.length) {
        field = 'currentChallenges';
        question = getChallengeQuestion();
      } else if (!p.businessGoals.length) {
        field = 'businessGoals';
        question = 'What outcome matters most right now — more leads, better management, faster follow-up, bookings, sales, or something else?';
      } else if (!p.existingSystems.length) {
        field = 'existingSystems';
        question = 'How are you handling this today — WhatsApp, Excel, paper records, an existing website/software, or mostly manual work?';
      } else if (!p.targetCustomers) {
        field = 'targetCustomers';
        question = getCustomerQuestion();
      } else if (!p.growthStage) {
        field = 'growthStage';
        question = 'Where is the business right now — just starting, already running, growing, or scaling to multiple branches/teams?';
      } else if (!p.budgetExpectations) {
        field = 'budgetExpectations';
        question = 'For planning, should I think lean/affordable first, medium budget, premium, or are you not sure yet?';
      } else if (!p.timeline) {
        field = 'timeline';
        question = 'Is there any timeline pressure — urgent, a few weeks, 1–2 months, 3+ months, or flexible?';
      } else if (!p.decisionMakerStatus) {
        field = 'decisionMakerStatus';
        question = 'Last context: are you the owner/decision maker, or will someone else need to approve the direction?';
      } else {
        field = 'recommendation';
        question = 'Would you like me to turn this into a practical recommendation with suggested phases?';
      }

      p.lastAsked = field;
      saveDiscovery();
      return question;
    }

    function getChallengeQuestion() {
      traceFunction('getChallengeQuestion');
      const industry = discovery.industry;
      if (industry === 'tuition centres' || industry === 'coaching institutes') return 'What is the bigger issue right now — getting admissions, following up enquiries, managing students/batches/fees, or parent communication?';
      if (['clinics','hospitals','healthcare','dental clinics','eye hospitals'].includes(industry)) return 'What is the bigger issue right now — appointments, patient trust, follow-ups, billing, or managing clinic operations?';
      if (['recruitment','overseas recruitment'].includes(industry)) return 'What is harder right now — getting candidates, managing client requirements, screening, document collection, or follow-ups?';
      if (['travel'].includes(industry)) return 'What is harder right now — getting package enquiries, itinerary follow-up, bookings/payments, or managing leads?';
      if (['retail','restaurants'].includes(industry)) return 'What is the bigger need — more sales/orders, repeat customers, inventory/order management, or offers/follow-up?';
      if (['real estate','builders'].includes(industry)) return 'What is the bigger issue — generating enquiries, site visit follow-up, property listings, or lead tracking?';
      return 'What is the main challenge right now — getting customers, managing operations, follow-ups, payments, visibility, or something else?';
    }

    function getCustomerQuestion() {
      traceFunction('getCustomerQuestion');
      const industry = discovery.industry;
      if (industry === 'tuition centres' || industry === 'coaching institutes' || industry === 'schools' || industry === 'kindergartens') return 'Who should the solution mainly serve — parents, students, teachers/staff, admins, or management?';
      if (['clinics','hospitals','healthcare','dental clinics','eye hospitals'].includes(industry)) return 'Who is the main user — patients, doctors, front desk staff, admins, or management?';
      if (['recruitment','overseas recruitment'].includes(industry)) return 'Who matters most in the workflow — candidates, employers/clients, recruiters, or admins?';
      return 'Who are the main people this should serve — customers, staff, admins, clients, vendors, or management?';
    }

    function formatKnownProfileBrief() {
      traceFunction('formatKnownProfileBrief');
      const p = ensureConsultantProfile();
      const rows = [];
      if (p.businessType) rows.push(`• Business type: ${p.businessType}`);
      if (p.industry) rows.push(`• Industry: ${p.industry}`);
      if (p.currentChallenges.length) rows.push(`• Challenges: ${p.currentChallenges.join(', ')}`);

      const industry = discovery.industry;

    function detectAutomationOpportunities(message) {
      traceFunction('detectAutomationOpportunities');
      const p = ensureConsultantProfile();
      const combined = normalize([
        message,
        (p.currentChallenges || []).join(' '),
        (p.businessGoals || []).join(' '),
        (p.existingSystems || []).join(' '),
        (p.notes || []).slice(-4).join(' ')
      ].join(' '));
      const hits = [];
      Object.entries(PIXIE_AUTOMATION_PLAYBOOK).forEach(([key, item]) => {
        if (matches(combined, item.triggers)) hits.push({ key, ...item });
      });
      return hits;
    }

    function hasGenuineAutomationNeed(message) {
      traceFunction('hasGenuineAutomationNeed');
      const opps = detectAutomationOpportunities(message);
      if (!opps.length) return false;
      const p = ensureConsultantProfile();
      const contextScore = getProfileCompletionScore();
      const hasOperationalContext = Boolean((p.currentChallenges && p.currentChallenges.length) || (p.existingSystems && p.existingSystems.length) || matches(message, ['manual', 'missed', 'delay', 'too many', 'repetitive', 'follow', 'calls', 'appointments', 'documents', 'data entry']));
      return hasOperationalContext || contextScore >= 3;
    }

    function formatAutomationOpportunityLine(message) {
      traceFunction('formatAutomationOpportunityLine');
      const opps = detectAutomationOpportunities(message).slice(0, 3);
      if (!opps.length) return null;
      return opps.map((o) => `• ${o.label}: ${o.tools.join(', ')} — ${o.value}.`).join('\n');
    }

    function getAutomationCautionLine(message) {
      traceFunction('getAutomationCautionLine');
      const opps = detectAutomationOpportunities(message);
      if (!opps.length) return 'Avoid AI for novelty; use it only where it saves time, improves accuracy, or prevents missed work.';
      return unique(opps.map((o) => o.caution)).slice(0, 2).join(' ');
    }

    function hasTransformationProblemSignal(message) {
      traceFunction('hasTransformationProblemSignalAutomation');
      const p = ensureConsultantProfile();
      if (p.currentChallenges && p.currentChallenges.length) return true;
      if (p.businessGoals && p.businessGoals.length) return true;
      if (detectAutomationOpportunities(message).length) return true;
      return matches(message, [
        'too many calls', 'many phone calls', 'phone calls', 'manual', 'missed', 'delay', 'delays', 'slow',
        'hard to manage', 'confusing', 'no tracking', 'follow up', 'follow-up', 'leads', 'customers',
        'appointments', 'bookings', 'records', 'billing', 'payments', 'fees', 'queue', 'inventory',
        'documents', 'quotation', 'quotes', 'admissions', 'attendance', 'parent communication',
        'not organized', 'scattered', 'excel', 'whatsapp only', 'calls only', 'data entry', 'repetitive',
        'customer support', 'same questions', 'reports', 'dashboard'
      ]);
    }

    function getTechnologyOpportunityLine() {
      traceFunction('getTechnologyOpportunityLineAutomation');
      const play = getPlaybook();
      const p = ensureConsultantProfile();
      const latest = (p.notes || []).slice(-3).join(' ');
      const automationLine = formatAutomationOpportunityLine(latest);
      const systems = normalize((p.existingSystems || []).join(' '));

      if (automationLine && hasGenuineAutomationNeed(latest)) {
        return `There is a genuine automation opportunity here, but it should be tied to measurable workflow value:\n${automationLine}`;
      }
      if (play) {
        return `Use technology as a connected operating layer: ${listFew(play.website, 2)} for trust/input, ${listFew(play.software, 3)} for control, and ${listFew(play.automation, 2)} only where repetitive work or missed follow-ups are proven.`;
      }
      if (systems.includes('whatsapp')) return 'Keep WhatsApp, but add structure only where needed: forms/booking links, CRM status, follow-up reminders, and owner-level reports.';
      if (systems.includes('excel')) return 'Keep Excel where it is working; automate only the live workflow parts that cause duplicate entry, missed follow-ups, or slow reports.';
      return 'Create a connected workflow first; add AI or automation only after the repeatable bottleneck is clear.';
    }

    function chooseTransformationSolution() {
      traceFunction('chooseTransformationSolutionAutomation');
      const p = ensureConsultantProfile();
      const play = getPlaybook();
      const latest = (p.notes || []).slice(-4).join(' ');
      const opps = detectAutomationOpportunities(latest);
      const c = normalize((p.currentChallenges || []).join(' '));
      const g = normalize((p.businessGoals || []).join(' '));
      const industry = displayIndustry(discovery.industry);

      if (opps.length && hasGenuineAutomationNeed(latest)) {
        const tools = unique(opps.flatMap((o) => o.tools)).slice(0, 5);
        const values = unique(opps.map((o) => o.value)).slice(0, 2);
        const primary = opps[0];
        if (primary.key === 'calls_voice') {
          return `A website alone will not solve the call-volume problem. I’d recommend a call-to-workflow system: voice agent for repetitive calls, WhatsApp automation for confirmations, booking/enquiry capture, CRM status tracking, and reports for the owner. Expected value: ${primary.value}.`;
        }
        if (primary.key === 'lead_handling') {
          return `This looks like a lead-handling bottleneck. I’d recommend CRM automation with WhatsApp follow-ups, lead source/status tracking, optional AI chatbot for initial qualification, and reporting automation. Expected value: ${primary.value}.`;
        }
        if (primary.key === 'document_processing') {
          return `This looks like a document-processing bottleneck. I’d recommend document automation: upload/collection flow, AI-assisted extraction or checklist validation where safe, status tracking, reminders, and human approval for sensitive cases. Expected value: ${primary.value}.`;
        }
        if (primary.key === 'appointment_scheduling') {
          return `This looks like a scheduling bottleneck. I’d recommend booking automation with WhatsApp confirmations/reminders, optional voice agent for common booking calls, calendar/slot control, CRM status, and no-show reports. Expected value: ${primary.value}.`;
        }
        if (primary.key === 'customer_support') {
          return `This looks like a support bottleneck. I’d recommend a controlled AI chatbot or WhatsApp assistant for FAQs, CRM ticket/status tracking, escalation to staff, and reporting on common issues. Expected value: ${primary.value}.`;
        }
        return `This has a practical automation opportunity: ${tools.join(', ')}. I’d start with the workflow causing the most repeated effort, connect it to CRM/status tracking, and measure impact through reports. Expected value: ${values.join('; ')}.`;
      }

      if (play) {
        if (c.includes('phone') || c.includes('calls') || c.includes('booking') || c.includes('appointment')) {
          return `For this ${industry}, I would not recommend only a website. I’d recommend a booking/enquiry system with ${listFew(play.website, 2)}, CRM-style lead/status tracking, WhatsApp automation, and management reporting.`;
        }
        if (g.includes('lead') || g.includes('admission') || g.includes('sales') || g.includes('customer') || c.includes('lead')) {
          return `A digital growth system: ${listFew(play.website, 3)} + lead CRM + WhatsApp/email follow-up automation + analytics dashboard. The website is only the front door; the real value is tracking and conversion.`;
        }
        if (c.includes('manual') || c.includes('records') || c.includes('excel') || c.includes('tracking') || c.includes('management')) {
          return `An operations platform focused on ${listFew(play.software, 5)}, supported by ${listFew(play.automation, 3)}. This should be phased module by module.`;
        }
        return `A phased transformation setup for ${industry}: start with ${listFew(play.website, 2)} as the entry layer, add ${listFew(play.software, 3)} as the operating layer, then automate ${listFew(play.automation, 2)} only where it saves time or prevents missed work.`;
      }

      if (p.solutionInterest === 'Website') return 'A website may be part of the solution, but not the whole solution. I’d combine it with enquiry capture, CRM tracking, automation where there is repetitive follow-up, analytics, and a simple admin dashboard.';
      if (p.solutionInterest === 'Software platform') return 'A focused software platform should manage the workflow end-to-end: records, roles, statuses, reminders, reports, and integrations. Add AI only for clear tasks like support, document extraction, or lead qualification.';
      if (p.solutionInterest === 'Automation') return 'Start with one measurable automation workflow, then connect it to tracking and reporting so the owner can see impact.';
      return 'A connected digital operating system: structured enquiry/input, CRM or workflow dashboard, automation for repetitive tasks, analytics, and phased improvement.';
    }

    function generateTransformationAnalysis(full = false) {
      traceFunction('generateTransformationAnalysisAutomation');
      const p = ensureConsultantProfile();
      const play = getPlaybook();
      const latest = (p.notes || []).slice(-4).join(' ');
      const automationLine = formatAutomationOpportunityLine(latest);
      const situation = getCurrentSituationLine();

      const opportunity = getTechnologyOpportunityLine();

      }

      return `Transformation analysis\n\n1. Current situation\n${situation}\n\n2. Root cause\n${root}\n\n3. Operational bottleneck\n${bottleneck}\n\n4. Technology opportunity\n${opportunity}\n\n5. Recommended solution\n${solution}\n\n6. Expected business impact\n${impact}${caution}`;

      traceFunction('getExpectedBusinessImpactLineAutomation');
      const p = ensureConsultantProfile();
      const latest = (p.notes || []).slice(-4).join(' ');
      const opps = detectAutomationOpportunities(latest);
      const c = normalize((p.currentChallenges || []).join(' '));
      const impacts = [];

      if (c.includes('lead') || c.includes('admission') || normalize((p.businessGoals || []).join(' ')).includes('lead')) impacts.push('better lead visibility, faster follow-up, and higher conversion discipline');
      if (c.includes('manual') || c.includes('excel') || c.includes('scattered')) impacts.push('less dependency on individual memory and scattered files');
      if (c.includes('billing') || c.includes('payment') || c.includes('fee')) impacts.push('clearer payment status, fewer missed reminders, and cleaner reporting');
      if (c.includes('inventory') || c.includes('catalog')) impacts.push('better stock/order visibility and fewer customer communication gaps');
      impacts.push('owner-level visibility through dashboards and reports');
      return unique(impacts).slice(0, 5).join('; ') + '.';

    function getTransformationNextStepQuestion() {
      traceFunction('getTransformationNextStepQuestionAutomation');
      const p = ensureConsultantProfile();
      const latest = (p.notes || []).slice(-4).join(' ');
      const opps = detectAutomationOpportunities(latest);
      if (opps.length && (!p.existingSystems || !p.existingSystems.length)) return 'Before recommending automation, what tools are you using today — WhatsApp, Excel, calls, paper records, CRM, existing software, or something else?';
      if (opps.length && !p.timeline) return 'How often does this happen — daily, weekly, during peak seasons, or only occasionally? That decides whether automation is worth it.';
      if (!p.existingSystems || !p.existingSystems.length) return 'To make this practical, what are you using today — WhatsApp, Excel, paper records, existing software, or something else?';
      if (!p.targetCustomers) return getCustomerQuestion();
      if (!p.budgetExpectations) return 'Should I shape this as a lean first phase, a medium transformation project, or a premium scalable system?';
      if (!p.timeline) return 'Is there a timeline pressure, or can this be phased calmly?';
      if (!p.decisionMakerStatus) return 'Who needs to approve this transformation — you, a partner, management, or a client?';
      return 'Would you like me to convert this into a phased transformation roadmap with modules, timeline, budget logic, and automation ROI points?';
    }

    function getTransformationKnowledgeReply(message) {
      traceFunction('getTransformationKnowledgeReplyAutomation');
      if (isServicesIntent(message)) {
        return 'Pixel Code Media can build websites, apps, software, AI chatbots, voice agents, WhatsApp automation, CRM automation, workflow automation, document automation, and reporting automation.\n\nBut automation should not be added for hype. It should solve a measurable bottleneck: manual work, repetitive tasks, lead handling, support, scheduling, data entry, follow-ups, documents, or reporting.\n\nWhich workflow is consuming the most time right now?';
      }
      if (isCapabilityIntent(message)) {
        return 'Yes, that can be built — including AI and automation. But I would only recommend it if it reduces workload, prevents missed follow-ups, improves response time, increases conversion, or improves reporting accuracy.\n\nWhat repeated task should it improve first?';
      }
      if (isTimelineIntent(message) || isCostIntent(message)) {
        const analysis = generateTransformationAnalysis(false);
        return `${analysis}\n\nCost and timeline should come after scope clarity. Automation cost depends on triggers, channels, integrations, data quality, exception handling, and reporting requirements.\n\n${getTransformationNextStepQuestion()}`;
      }
      if (isTeamIntent(message)) return getTeamReply();
      if (isWebsiteOwnerIntent(message)) return getWebsiteOwnerReply();
      if (isIdentityIntent(message)) return 'I’m Pixie ✨ — a senior-style digital transformation consultant. I identify practical AI and automation opportunities only when they create measurable business value.';
      if (isSupportIntent(message)) return 'Support can also be automated carefully: AI chatbot for common questions, WhatsApp status updates, CRM tickets, escalation rules, and reporting on recurring issues. Sensitive or complex cases should still reach humans.';
      return null;
    }


    /* PIXIE SOLUTION ARCHITECT MODE — FINAL OVERRIDE
       Trigger: when enough business context is collected, Pixie switches from discovery
       into practical solution architecture. Output is based only on collected information. */

    const PIXIE_PRE_SOLUTION_ARCHITECT_REPLY = createPixieReply;

    function createPixieReply(rawMessage) {
      traceFunction('createPixieReplySolutionArchitect');
      const text = String(rawMessage || '').trim();
      const message = normalize(text);
      ensureConsultantProfile();

      if (isReset(message)) {
        discovery = { ...defaultDiscovery };
        discovery.businessProfile = createEmptyBusinessProfile();
        discovery.stage = 'business_discovery';
        pixieVariationMemory = Object.create(null);
        saveDiscovery();
        return 'Fresh start ✨\n\nI’ll begin with discovery, then switch into Solution Architect mode once there’s enough context.\n\nWhat business are we discussing?';
      }

      if (isLeadCaptureActive()) return handleLeadCapture(text);

      const before = cloneProfile(discovery.businessProfile);
      updateBusinessProfileFromMessage(text, message);
      saveDiscovery();

      const explicitArchitectIntent = matches(message, ['solution architect', 'architecture', 'architect mode', 'technical plan', 'implementation plan', 'core features', 'technology stack', 'phases', 'roadmap', 'full plan', 'detailed plan']);
      const wantsRecommendation = matches(message, ['recommend', 'recommendation', 'suggest', 'proposal', 'summary', 'snapshot', 'plan', 'roadmap', 'estimate', 'quote', 'solution']);

      if (shouldEnterSolutionArchitectMode(message, explicitArchitectIntent, wantsRecommendation)) {
        discovery.businessProfile.solutionArchitectMode = true;
        discovery.stage = 'solution_architect';
        saveDiscovery();
        return generateSolutionArchitectPlan(message);
      }

      if (discovery.businessProfile.solutionArchitectMode && hasNewArchitectRelevantInfo(before, discovery.businessProfile)) {
        saveDiscovery();
        return generateSolutionArchitectPlan(message);
      }

      return PIXIE_PRE_SOLUTION_ARCHITECT_REPLY(rawMessage);
    }

    function shouldEnterSolutionArchitectMode(message, explicitArchitectIntent, wantsRecommendation) {
      traceFunction('shouldEnterSolutionArchitectMode');
      const p = ensureConsultantProfile();
      const score = getProfileCompletionScore();
      const hasBusiness = Boolean(p.industry || p.businessType || discovery.industry);
      const hasProblem = Boolean((p.currentChallenges && p.currentChallenges.length) || (p.businessGoals && p.businessGoals.length));
      const hasWorkflowContext = Boolean((p.existingSystems && p.existingSystems.length) || p.targetCustomers || p.growthStage);
      const hasPlanningContext = Boolean(p.timeline || p.budgetExpectations || p.decisionMakerStatus);

      if (explicitArchitectIntent && hasBusiness && hasProblem) return true;
      if (wantsRecommendation && hasBusiness && hasProblem && score >= 4) return true;
      if (hasBusiness && hasProblem && hasWorkflowContext && hasPlanningContext && score >= 6) return true;
      if (discovery.businessProfile.solutionArchitectMode && hasBusiness && hasProblem) return true;
      return false;
    }

    function hasNewArchitectRelevantInfo(before, after) {
      traceFunction('hasNewArchitectRelevantInfo');
      if (!before || !after) return false;
      return JSON.stringify(before) !== JSON.stringify(after);
    }

      const p = ensureConsultantProfile();
      const play = getPlaybook();
      const architecture = buildSolutionArchitecture(message);

      const p = ensureConsultantProfile();
      const rows = [];
      rows.push(`Business/industry: ${p.industry || displayIndustry(discovery.industry) || p.businessType || 'not fully confirmed'}.`);
      if (p.businessType) rows.push(`Business type: ${p.businessType}.`);
      if (p.growthStage) rows.push(`Growth stage: ${p.growthStage}.`);
      if (p.targetCustomers) rows.push(`Main users/customers: ${p.targetCustomers}.`);
      if (p.existingSystems && p.existingSystems.length) rows.push(`Current systems/processes: ${p.existingSystems.join(', ')}.`);
      if (p.budgetExpectations) rows.push(`Budget expectation: ${p.budgetExpectations}.`);
      if (p.timeline) rows.push(`Timeline signal: ${p.timeline}.`);
      if (p.decisionMakerStatus) rows.push(`Decision status: ${p.decisionMakerStatus}.`);
      rows.push(`Architect view: the solution should address the operating workflow, not just create an online presence.`);
      return rows.join('\n');

      lines.push(`Root cause: ${getRootCauseLine()}`);

        phases: buildArchitectPhases(play, opps)

      const p = ensureConsultantProfile();
      const industry = p.industry || displayIndustry(discovery.industry);
      const hasAutomation = opps && opps.length && hasGenuineAutomationNeed((p.notes || []).join(' '));
      const challengeText = p.currentChallenges && p.currentChallenges.length ? listFew(p.currentChallenges, 3) : 'the confirmed workflow problem';
      const goalText = p.businessGoals && p.businessGoals.length ? listFew(p.businessGoals, 3) : 'better business control';

        const tools = unique(opps.flatMap((o) => o.tools)).slice(0, 4).join(', ');

      }

      return `Build a practical workflow system with enquiry/request capture, CRM-style status tracking, role-based admin screens, reminders, and reporting. Reason: the collected context shows ${challengeText}, so the system must improve daily operations and not only online visibility.`;

      const p = ensureConsultantProfile();
      const features = [];
      const challenges = normalize((p.currentChallenges || []).join(' '));
      const goals = normalize((p.businessGoals || []).join(' '));

      function add(name, reason) {
        if (!features.some((f) => f.name === name)) features.push({ name, reason });
      }

      add('Structured enquiry/request capture', 'Prevents important details from staying only in calls, WhatsApp chats, or staff memory.');
      add('CRM-style status tracking', 'Creates visibility from new enquiry/request to follow-up, conversion, completion, or closure.');

    function classifyProjectTier() {
      traceFunction('classifyProjectTier');
      const p = ensureConsultantProfile();
      const notes = normalize((p.notes || []).join(' '));
      const challenges = normalize((p.currentChallenges || []).join(' '));
      const goals = normalize((p.businessGoals || []).join(' '));
      const combined = `${notes} ${challenges} ${goals}`;
      const opps = detectAutomationOpportunities(combined);
      const play = getPlaybook();
      let score = 0;
      const reasons = [];
      const costDrivers = [];

      // Number of users / stakeholders.
      if (matches(combined, ['multiple branches', 'many users', 'large team', 'hundreds', 'thousands', 'enterprise', 'department', 'citizens'])) {
        score += 4;
        reasons.push('large or multi-team user base');
        costDrivers.push('number of user roles and total users');
      } else if (matches(combined, ['staff', 'admins', 'management', 'team', 'agents', 'vendors', 'parents', 'patients', 'students', 'clients'])) {
        score += 2;
        reasons.push('multiple user groups are involved');
        costDrivers.push('number of roles, permissions, and dashboards');
      } else {
        score += 1;
        reasons.push('limited user group based on current context');
        costDrivers.push('actual number of users');
      }

      // Complexity.
      if (matches(combined, ['workflow', 'management', 'records', 'tracking', 'billing', 'inventory', 'queue', 'documents', 'booking', 'crm', 'reports'])) {
        score += 2;
        reasons.push('workflow and operational complexity is present');
        costDrivers.push('depth of business workflows and approval rules');
      }
      if (play && ((p.currentChallenges || []).length + (p.businessGoals || []).length >= 3)) {
        score += 1;
        reasons.push('industry-specific modules need to be considered');
        costDrivers.push('industry-specific modules and data fields');
      }

      // Integrations.
      if (matches(combined, ['integration', 'integrations', 'api', 'payment gateway', 'whatsapp', 'sms', 'email', 'calendar', 'accounting', 'existing software'])) {
        score += 2;
        reasons.push('external integrations may be required');
        costDrivers.push('third-party integrations such as WhatsApp, payments, calendar, email, SMS, or existing software');
      }

      // Automation.
      if (opps.length) {
        score += Math.min(3, opps.length);
        reasons.push(`automation opportunities detected: ${opps.slice(0, 2).map(o => o.label).join(', ')}`);
        costDrivers.push('automation rules, triggers, exceptions, and testing');
      }

      // AI.
      if (matches(combined, ['ai', 'chatbot', 'voice agent', 'document extraction', 'recommendation', 'assistant', 'common questions'])) {
        score += 3;
        reasons.push('AI or intelligent assistant requirements may be involved');
        costDrivers.push('AI scope, knowledge base quality, accuracy expectations, and human handoff rules');
      }

      // Security.
      if (matches(combined, ['patient records', 'finance', 'financial', 'government', 'citizen', 'documents', 'kyc', 'medical', 'compliance', 'secure', 'permissions'])) {
        score += 3;
        reasons.push('sensitive data or stronger security requirements are likely');
        costDrivers.push('security, permissions, audit logs, backups, and compliance expectations');
      }

      // Custom development.
      if (matches(combined, ['custom', 'portal', 'dashboard', 'software', 'platform', 'mobile app', 'admin panel', 'role based', 'role-based'])) {
        score += 2;
        reasons.push('custom development beyond a simple online presence is likely');
        costDrivers.push('custom screens, dashboards, backend logic, and reports');
      }

      let tier = 'Starter';
      let description = 'A focused first version with limited workflows, limited roles, and minimal integrations.';
      if (score >= 6 && score <= 9) {
        tier = 'Growth';
        description = 'A business workflow project with CRM/status tracking, role-based admin use, and selected automation or integrations.';
      } else if (score >= 10 && score <= 14) {
        tier = 'Professional';
        description = 'A more complete operational system with multiple roles, custom workflows, integrations, automation, reporting, and stronger QA.';
      } else if (score >= 15) {
        tier = 'Enterprise';
        description = 'A complex transformation project with many users or departments, high security, integrations, advanced automation/AI, and phased rollout.';
      }

      return {
        tier,
        score,
        description,
        reasons: unique(reasons).slice(0, 6),
        costDrivers: unique(costDrivers).slice(0, 8)
      };
    }

    function applyTrustFirstConversionPolicy(message, reply) {

    const PIXIE_PRE_COMPETITOR_REPLY = createPixieReply;

    function createPixieReply(rawMessage) {
      traceFunction('createPixieReplyCompetitorAware');
      const text = String(rawMessage || '').trim();
      const message = normalize(text);
      ensureConsultantProfile();

      // Keep language preference updated for competitor responses too.
      const lang = typeof detectPixieLanguage === 'function' ? detectPixieLanguage(text) : 'en';
      discovery.businessProfile.languagePreference = lang;

      updateBusinessProfileFromMessage(text, message);
      saveDiscovery();

      if (isCompetitorIntent(message)) {
        return generateCompetitorStrategicAnalysis(text, lang);
      }

      return PIXIE_PRE_COMPETITOR_REPLY(rawMessage);
    }

    function isCompetitorIntent(message) {
      traceFunction('isCompetitorIntent');
      return matches(message, [
        'competitor', 'competitors', 'competition', 'competing', 'market leader', 'other companies',
        'other schools', 'other clinics', 'other agencies', 'other shops', 'other builders',
        'rival', 'rivals', 'against', 'compare with', 'compared to', 'beat competitors',
        'outperform', 'stand out', 'different from', 'better than', 'market gap', 'differentiation',
        'nearby school', 'nearby clinic', 'nearby shop', 'nearby hospital', 'nearby agency'
      ]);
    }

    function extractCompetitorNames(text) {
      traceFunction('extractCompetitorNames');
      const raw = String(text || '');
      const names = [];
      const patterns = [
        /competitors?\s*(?:are|is|:|-)?\s*([^\.\n]+)/i,
        /compared\s+to\s+([^\.\n]+)/i,
        /against\s+([^\.\n]+)/i,
        /better\s+than\s+([^\.\n]+)/i,
        /like\s+([^\.\n]+)/i
      ];
      patterns.forEach((rx) => {
        const m = raw.match(rx);
        if (m && m[1]) {
          m[1].split(/,| and | & |\/|\|/i).map(cleanSentence).filter(Boolean).forEach((x) => {
            if (x.length <= 60 && !matches(normalize(x), ['website', 'software', 'automation', 'business', 'market'])) names.push(x);
          });
        }
      });
      return unique(names).slice(0, 4);
    }

      traceFunction('generateCompetitorStrategicAnalysis');

      const play = getPlaybook();
      const competitors = extractCompetitorNames(text);
      const profileLine = getCompetitorContextLine(competitors);
      const strengths = getCompetitorStrengths(play);
      const weaknesses = getCompetitorWeaknesses(play);
      const gaps = getMarketGaps(play);
      const differentiation = getDifferentiationOpportunities(play);
      const techAdvantages = getTechnologyAdvantagesForCompetition(play);
      const actionPlan = getCompetitorActionPlan(play);
