
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pixie Chat — Pixel Code Media</title>
  <style>
    :root {
      --bg-start: #fff7fb;
      --bg-mid: #f4edff;
      --bg-end: #eefcff;
      --text: #30283d;
      --muted: #7d728c;
      --primary: #8b5cf6;
      --primary-2: #ec4899;
      --accent: #fbbf24;
      --surface: rgba(255, 255, 255, 0.72);
      --surface-strong: rgba(255, 255, 255, 0.92);
      --border: rgba(139, 92, 246, 0.14);
      --shadow: 0 22px 70px rgba(91, 33, 182, 0.15);
      --bubble-shadow: 0 14px 34px rgba(91, 33, 182, 0.11);
      --header-height: 72px;
      --composer-height: 88px;
    }

    * {
      box-sizing: border-box;
    }

    body,
    .app,
    .chat-header,
    .composer-shell,
    .composer,
    .bubble,
    .contact-card {
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 4%, rgba(251, 191, 36, 0.28), transparent 30%),
        radial-gradient(circle at 92% 0%, rgba(236, 72, 153, 0.22), transparent 28%),
        radial-gradient(circle at 78% 86%, rgba(34, 211, 238, 0.17), transparent 34%),
        linear-gradient(135deg, var(--bg-start), var(--bg-mid) 52%, var(--bg-end));
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.18);
    }

    .chat-header {
      height: calc(var(--header-height) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 18px 0;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(139, 92, 246, 0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.82), rgba(255,255,255,0.56));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 8px 34px rgba(91, 33, 182, 0.08);
      z-index: 3;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }


    .title {
      font-weight: 850;
      font-size: 18px;
      letter-spacing: -0.035em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,0.68);
      border: 1px solid rgba(139, 92, 246, 0.12);
      color: #5f5370;
      font-size: 13px;
      font-weight: 750;
      box-shadow: 0 10px 25px rgba(91, 33, 182, 0.08);
      flex: 0 0 auto;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #34d399;
      box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.16);
    }

    .messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      padding: 22px max(16px, calc((100vw - 900px) / 2)) 128px;
    }

    .messages::-webkit-scrollbar {
      width: 10px;
    }

    .messages::-webkit-scrollbar-thumb {
      border: 3px solid transparent;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.2);
      background-clip: content-box;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 0 0 15px;
      animation: messageIn 230ms ease-out both;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(72%, 680px);
      padding: 14px 16px;
      border-radius: 24px;
      font-size: 15px;
      line-height: 1.56;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: var(--bubble-shadow);
    }

    .pixie .bubble {
      border-bottom-left-radius: 10px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(139, 92, 246, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .user .bubble {
      border-bottom-right-radius: 10px;
      color: white;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      box-shadow: 0 18px 38px rgba(139, 92, 246, 0.23);
    }

    .typing .bubble {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 78px;
      min-height: 46px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #a78bfa;
      animation: bounce 1s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.14s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.28s;
    }

    .thinking-bubble {
      min-width: 116px;
    }

    .simple-thinking {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #6d45d7;
      font-size: 14px;
      font-weight: 850;
      letter-spacing: -0.01em;
    }

    .thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .thinking-dots i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #a78bfa;
      animation: bounce 1s infinite ease-in-out;
    }

    .thinking-dots i:nth-child(2) {
      animation-delay: 0.14s;
    }

    .thinking-dots i:nth-child(3) {
      animation-delay: 0.28s;
    }

    .answer-bubble {
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .live-cursor {
      display: inline-block;
      width: 0.55em;
      margin-left: 2px;
      color: var(--primary);
      font-weight: 900;
      animation: blink 0.85s steps(2, start) infinite;
    }

    .live-cursor.done {
      opacity: 0;
      animation: none;
      transition: opacity 160ms ease;
    }

    .pixie .bubble a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 4px 5px 4px 0;
      padding: 8px 11px;
      border-radius: 999px;
      color: #7046d4;
      text-decoration: none;
      font-size: 13px;
      font-weight: 850;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.11), rgba(236, 72, 153, 0.10));
      border: 1px solid rgba(139, 92, 246, 0.16);
      box-shadow: 0 8px 22px rgba(91, 33, 182, 0.08);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .pixie .bubble a:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(91, 33, 182, 0.13);
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.16), rgba(236, 72, 153, 0.14));
    }

    .contact-card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .contact-card {
      position: relative;
      overflow: hidden;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(139, 92, 246, 0.16);
      background: linear-gradient(145deg, rgba(255,255,255,0.92), rgba(255,255,255,0.72));
      box-shadow: 0 14px 30px rgba(91, 33, 182, 0.10);
    }

    .contact-name {
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .contact-role {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.35;
    }

    .contact-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 11px;
    }

    .pixie .bubble .contact-actions a.contact-action {
      min-height: 40px;
      margin: 0;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      color: #fff;
      border: 0;
      box-shadow: 0 10px 22px rgba(139, 92, 246, 0.16);
    }

    .pixie .bubble .contact-actions a.call {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    }

    .pixie .bubble .contact-actions a.whatsapp {
      background: linear-gradient(135deg, #10b981, #22c55e);
    }


    /* Pixie living avatar system */
    .pixie-avatar-stage {
      position: absolute;
      left: max(12px, calc((100vw - 900px) / 2 + 14px));
      bottom: calc(100% - 18px);
      width: 166px;
      height: 172px;
      z-index: 12;
      pointer-events: none;
      --bot-shell: #fffdfb;
      --bot-shell-2: #f4f0ed;
      --bot-shell-3: #e6e0dc;
      --bot-panel: #fff7f9;
      --bot-panel-2: #ffe8ee;
      --bot-silver: #d8dce2;
      --bot-silver-2: #eef1f4;
      --bot-accent: #f06f93;
      --bot-accent-soft: #ffc2d1;
      --bot-coral: #f48676;
      --bot-blue: #9fd7ff;
      --bot-blue-soft: #d9f0ff;
      --bot-eye-dark: #1d1b22;
      --bot-eye-mid: #504556;
      --bot-eye-rose: #e9799b;
      --bot-eye-light: #ffe0ea;
      --bot-eye-shine: #ffffff;
      --bot-line: rgba(45, 38, 48, 0.20);
      --bot-cheek: #ff9bb4;
      --bot-seat: rgba(255, 255, 255, 0.74);
      --bot-seat-line: rgba(240, 111, 147, 0.22);
      --bot-ui-panel: rgba(255, 255, 255, 0.90);
      --bot-ui-line: rgba(240, 111, 147, 0.40);
      --bot-shadow: rgba(105, 76, 89, 0.24);
      --bot-ground-shadow: rgba(64, 45, 56, 0.16);
    }

    .pixie-avatar-stage::after {
      content: '';
      position: absolute;
      left: 44px;
      bottom: 5px;
      width: 72px;
      height: 14px;
      border-radius: 999px;
      background: radial-gradient(ellipse at center, var(--bot-ground-shadow) 0%, rgba(64, 45, 56, 0.08) 42%, transparent 72%);
      filter: blur(2px);
      opacity: 0.72;
      transform: translateY(1px);
      z-index: 0;
    }

    .pixie-avatar {
      position: absolute;
      left: -8px;
      bottom: 0;
      width: 166px;
      height: 170px;
      transform-origin: 50% 92%;
      filter: drop-shadow(0 20px 28px var(--bot-shadow));
      pointer-events: none;
      z-index: 1;
      will-change: transform;
      animation: avatarBreathe 3.45s ease-in-out infinite, avatarSway 6.6s ease-in-out infinite;
    }

    .pixie-avatar svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pixie-root,
    .pixie-body,
    .pixie-head,
    .pixie-face,
    .pixie-pupils,
    .pixie-eye-open,
    .pixie-brows,
    .pixie-status-light,
    .pixie-status-ring,
    .pixie-side-pod-left,
    .pixie-side-pod-right,
    .pixie-arm-left,
    .pixie-arm-right,
    .pixie-hand-right,
    .pixie-tablet,
    .pixie-tablet-lines,
    .pixie-mouth-idle,
    .pixie-foot-left,
    .pixie-foot-right,
    .pixie-processor,
    .pixie-zzz {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform, opacity;
    }

    .pixie-root {
      animation: avatarTinyFloat 4.9s ease-in-out infinite;
    }

    .pixie-body {
      animation: avatarBodySettle 4.7s ease-in-out infinite;
    }

    .pixie-head {
      transform-origin: 50% 84%;
      animation: avatarHeadIdle 5.7s cubic-bezier(.45, 0, .25, 1) infinite;
    }

    .pixie-face {
      animation: avatarLookAround 7.1s cubic-bezier(.45, 0, .25, 1) infinite;
    }

    .pixie-pupils {
      animation: avatarPupilLife 6.5s cubic-bezier(.45, 0, .25, 1) infinite;
    }

    .pixie-eye-open {
      animation: avatarBlink 3.05s infinite;
    }

    .pixie-status-light {
      animation: avatarStatusPulse 3.8s ease-in-out infinite;
    }

    .pixie-status-ring {
      animation: avatarStatusRing 3.8s ease-in-out infinite;
    }

    .pixie-side-pod-left {
      transform-origin: 78% 50%;
      animation: avatarPodLeft 6.4s ease-in-out infinite;
    }

    .pixie-side-pod-right {
      transform-origin: 22% 50%;
      animation: avatarPodRight 6.1s ease-in-out infinite;
    }

    .pixie-mouth-idle {
      animation: avatarSoftSmile 5.8s ease-in-out infinite;
    }

    .pixie-eye-smile,
    .pixie-eye-think,
    .pixie-brows-happy,
    .pixie-brows-think,
    .pixie-brows-focused,
    .pixie-mouth-happy,
    .pixie-mouth-big,
    .pixie-mouth-open,
    .pixie-mouth-think,
    .pixie-mouth-focused,
    .pixie-tablet-lines,
    .pixie-processor,
    .pixie-zzz {
      opacity: 0;
    }

    .pixie-arm-left {
      transform-origin: 86% 28%;
    }

    .pixie-arm-right {
      transform-origin: 14% 28%;
    }

    .pixie-foot-left,
    .pixie-foot-right {
      animation: avatarFootDangle 6.2s ease-in-out infinite;
    }

    .pixie-foot-right {
      animation-delay: 1.35s;
    }

    .pixie-tablet {
      opacity: 0.14;
      transform: translateY(4px) scale(0.96);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .pixie-avatar[data-state="typing"] {
      transform: translateY(-1px) rotate(-0.3deg) scale(1.01);
    }

    .pixie-avatar[data-state="typing"] .pixie-head {
      transform: rotate(2.8deg) translateY(1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-face {
      transform: translate(2px, 1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-pupils {
      transform: translate(2.2px, 1.2px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-side-pod-left {
      transform: rotate(-5deg) translateY(-1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-side-pod-right {
      transform: rotate(5deg) translateY(-1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-mouth-idle,
    .pixie-avatar[data-state="typing"] .pixie-brows-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="typing"] .pixie-mouth-open,
    .pixie-avatar[data-state="typing"] .pixie-brows-focused {
      opacity: 1;
    }

    .pixie-avatar[data-state="typing"] .pixie-status-light {
      animation: avatarStatusTyping 900ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="typing"] .pixie-tablet,
    .pixie-avatar[data-state="answering"] .pixie-tablet {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .pixie-avatar[data-state="sent"],
    .pixie-avatar.avatar-bounce {
      animation: avatarSentJump 520ms cubic-bezier(.2, .9, .25, 1.18), avatarBreathe 3.45s ease-in-out infinite 520ms;
    }

    .pixie-avatar[data-state="sent"] .pixie-side-pod-left,
    .pixie-avatar[data-state="success"] .pixie-side-pod-left,
    .pixie-avatar.avatar-celebrate .pixie-side-pod-left {
      transform: rotate(-8deg) translateY(-2px);
      animation: none;
    }

    .pixie-avatar[data-state="sent"] .pixie-side-pod-right,
    .pixie-avatar[data-state="success"] .pixie-side-pod-right,
    .pixie-avatar.avatar-celebrate .pixie-side-pod-right {
      transform: rotate(8deg) translateY(-2px);
      animation: none;
    }

    .pixie-avatar[data-state="sent"] .pixie-eye-smile,
    .pixie-avatar.avatar-celebrate .pixie-eye-smile,
    .pixie-avatar[data-state="success"] .pixie-eye-smile,
    .pixie-avatar[data-state="sent"] .pixie-brows-happy,
    .pixie-avatar.avatar-celebrate .pixie-brows-happy,
    .pixie-avatar[data-state="success"] .pixie-brows-happy {
      opacity: 1;
    }

    .pixie-avatar[data-state="sent"] .pixie-eye-open,
    .pixie-avatar.avatar-celebrate .pixie-eye-open,
    .pixie-avatar[data-state="success"] .pixie-eye-open,
    .pixie-avatar[data-state="sent"] .pixie-brows-idle,
    .pixie-avatar.avatar-celebrate .pixie-brows-idle,
    .pixie-avatar[data-state="success"] .pixie-brows-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="sent"] .pixie-mouth-happy,
    .pixie-avatar.avatar-celebrate .pixie-mouth-big,
    .pixie-avatar[data-state="success"] .pixie-mouth-big {
      opacity: 1;
    }

    .pixie-avatar[data-state="sent"] .pixie-mouth-idle,
    .pixie-avatar.avatar-celebrate .pixie-mouth-idle,
    .pixie-avatar[data-state="success"] .pixie-mouth-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="sent"] .pixie-status-light,
    .pixie-avatar[data-state="success"] .pixie-status-light,
    .pixie-avatar.avatar-celebrate .pixie-status-light {
      animation: avatarStatusCelebrate 520ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="thinking"] .pixie-head {
      transform: rotate(-4deg) translateY(-1px);
      animation: avatarThinkNod 2.3s ease-in-out infinite;
    }

    .pixie-avatar[data-state="thinking"] .pixie-face {
      transform: translate(-1px, -2px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-pupils {
      transform: translate(0, -3px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-side-pod-left {
      transform: rotate(4deg) translateY(1px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-side-pod-right {
      transform: rotate(-4deg) translateY(-1px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-eye-open,
    .pixie-avatar[data-state="thinking"] .pixie-brows-idle,
    .pixie-avatar[data-state="thinking"] .pixie-mouth-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="thinking"] .pixie-eye-think,
    .pixie-avatar[data-state="thinking"] .pixie-brows-think,
    .pixie-avatar[data-state="thinking"] .pixie-mouth-think,
    .pixie-avatar[data-state="thinking"] .pixie-processor {
      opacity: 1;
    }

    .pixie-avatar[data-state="thinking"] .pixie-processor {
      animation: avatarProcessor 1.6s ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-head {
      transform: rotate(1.4deg);
      animation: avatarFocusedNod 2.1s ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-face {
      transform: translate(1px, .8px);
      animation: none;
    }

    .pixie-avatar[data-state="answering"] .pixie-pupils {
      transform: translate(1.1px, .8px);
      animation: none;
    }

    .pixie-avatar[data-state="answering"] .pixie-brows-idle,
    .pixie-avatar[data-state="answering"] .pixie-mouth-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="answering"] .pixie-brows-focused,
    .pixie-avatar[data-state="answering"] .pixie-mouth-focused {
      opacity: 1;
    }

    .pixie-avatar[data-state="answering"] .pixie-tablet-lines {
      opacity: 1;
      animation: avatarTabletLines 980ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-arm-left {
      animation: avatarTinyTypeLeft 520ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-arm-right {
      animation: avatarTinyTypeRight 560ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="success"] {
      animation: avatarSuccessBounce 780ms ease-out both, avatarBreathe 3.45s ease-in-out infinite 780ms;
    }

    .pixie-avatar.avatar-wave .pixie-arm-right {
      animation: avatarWave 1.15s ease-in-out both;
    }

    .pixie-avatar.avatar-stretch .pixie-root {
      animation: avatarStretch 1.05s ease-in-out both;
    }

    .pixie-avatar.avatar-sleepy .pixie-root {
      animation: avatarSleepCurl 1.2s ease-in-out both;
    }

    .pixie-avatar.avatar-sleepy .pixie-eye-open,
    .pixie-avatar.avatar-sleepy .pixie-brows-idle,
    .pixie-avatar.avatar-sleepy .pixie-mouth-idle {
      opacity: 0;
    }

    .pixie-avatar.avatar-sleepy .pixie-eye-smile,
    .pixie-avatar.avatar-sleepy .pixie-mouth-focused,
    .pixie-avatar.avatar-sleepy .pixie-zzz {
      opacity: 1;
    }

    .pixie-avatar.avatar-look-left .pixie-face {
      animation: none;
      transform: translateX(-2.5px);
    }

    .pixie-avatar.avatar-look-right .pixie-face {
      animation: none;
      transform: translateX(2.5px);
    }

    @keyframes avatarBreathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-1.5px) scale(1.007); }
    }

    @keyframes avatarSway {
      0%, 100% { rotate: -0.28deg; }
      50% { rotate: 0.38deg; }
    }

    @keyframes avatarTinyFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-0.8px); }
    }

    @keyframes avatarBodySettle {

    function safeRequestAnimationFrame(callback) {
      traceFunction('safeRequestAnimationFrame');
      try {
        if (typeof window.requestAnimationFrame === 'function') return window.requestAnimationFrame(callback);

      } catch (error) {
        logChatError('requestAnimationFrame failed', error);
      }
      return window.setTimeout(callback, 0);

    function safeFocusElement(element) {

    function safeStorageGet(key) {
      traceFunction('safeStorageGet');
      try {
        if (!window.localStorage) return null;
        return window.localStorage.getItem(key);
      } catch (error) {
        logChatError(`localStorage get failed for ${key}`, error);
        return null;
      }
    }

    function safeStorageSet(key, value) {
      traceFunction('safeStorageSet');
      try {
        if (!window.localStorage) return false;
        window.localStorage.setItem(key, value);
        return true;
      } catch (error) {
        logChatError(`localStorage set failed for ${key}`, error);

    function cloneStarterMessages() {
      traceFunction('cloneStarterMessages');
      return starterMessages.map((message) => ({ role: message.role, text: message.text }));

    function sanitizeHistory(value) {
      traceFunction('sanitizeHistory');
      if (!Array.isArray(value)) return [];
      return value
        .filter((message) => message && (message.role === 'user' || message.role === 'pixie'))
        .map((message) => ({ role: message.role, text: String(message.text || '') }))
        .filter((message) => message.text.length > 0)
        .slice(-160);
    }

    function sanitizeDiscovery(value) {
      traceFunction('sanitizeDiscovery');
      const saved = value && typeof value === 'object' && !Array.isArray(value) ? value : {};
      const next = { ...defaultDiscovery, ...saved };
      const nullableStrings = ['projectType', 'industry', 'industryDetail', 'goal', 'audience', 'timeline', 'budget', 'leadStage', 'leadName', 'leadPhone', 'leadEmail', 'businessName'];
      nullableStrings.forEach((key) => {
        next[key] = next[key] == null ? null : String(next[key]);
      });
      next.features = Array.isArray(next.features) ? next.features.map(cleanSentence).filter(Boolean).slice(0, 12) : [];
      next.notes = Array.isArray(next.notes) ? next.notes.map(cleanSentence).filter(Boolean).slice(-8) : [];
      next.resultGenerated = Boolean(next.resultGenerated);
      next.askedLeadCapture = Boolean(next.askedLeadCapture);
      next.contactOfferCount = Number.isFinite(Number(next.contactOfferCount)) ? Math.max(0, Number(next.contactOfferCount)) : 0;
      next.lastContactOfferTurn = Number.isFinite(Number(next.lastContactOfferTurn)) ? Number(next.lastContactOfferTurn) : -99;
      const validStages = ['project_type', 'industry', 'goal', 'audience', 'features', 'timeline', 'budget', 'complete'];
      if (!validStages.includes(next.stage)) next.stage = defaultDiscovery.stage;
      const validLeadStages = ['lead_name', 'lead_phone', 'lead_email', 'business_name', null];
      if (!validLeadStages.includes(next.leadStage)) next.leadStage = null;
      return next;
    }

    function logChat(message, details) {
      try {
        if (details !== undefined) console.log(`${TRACE_PREFIX} ${message}`, details);
        else console.log(`${TRACE_PREFIX} ${message}`);
      } catch (error) {
        // Logging must never break chat.
      }
    }

    function logChatError(message, error) {
      try {
        if (error !== undefined) console.error(`${TRACE_PREFIX} ${message}`, error);
        else console.error(`${TRACE_PREFIX} ${message}`);
      } catch (loggingError) {
        // Logging must never break chat.
      }
    }

    function traceFunction(name, details) {
      try {
        TRACE_COUNTS[name] = (TRACE_COUNTS[name] || 0) + 1;
        const limit = Object.prototype.hasOwnProperty.call(TRACE_LIMITS, name) ? TRACE_LIMITS[name] : 80;
        if (TRACE_COUNTS[name] <= limit) {
          if (details !== undefined) console.log(`[TRACE] ${name} started`, details);
          else console.log(`[TRACE] ${name} started`);
        } else if (TRACE_COUNTS[name] === limit + 1) {
          console.log(`[TRACE] ${name} further logs suppressed`);
        }
      } catch (error) {
        // Tracing must never break chat.
      }
    }

    function loadHistory() {
      traceFunction('loadHistory');
      try {
        const raw = safeStorageGet(STORAGE_KEY);
        const saved = raw ? JSON.parse(raw) : null;
        const cleaned = sanitizeHistory(saved);
        if (cleaned.length) {
          logChat('history loaded', { count: cleaned.length });
          return cleaned;

      } catch (error) {
        logChatError('history load failed; starting with starter message', error);
      }
      return cloneStarterMessages();
    }

    function loadDiscovery() {
      traceFunction('loadDiscovery');
      try {
        const raw = safeStorageGet(STATE_KEY);
        const saved = raw ? JSON.parse(raw) : null;
        const cleaned = sanitizeDiscovery(saved);
        logChat('discovery loaded', { stage: cleaned.stage });
        return cleaned;
      } catch (error) {
        logChatError('discovery load failed; starting fresh', error);

      return sanitizeDiscovery();

        history = sanitizeHistory(history);
        const saved = safeStorageSet(STORAGE_KEY, JSON.stringify(history));
        logChat(saved ? 'history save complete' : 'history save skipped', { count: history.length });
      } catch (error) {
        logChatError('history save failed; continuing without persistence', error);
      }
    }

    function saveDiscovery() {
      traceFunction('saveDiscovery');
      try {
        discovery = sanitizeDiscovery(discovery);
        const saved = safeStorageSet(STATE_KEY, JSON.stringify(discovery));
        logChat(saved ? 'discovery save complete' : 'discovery save skipped', { stage: discovery.stage });
      } catch (error) {
        logChatError('discovery save failed; continuing without persistence', error);
      }
    }

    function renderHistory() {
      traceFunction('renderHistory');
      try {
        if (!messagesEl) return;
        history = sanitizeHistory(history);
        if (!history.length) history = cloneStarterMessages();
        messagesEl.innerHTML = '';
        history.forEach((message) => appendMessage(message.role, message.text, false));
        scrollToBottom(false);
        logChat('history rendered', { count: history.length });
      } catch (error) {
        logChatError('history render failed', error);
      }
    }

    function sendMessage() {
      traceFunction('sendMessage');
      logChat('sendMessage started');
      if (!input || !sendButton || !messagesEl) {
        logChatError('sendMessage aborted: required DOM unavailable');
        return;
      }

      const text = input.value.trim();
      if (!text) {
        logChat('sendMessage ignored: empty message');
        updateSendButtonState();
        return;
      }
      if (pixieIsTyping) {
        logChat('sendMessage ignored: Pixie is already responding');
        updateSendButtonState();
        return;
      }

      pixieIsTyping = true;
      updateSendButtonState();

      try {
        addToHistory('user', text);
        logChat('user message added');
        avatarReactSent(text);
        input.value = '';
        autoResizeInput();
        updateSendButtonState();

        const replyFactory = () => safeCreatePixieReply(text);
        logChat('response generation queued');
        animatePixieAnswer(replyFactory).catch((error) => {
          handlePixieAnswerFailure(getFallbackReply(), error);
        });
      } catch (error) {
        logChatError('sendMessage failed', error);
        handlePixieAnswerFailure(getFallbackReply(), error);
      }
    }

    function addToHistory(role, text) {
      traceFunction('addToHistory');
      try {
        const safeRole = role === 'user' ? 'user' : 'pixie';
        const safeText = String(text || '').trim();
        if (!safeText) return;
        history.push({ role: safeRole, text: safeText });
        history = sanitizeHistory(history);
        saveHistory();
        appendMessage(safeRole, safeText, true);
        scrollToBottom();
        logChat('history updated', { role: safeRole, count: history.length });
      } catch (error) {
        logChatError('addToHistory failed', error);
      }
    }

    function appendMessage(role, text, animate = true) {
      traceFunction('appendMessage');
      try {
        if (!messagesEl) return null;
        const row = document.createElement('div');
        row.className = `message-row ${role === 'user' ? 'user' : 'pixie'}`;
        if (!animate) row.style.animation = 'none';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        if (role === 'user') {
          bubble.textContent = String(text || '');
        } else {
          renderFormattedText(bubble, text);
        }
        row.appendChild(bubble);
        messagesEl.appendChild(row);
        logChat('message rendered', { role });
        return row;
      } catch (error) {
        logChatError('appendMessage failed', error);
        return null;
      }
    }

    function showTyping() {
      traceFunction('showTyping');
      try {
        if (!messagesEl) return null;
        pixieIsTyping = true;
        updateSendButtonState();

        hideTyping();
        const row = document.createElement('div');
        row.className = 'message-row pixie typing';
        row.id = 'typingIndicator';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.setAttribute('aria-label', 'Pixie is thinking');
        bubble.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';

        row.appendChild(bubble);
        messagesEl.appendChild(row);
        scrollToBottom();
        logChat('typing indicator appears');
        return row;
      } catch (error) {
        logChatError('showTyping failed', error);
        return null;
      }
    }

    function hideTyping() {
      traceFunction('hideTyping');
      try {
        const typing = document.getElementById('typingIndicator');
        if (typing) {
          typing.remove();
          logChat('typing indicator removed');
        }
      } catch (error) {
        logChatError('hideTyping failed', error);
      }
    }

    function scrollToBottom(smooth = true) {
      traceFunction('scrollToBottom');
      try {
        if (!messagesEl) return;
        const top = messagesEl.scrollHeight || 0;
        if (typeof messagesEl.scrollTo === 'function') {
          messagesEl.scrollTo({
            top,
            behavior: smooth ? 'smooth' : 'auto'
          });
        } else {
          messagesEl.scrollTop = top;
        }
      } catch (error) {
        logChatError('scrollToBottom failed', error);
      }
    }

    function autoResizeInput() {
      traceFunction('autoResizeInput');
      try {
        if (!input || !input.style) return;
        input.style.height = 'auto';
        const maxHeight = window.innerWidth <= 640 ? 120 : 160;
        input.style.height = `${Math.min(input.scrollHeight || 0, maxHeight)}px`;
      } catch (error) {
        logChatError('autoResizeInput failed', error);
      }
    }

    function avatarInitialize() {
      traceFunction('avatarInitialize');
      try {
        if (!pixieAvatar) return;
        avatarLifeEnabled = true;
        avatarSetState('idle');
        avatarMicro('avatar-wave', 1300);
        scheduleAvatarIdleTrick();

        if (themeMedia && typeof themeMedia.addEventListener === 'function') {
          themeMedia.addEventListener('change', () => {
            try {
              avatarSetState('thinking');
              avatarMicro('avatar-wave', 900);
              window.setTimeout(() => avatarSetState('idle'), 850);
            } catch (error) {
              logChatError('theme media listener failed', error);
            }
          });
        }
      } catch (error) {
        logChatError('avatarInitialize failed', error);
      }
    }

    function avatarSetState(state) {
      traceFunction('avatarSetState');
      if (!pixieAvatar) return;
      pixieAvatar.dataset.state = state;
    }

    function avatarReturnIdle(delay = 900) {
      traceFunction('avatarReturnIdle');
      window.clearTimeout(avatarStateTimer);
      avatarStateTimer = window.setTimeout(() => {
        if (!pixieIsTyping && !(input.value.trim() && pixieAvatar?.dataset.state === 'typing')) avatarSetState('idle');
      }, delay);
    }

    function avatarReactTyping() {
      traceFunction('avatarReactTyping');
      if (!avatarLifeEnabled || !pixieAvatar || pixieIsTyping) return;
      avatarSetState(input.value.trim() ? 'typing' : 'idle');
      avatarReturnIdle(1400);
    }

    function avatarReactSent(text) {
      traceFunction('avatarReactSent');
      if (!avatarLifeEnabled || !pixieAvatar) return;
      const lower = normalize(text);
      const positive = isHighIntent(lower) || isDiscoveryRequest(lower) || detectProjectType(lower) || detectIndustry(lower);
      avatarSetState(positive ? 'sent' : 'thinking');
      if (positive) avatarMicro('avatar-bounce', 650);
    }

    function avatarReactThinking() {
      traceFunction('avatarReactThinking');
      if (!avatarLifeEnabled || !pixieAvatar) return;
      avatarSetState('thinking');
    }

    function avatarReactAnswering() {
      traceFunction('avatarReactAnswering');
      if (!avatarLifeEnabled || !pixieAvatar) return;
      avatarSetState('answering');
    }

    function avatarReactSuccess() {
      traceFunction('avatarReactSuccess');
      if (!avatarLifeEnabled || !pixieAvatar) return;
      avatarSetState('success');
      avatarMicro('avatar-celebrate', 1100);
      avatarReturnIdle(1800);
    }

    function avatarReactReplyComplete(reply) {
      traceFunction('avatarReactReplyComplete');
      if (!avatarLifeEnabled || !pixieAvatar) return;
      if (isSuccessReply(reply)) {
        avatarReactSuccess();
      } else {
        avatarReturnIdle(450);
      }
    }

    function isSuccessReply(reply) {
      traceFunction('isSuccessReply');
      return /I’ve got what I need|I've got what I need|Prepared for|project snapshot|solid plan/i.test(reply || '');
    }

    function avatarMicro(className, duration = 1000) {
      traceFunction('avatarMicro');
      if (!avatarLifeEnabled || !pixieAvatar) return;
      pixieAvatar.classList.remove(className);
      void pixieAvatar.offsetWidth;
      pixieAvatar.classList.add(className);
      window.setTimeout(() => pixieAvatar && pixieAvatar.classList.remove(className), duration);
    }

    function scheduleAvatarIdleTrick() {
      traceFunction('scheduleAvatarIdleTrick');
      window.clearTimeout(avatarIdleTimer);
      const delay = 9000 + Math.random() * 11000;
      avatarIdleTimer = window.setTimeout(() => {
        if (avatarLifeEnabled && !pixieIsTyping && pixieAvatar?.dataset.state === 'idle') {
          avatarMicro(random(['avatar-wave', 'avatar-stretch', 'avatar-sleepy', 'avatar-look-left', 'avatar-look-right']), 1500);
        }
        scheduleAvatarIdleTrick();
      }, delay);
    }

    async function animatePixieAnswer(replySource) {
      traceFunction('animatePixieAnswer');
      const answerId = ++activePixieReplyId;
      let safeReply = '';
      let row = null;
      let bubble = null;
      let savedToHistory = false;

      try {
        logChat('animatePixieAnswer started', { answerId });
        pixieIsTyping = true;
        updateSendButtonState();
        avatarReactThinking();

        const shell = createPixieShell();
        row = shell.row;
        bubble = shell.bubble;
        if (!row || !bubble || !messagesEl) throw new Error('Pixie reply shell could not be created');

        bubble.classList.add('thinking-bubble');
        bubble.innerHTML = `
        <div class="simple-thinking" aria-label="Pixie is thinking">
          <span>${random(['✨ Thinking...', '💡 Let me think...', '🚀 Working on that...', 'Typing...'])}</span>
          <span class="thinking-dots"><i></i><i></i><i></i></span>
        </div>
      `;
        messagesEl.appendChild(row);
        logChat('typing indicator appears');
        scrollToBottom();

        safeReply = typeof replySource === 'function' ? String(replySource() || getFallbackReply()) : String(replySource || getFallbackReply());
        logChat('response generated');

        await wait(Math.min(1100, Math.max(520, stripInteractiveTokens(safeReply).length * 1.2)));

        avatarReactAnswering();
        bubble.className = 'bubble answer-bubble';
        bubble.innerHTML = '<span class="live-answer"></span><span class="live-cursor">▌</span>';
        const answerEl = bubble.querySelector('.live-answer');
        const cursor = bubble.querySelector('.live-cursor');
        const typedReply = stripInteractiveTokens(safeReply);

        if (answerEl) {
          await typeLiveText(answerEl, typedReply);
        } else {
          logChatError('live answer element missing; rendering response without typing animation');
        }
        if (cursor) cursor.classList.add('done');

        renderFormattedText(bubble, safeReply);
        logChat('response rendered');

        history.push({ role: 'pixie', text: safeReply });
        savedToHistory = true;
        saveHistory();
        logChat('response saved');
      } catch (error) {
        logChatError('animatePixieAnswer failed; falling back to direct render', error);
        safeReply = safeReply || getFallbackReply();
        if (bubble) {
          renderFormattedText(bubble, safeReply);
          logChat('response rendered by fallback');
        } else {
          appendMessage('pixie', safeReply, true);
        }
        if (!savedToHistory) {
          history.push({ role: 'pixie', text: safeReply });
          saveHistory();
          logChat('fallback response saved');
        }
      } finally {
        if (answerId === activePixieReplyId) {
          pixieIsTyping = false;
          avatarReactReplyComplete(safeReply || getFallbackReply());
          updateSendButtonState();
          safeFocusElement(input);
          scrollToBottom();
          logChat('typing indicator removed');
          logChat('sendMessage finished');
        }
      }
    }

    async function typeLiveText(element, text) {
      traceFunction('typeLiveText');
      if (!element) return;
      try {
        element.textContent = '';
        const characters = Array.from(text || '');

        for (let i = 0; i < characters.length; i += 1) {
          const char = characters[i];
          element.textContent += char;
          if (i % 2 === 0) scrollToBottom();
          await wait(getLiveTypingDelay(char, i, characters));
        }
        scrollToBottom();
      } catch (error) {
        logChatError('typeLiveText failed', error);
        element.textContent = String(text || '');
      }
    }

    function getLiveTypingDelay(char, index, characters) {
      traceFunction('getLiveTypingDelay');
      let delay = 29 + Math.random() * 21;
      if (char === ',' || char === ';' || char === ':') delay += 100 + Math.random() * 65;
      if (char === '.' || char === '?' || char === '!') delay += 185 + Math.random() * 115;
      if (char === '\n') delay += 215 + Math.random() * 150;
      if (char === '✨' || char === '🚀' || char === '😊' || char === '💡') delay += 130;

      const next = characters[index + 1] || '';
      if (char === '\n' && next === '\n') delay += 150;
      return delay;
    }

    function createPixieShell() {
      traceFunction('createPixieShell');
      const row = document.createElement('div');
      row.className = 'message-row pixie';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      row.appendChild(bubble);
      return { row, bubble };
    }

    function wait(ms) {
      traceFunction('wait');
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function renderFormattedText(element, text) {
      traceFunction('renderFormattedText');
      try {
        if (!element) return;
        const escaped = escapeHtml(text);
        const withLinks = escaped.replace(/\[([^\]]+)\]\((tel:[^)]+|https?:\/\/[^)]+)\)/g, (match, label, href) => {
          const safeHref = sanitizeHref(href.replace(/&amp;/g, '&'));
          if (!safeHref) return label;
          const target = safeHref.startsWith('http') ? ' target="_blank" rel="noopener noreferrer"' : '';
          return `<a href="${safeHref}"${target}>${label}</a>`;
        });
        element.innerHTML = withLinks
          .replace(/\n/g, '<br>')
          .replace(/\[\[CONTACT_CARDS\]\]/g, getContactCardsHtml());
      } catch (error) {
        logChatError('renderFormattedText failed', error);
        if (element) element.textContent = String(text || '');
      }
    }

    function escapeHtml(value) {
      traceFunction('escapeHtml');
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function stripInteractiveTokens(text) {
      traceFunction('stripInteractiveTokens');
      return String(text || '').replace(/\n?\[\[CONTACT_CARDS\]\]/g, '').trimEnd();
    }

    function getContactCardsHtml() {
      traceFunction('getContactCardsHtml');
      try {
        const team = Array.isArray(KNOWLEDGE_BASE.team) ? KNOWLEDGE_BASE.team : [];
        return `<div class="contact-card-grid">${team.map((member) => `
        <article class="contact-card">
          <div class="contact-name">${escapeHtml(member.name)}</div>
          <div class="contact-role">${escapeHtml(member.label)}</div>
          <div class="contact-actions">
            <a class="contact-action call" href="${sanitizeHref(member.callLink)}">Call</a>
            <a class="contact-action whatsapp" href="${sanitizeHref(member.whatsappLink)}" target="_blank" rel="noopener noreferrer">WhatsApp</a>
          </div>
        </article>
      `).join('')}</div>`;
      } catch (error) {
        logChatError('contact card generation failed', error);
        return '';
      }
    }

    function sanitizeHref(value) {
      traceFunction('sanitizeHref');
      const href = String(value || '').trim();
      if (/^(tel:|https?:\/\/)/i.test(href)) return href.replace(/"/g, '&quot;');
      return '';
    }

    function safeCreatePixieReply(rawMessage) {
      traceFunction('safeCreatePixieReply');
      try {
        discovery = sanitizeDiscovery(discovery);
        const reply = createPixieReply(String(rawMessage || ''));
        return String(reply || getFallbackReply());
      } catch (error) {
        logChatError('response generation failed', error);
        return getFallbackReply();
      }
    }

    function handlePixieAnswerFailure(reply, error) {
      traceFunction('handlePixieAnswerFailure');
      logChatError('Pixie answer promise rejected', error);
      try {
        const safeReply = String(reply || getFallbackReply());
        appendMessage('pixie', safeReply, true);
        history.push({ role: 'pixie', text: safeReply });
        saveHistory();
        logChat('response rendered after promise rejection');
      } catch (fallbackError) {
        logChatError('promise rejection fallback failed', fallbackError);
      } finally {
        pixieIsTyping = false;
        avatarReturnIdle(300);
        updateSendButtonState();
        safeFocusElement(input);
        scrollToBottom();
        logChat('sendMessage finished');
      }
    }

    function getFallbackReply() {
      traceFunction('getFallbackReply');
      return "I’m still here ✨\n\nSomething went wrong while preparing that answer, but the chat is okay. Please send that message again or tell me what you want to build — website, app, software, automation, or AI solution.";
    }

    function createPixieReply(rawMessage) {
      traceFunction('createPixieReply');
      const text = rawMessage.trim();
      const message = normalize(text);
      const previousStage = discovery.stage;

      if (isReset(message)) {
        discovery = { ...defaultDiscovery };
        saveDiscovery();
        return "Fresh start ✨\n\nWhat are you trying to build — a website, mobile app, software platform, automation, AI solution, or are you not sure yet?";
      }

      if (isLeadCaptureActive()) {
        return handleLeadCapture(text);
      }

      if (isGreeting(message) && message.length <= 12 && history.filter((item) => item.role === 'user').length <= 1) {
        return "Hey 👋\n\nI’m Pixie — the digital consultant inside this Pixel Code Media portfolio.\n\nYou can ask me about the team, services, pricing, or tell me what you want to build.";
      }

      const knowledgeReply = getKnowledgeReply(message);
      if (knowledgeReply) return withLeadConversion(message, knowledgeReply, {
        reason: getLeadConversionReason(message),
        explicit: isContactIntent(message)
      });

      if (isClearlyUnrelated(message) || !isBusinessRelevant(message)) {
        return getBusinessOnlyRedirect();
      }

      const wantsResult = matches(message, ['generate', 'summary', 'proposal', 'estimate', 'quote', 'result', 'recommendation', 'recommend']) ||
        (matches(message, ['cost', 'budget', 'timeline', 'price', 'how long']) && hasEnoughForSnapshot());

      const insight = analyzeMessage(text, previousStage);
      updateDiscovery(text, insight, previousStage);

      if (wantsResult && hasMinimumForSnapshot()) {
        if (!hasLeadDetails()) return askForLeadDetails();
        discovery.resultGenerated = true;
        discovery.stage = 'complete';
        saveDiscovery();
        return generateProjectSnapshot();
      }

      const nextStage = getNextStage();
      discovery.stage = nextStage;
      saveDiscovery();

      if (nextStage === 'complete') {
        if (!hasLeadDetails()) return askForLeadDetails();
        discovery.resultGenerated = true;
        saveDiscovery();
        return generateProjectSnapshot();
      }

      return withLeadConversion(message, buildDiscoveryReply(insight, previousStage, nextStage), {
        reason: isDiscoveryRequest(message) ? 'project' : getLeadConversionReason(message),
        force: isDiscoveryRequest(message)
      });
    }

    function withLeadConversion(message, reply, options = {}) {
      traceFunction('withLeadConversion');
      const reason = options.reason || getLeadConversionReason(message);
      const explicit = Boolean(options.explicit);
      const force = Boolean(options.force);

      if (!shouldOfferContact(message, { reason, explicit, force })) return reply;

      if (!explicit) {
        discovery.contactOfferCount = (discovery.contactOfferCount || 0) + 1;
        discovery.lastContactOfferTurn = getUserTurnCount();
        saveDiscovery();
      }

      return `${reply}\n\n${getSoftContactCTA(reason)}\n\n[[CONTACT_CARDS]]`;
    }

    function shouldOfferContact(message, options = {}) {
      traceFunction('shouldOfferContact');
      if (options.explicit) return true;
      const reason = options.reason || getLeadConversionReason(message);
      if (!reason && !options.force) return false;

      const count = discovery.contactOfferCount || 0;
      const lastTurn = typeof discovery.lastContactOfferTurn === 'number' ? discovery.lastContactOfferTurn : -99;
      const turn = getUserTurnCount();

      if (count >= 2) return false;
      if (!options.force && turn - lastTurn < 3) return false;
      if (options.force && count > 0 && turn - lastTurn < 2) return false;

      return true;
    }

    function getLeadConversionReason(message) {
      traceFunction('getLeadConversionReason');
      if (isContactIntent(message)) return 'contact';
      if (isCostIntent(message)) return 'pricing';
      if (isHireOrQuoteIntent(message)) return 'quote';
      if (matches(message, ['timeline', 'how long', 'deadline', 'delivery time'])) return 'timeline';
      if (isDiscoveryRequest(message)) return 'project';
      if (isCapabilityIntent(message)) return 'capability';
      if (isHighIntent(message)) return 'general';
      return null;
    }

    function isHighIntent(message) {
      traceFunction('isHighIntent');
      return matches(message, [
        'website', 'web development', 'mobile app', 'application', 'software', 'system', 'erp', 'crm',
        'ai', 'automation', 'platform', 'pricing', 'cost', 'budget', 'quote', 'project', 'hire',
        'developer', 'development', 'consultation', 'build', 'startup', 'business', 'company', 'team'
      ]);
    }

    function getSoftContactCTA(reason) {
      traceFunction('getSoftContactCTA');
      if (reason === 'pricing') {
        return "If you'd like a more accurate estimate, you can speak directly with the team.";
      }
      if (reason === 'project') {
        return "Would you like to discuss this directly with the team? 🚀";
      }
      if (reason === 'quote') {
        return "If you'd like a proper estimate, you can chat with the team directly.";
      }
      if (reason === 'timeline') {
        return "Want a quick opinion from the team on timeline and feasibility? ✨";
      }
      if (reason === 'capability') {
        return "This sounds like something our team would enjoy working on 🚀";
      }
      if (reason === 'contact') {
        return "Here are the direct contact options:";
      }
      return random([
        "Want a quick opinion from the team? ✨",
        "I can also connect you directly with our developers.",
        "If you'd like a proper estimate, you can chat with the team directly."
      ]);
    }

    function getUserTurnCount() {
      traceFunction('getUserTurnCount');
      return history.filter((item) => item.role === 'user').length;
    }

    function isBusinessRelevant(message) {
      traceFunction('isBusinessRelevant');
      if (hasActiveBusinessContext()) return true;
      if (isHighIntent(message) || isDiscoveryRequest(message) || isCostIntent(message) || isTimelineIntent(message)) return true;
      if (detectProjectType(message) || detectIndustry(message) || detectGoal(message, discovery.stage)) return true;
      if (matches(message, ['lead generation', 'grow online', 'online growth', 'digital marketing', 'digitize', 'digital transformation', 'operations', 'workflow'])) return true;
      return false;
    }

    function isClearlyUnrelated(message) {
      traceFunction('isClearlyUnrelated');
      return matches(message, [
        'tell me a joke', 'joke', 'weather', 'song', 'movie', 'recipe', 'homework', 'dating',
        'relationship', 'love advice', 'medical advice', 'legal advice', 'astrology', 'horoscope',
        'sports score', 'news today', 'personal question'
      ]);
    }

    function hasActiveBusinessContext() {
      traceFunction('hasActiveBusinessContext');
      return Boolean(
        discovery.projectType ||
        discovery.industry ||
        discovery.goal ||
        discovery.audience ||
        discovery.features.length ||
        discovery.timeline ||
        discovery.budget ||
        discovery.stage !== 'project_type'
      );
    }

    function getBusinessOnlyRedirect() {
      traceFunction('getBusinessOnlyRedirect');
      return "I’m mainly here to help with digital solutions, websites, apps, software, automation, AI solutions, and business growth 😊\n\nIf you’re planning something for your business, tell me a little about it and I’ll help you figure out the best direction.";
    }

    function getKnowledgeReply(message) {
      traceFunction('getKnowledgeReply');
      if (isDiscoveryRequest(message)) return null;

      if (isContactIntent(message)) return getContactReply();
      if (isTeamIntent(message)) return getTeamReply();
      if (isWebsiteOwnerIntent(message)) return getWebsiteOwnerReply();
      if (isIdentityIntent(message)) return getIdentityReply();
      if (isServicesIntent(message)) return getServicesReply();
      if (isCapabilityIntent(message)) return getCapabilityReply(message);
      if (isCostIntent(message)) return getCostReply(message);
      if (isTimelineIntent(message)) return getTimelineReply(message);
      if (isHireOrQuoteIntent(message)) return getHireQuoteReply();

      return null;
    }

    function isDiscoveryRequest(message) {
      traceFunction('isDiscoveryRequest');
      return matches(message, [

    function handleLeadCapture(text) {
      traceFunction('handleLeadCapture');
      const message = normalize(text);

      if (matches(message, ['skip', 'skip this', 'later', 'show plan', 'show me the plan'])) {
        discovery.leadStage = null;
        discovery.resultGenerated = true;
        saveDiscovery();
        return "No worries — I’ll keep it simple for now 😊\n\n" + generateProjectSnapshot();
      }

      collectLeadDetails(text);

      if (hasLeadDetails()) {
        discovery.leadStage = null;
        discovery.stage = 'complete';
        discovery.resultGenerated = true;
        saveDiscovery();
        const name = discovery.leadName ? `, ${discovery.leadName}` : '';
        return `Perfect${name}. I’ve got what I need ✨\n\n` + generateProjectSnapshot();
      }

      discovery.leadStage = getNextLeadStage();
      saveDiscovery();
      return getLeadFollowUpQuestion();
    }

    function collectLeadDetails(text) {
      traceFunction('collectLeadDetails');
      const clean = cleanSentence(text);
      const email = text.match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i);
      const phone = text.match(/(?:\+?\d[\d\s().-]{7,}\d)/);
      const nameLabel = text.match(/(?:^|\n|,|;)\s*(?:name|my name)\s*[:=-]\s*([^,;\n]+)/i);
      const businessLabel = text.match(/(?:^|\n|,|;)\s*(?:business|business name|company|centre|center|clinic|school)\s*[:=-]\s*([^,;\n]+)/i);

      if (email && !discovery.leadEmail) discovery.leadEmail = email[0].trim();
      if (phone && !discovery.leadPhone) discovery.leadPhone = phone[0].trim();
      if (nameLabel && !discovery.leadName) discovery.leadName = cleanSentence(nameLabel[1]);
      if (businessLabel && !discovery.businessName) discovery.businessName = cleanSentence(businessLabel[1]);

      const parts = text.split(/[\n,;]/).map((part) => cleanSentence(part)).filter(Boolean);
      if (parts.length >= 4 && !nameLabel && !businessLabel) {
        if (!discovery.leadName) discovery.leadName = stripLeadNoise(parts[0]);
        if (!discovery.leadPhone && phone) discovery.leadPhone = phone[0].trim();
        if (!discovery.leadEmail && email) discovery.leadEmail = email[0].trim();
        if (!discovery.businessName) discovery.businessName = stripLeadNoise(parts[parts.length - 1]);
      }

      const stage = discovery.leadStage || getNextLeadStage();
      if (stage === 'lead_name' && !discovery.leadName && clean && !email && !phone) {
        discovery.leadName = stripLeadNoise(clean);
      } else if (stage === 'lead_phone' && !discovery.leadPhone) {
        discovery.leadPhone = phone ? phone[0].trim() : clean;
      } else if (stage === 'lead_email' && !discovery.leadEmail) {
        discovery.leadEmail = email ? email[0].trim() : clean;
      } else if (stage === 'business_name' && !discovery.businessName) {
        discovery.businessName = stripLeadNoise(clean);
      }
    }

    function getLeadFollowUpQuestion() {

      if (stage === 'lead_phone') {
        const name = discovery.leadName ? `, ${discovery.leadName}` : '';
        return `Thanks${name}. What’s the best phone number for this project?`;
      }
      if (stage === 'lead_email') {
        return "Got it. And what email should I attach to the project plan?";

      return "Beautiful — I’ve got enough to build your recommendation ✨";

        ['inventory', ['inventory', 'stock']],
        ['notifications', ['notification', 'notifications', 'reminder', 'reminders', 'alerts']],
        ['chat', ['chat', 'chatbot', 'messages', 'messaging']],
        ['property listings', ['listing', 'listings', 'properties']],
        ['job listings', ['job listing', 'job listings', 'jobs']],
        ['scheduling', ['schedule', 'scheduling', 'calendar']],
        ['AI assistant', ['ai assistant', 'ai', 'assistant']],
        ['integrations', ['integration', 'integrations', 'api']]
      ];
      for (const [feature, keywords] of featureMap) {
        if (matches(message, keywords)) found.push(feature);
      }
      if (previousStage === 'features' && found.length === 0 && !matches(message, ['not sure', 'unsure', 'idk'])) {
        found.push(`Custom requirements: ${cleanSentence(message)}`);
      }
      return unique(found);
    }

    function detectTimeline(message, previousStage) {
      traceFunction('detectTimeline');
      const timePattern = /\b(\d+\s*(day|days|week|weeks|month|months)|\d+\s*-\s*\d+\s*(week|weeks|month|months))\b/i;
      const match = message.match(timePattern);
      if (match) return match[0];
      if (matches(message, ['urgent', 'asap', 'immediately', 'soon'])) return 'urgent / as soon as possible';
      if (matches(message, ['few weeks'])) return 'a few weeks';
      if (matches(message, ['1-2 months', '1 to 2 months', 'one to two months'])) return '1–2 months';
      if (matches(message, ['3 months', 'three months', '3+ months'])) return '3+ months';
      if (matches(message, ['no fixed deadline', 'no deadline', 'flexible'])) return 'flexible / no fixed deadline';
      if (previousStage === 'timeline' && message.length > 1) return cleanSentence(message);
      return null;
    }

    function detectBudget(message, previousStage) {
      traceFunction('detectBudget');
      const hasBudgetSignal = /(₹|rs\.?|inr|budget|price|cost|quote|k\b|lakh|Lakhs|crore|cr\b|thousand|rupees|premium|affordable|cheap)/i.test(message);
      const looksLikeTimeline = /\b(day|days|week|weeks|month|months|urgent|asap|deadline)\b/i.test(message);

      if (matches(message, ['low budget', 'small budget', 'cheap', 'affordable'])) return 'low / lean budget';
      if (matches(message, ['medium budget', 'moderate'])) return 'medium budget';
      if (matches(message, ['premium', 'high budget', 'enterprise'])) return 'premium budget';
      if (matches(message, ['not sure', 'no budget', 'unknown']) && previousStage === 'budget') return 'not sure yet';

      if (!hasBudgetSignal && previousStage !== 'budget') return null;
      if (looksLikeTimeline && !hasBudgetSignal) return null;

      const budgetPattern = /((₹|rs\.?|inr)?\s*\d+[\d,]*(\.\d+)?\s*(k|lakh|Lakhs|crore|cr|thousand|rupees)?)(\s*(-|to)\s*(₹|rs\.?|inr)?\s*\d+[\d,]*(\.\d+)?\s*(k|lakh|Lakhs|crore|cr|thousand|rupees)?)?/i;
      const match = message.match(budgetPattern);
      if (match) return match[0].trim();

      if (previousStage === 'budget' && message.length > 1 && !looksLikeTimeline) return cleanSentence(message);
      return null;
    }

    function hasMinimumForSnapshot() {
      traceFunction('hasMinimumForSnapshot');
      return Boolean(discovery.projectType && discovery.industry && discovery.goal);
    }

    function hasEnoughForSnapshot() {
      traceFunction('hasEnoughForSnapshot');
      const filled = [discovery.projectType, discovery.industry, discovery.goal, discovery.audience, discovery.features.length, discovery.timeline, discovery.budget].filter(Boolean).length;
      return filled >= 4;
    }

    function isReset(message) {
      traceFunction('isReset');
      return matches(message, ['reset', 'start over', 'new project', 'clear chat']);
    }

    function isGreeting(message) {
      traceFunction('isGreeting');
      return matches(message, ['hi', 'hello', 'hey', 'yo']);
    }

    function matches(message, words) {
      traceFunction('matches');
      return words.some((word) => {
        const cleanWord = normalize(word);
        const escaped = cleanWord.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        if (cleanWord.includes(' ') || cleanWord.includes("'")) return message.includes(cleanWord);
        return new RegExp(`\\b${escaped}\\b`, 'i').test(message);
      });
    }

    function normalize(value) {
      traceFunction('normalize');
      return String(value || '')
        .toLowerCase()
        .replace(/[’]/g, "'")
        .replace(/\s+/g, ' ')
        .trim();
    }

    function cleanSentence(value) {
      traceFunction('cleanSentence');
      return String(value || '').trim().replace(/\s+/g, ' ');
    }

    function unique(items) {
      traceFunction('unique');
      return [...new Set(items.filter(Boolean))];
    }

    function displayIndustry(industry) {
      traceFunction('displayIndustry');
      if (!industry) return 'your business';
      if (discovery.industryDetail) return discovery.industryDetail;
      const labels = {
        'tuition centres': 'tuition centre',
        'coaching institutes': 'coaching institute',
        'schools': 'school',
        'kindergartens': 'kindergarten',
        'healthcare': 'healthcare business',
        'dental clinics': 'dental clinic',
        'eye hospitals': 'eye hospital',
        'recruitment': 'recruitment business',
        'overseas recruitment': 'overseas recruitment agency',
        'home nursing': 'home nursing service',
        'travel': 'travel agency',
        'real estate': 'real estate business',
        'construction': 'construction company',
        'interior design': 'interior design business',
        'gyms': 'gym or fitness business',
        'retail': 'retail business',
        'local businesses': 'local business',
        'other businesses': 'business'
      };
      return labels[industry] || industry;
    }

    function displayProjectType(projectType) {
      traceFunction('displayProjectType');
      return projectType || 'digital solution';
    }

    function withArticle(phrase) {
      traceFunction('withArticle');
      if (!phrase) return 'a project';
      const lower = phrase.toLowerCase();
      if (lower.startsWith('a ') || lower.startsWith('an ') || lower.startsWith('the ') || lower.endsWith('s')) return phrase;
      return /^[aeiou]/i.test(phrase) ? `an ${phrase}` : `a ${phrase}`;
    }

    function random(items) {
      traceFunction('random');
      const list = Array.isArray(items) ? items.filter((item) => item !== undefined && item !== null) : [];
      if (!list.length) return '';
      return list[Math.floor(Math.random() * list.length)];
    }
