
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pixie Chat — Pixel Code Media</title>
  <style>
    :root {
      --bg-start: #fff7fb;
      --bg-mid: #f4edff;
      --bg-end: #eefcff;
      --text: #30283d;
      --muted: #7d728c;
      --primary: #8b5cf6;
      --primary-2: #ec4899;
      --accent: #fbbf24;
      --surface: rgba(255, 255, 255, 0.72);
      --surface-strong: rgba(255, 255, 255, 0.92);
      --border: rgba(139, 92, 246, 0.14);
      --shadow: 0 22px 70px rgba(91, 33, 182, 0.15);
      --bubble-shadow: 0 14px 34px rgba(91, 33, 182, 0.11);
      --header-height: 72px;
      --composer-height: 88px;
    }

    * {
      box-sizing: border-box;
    }

    body,
    .app,
    .chat-header,
    .composer-shell,
    .composer,
    .bubble,
    .contact-card {
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 4%, rgba(251, 191, 36, 0.28), transparent 30%),
        radial-gradient(circle at 92% 0%, rgba(236, 72, 153, 0.22), transparent 28%),
        radial-gradient(circle at 78% 86%, rgba(34, 211, 238, 0.17), transparent 34%),
        linear-gradient(135deg, var(--bg-start), var(--bg-mid) 52%, var(--bg-end));
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.18);
    }

    .chat-header {
      height: calc(var(--header-height) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 18px 0;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(139, 92, 246, 0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.82), rgba(255,255,255,0.56));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 8px 34px rgba(91, 33, 182, 0.08);
      z-index: 3;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }


    .title {
      font-weight: 850;
      font-size: 18px;
      letter-spacing: -0.035em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,0.68);
      border: 1px solid rgba(139, 92, 246, 0.12);
      color: #5f5370;
      font-size: 13px;
      font-weight: 750;
      box-shadow: 0 10px 25px rgba(91, 33, 182, 0.08);
      flex: 0 0 auto;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #34d399;
      box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.16);
    }

    .messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      padding: 22px max(16px, calc((100vw - 900px) / 2)) 128px;
    }

    .messages::-webkit-scrollbar {
      width: 10px;
    }

    .messages::-webkit-scrollbar-thumb {
      border: 3px solid transparent;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.2);
      background-clip: content-box;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 0 0 15px;
      animation: messageIn 230ms ease-out both;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(72%, 680px);
      padding: 14px 16px;
      border-radius: 24px;
      font-size: 15px;
      line-height: 1.56;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: var(--bubble-shadow);
    }

    .pixie .bubble {
      border-bottom-left-radius: 10px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(139, 92, 246, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .user .bubble {
      border-bottom-right-radius: 10px;
      color: white;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      box-shadow: 0 18px 38px rgba(139, 92, 246, 0.23);
    }

    .typing .bubble {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 78px;
      min-height: 46px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #a78bfa;
      animation: bounce 1s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.14s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.28s;
    }

    .thinking-bubble {
      min-width: 116px;
    }

    .simple-thinking {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #6d45d7;
      font-size: 14px;
      font-weight: 850;
      letter-spacing: -0.01em;
    }

    .thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .thinking-dots i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #a78bfa;
      animation: bounce 1s infinite ease-in-out;
    }

    .thinking-dots i:nth-child(2) {
      animation-delay: 0.14s;
    }

    .thinking-dots i:nth-child(3) {
      animation-delay: 0.28s;
    }

    .answer-bubble {
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .live-cursor {
      display: inline-block;
      width: 0.55em;
      margin-left: 2px;
      color: var(--primary);
      font-weight: 900;
      animation: blink 0.85s steps(2, start) infinite;
    }

    .live-cursor.done {
      opacity: 0;
      animation: none;
      transition: opacity 160ms ease;
    }

    .pixie .bubble a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 4px 5px 4px 0;
      padding: 8px 11px;
      border-radius: 999px;
      color: #7046d4;
      text-decoration: none;
      font-size: 13px;
      font-weight: 850;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.11), rgba(236, 72, 153, 0.10));
      border: 1px solid rgba(139, 92, 246, 0.16);
      box-shadow: 0 8px 22px rgba(91, 33, 182, 0.08);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .pixie .bubble a:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(91, 33, 182, 0.13);
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.16), rgba(236, 72, 153, 0.14));
    }

    .contact-card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .contact-card {
      position: relative;
      overflow: hidden;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(139, 92, 246, 0.16);
      background: linear-gradient(145deg, rgba(255,255,255,0.92), rgba(255,255,255,0.72));
      box-shadow: 0 14px 30px rgba(91, 33, 182, 0.10);
    }

    .contact-name {
      color: var(--text);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .contact-role {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.35;
    }

    .contact-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 11px;
    }

    .pixie .bubble .contact-actions a.contact-action {
      min-height: 40px;
      margin: 0;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      color: #fff;
      border: 0;
      box-shadow: 0 10px 22px rgba(139, 92, 246, 0.16);
    }

    .pixie .bubble .contact-actions a.call {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
    }

    .pixie .bubble .contact-actions a.whatsapp {
      background: linear-gradient(135deg, #10b981, #22c55e);
    }


    /* Pixie living avatar system */
    .pixie-avatar-stage {
      position: absolute;
      left: max(12px, calc((100vw - 900px) / 2 + 14px));
      bottom: calc(100% - 18px);
      width: 138px;
      height: 144px;
      z-index: 12;
      pointer-events: none;
      --bot-shell: #ffe8aa;
      --bot-shell-2: #ffc75a;
      --bot-shell-3: #f59e0b;
      --bot-panel: #fff5cf;
      --bot-panel-2: #ffc65a;
      --bot-silver: #ffb21f;
      --bot-silver-2: #fff1b8;
      --bot-accent: #f97316;
      --bot-accent-soft: #ffd36b;
      --bot-coral: #fb923c;
      --bot-blue: #60a5fa;
      --bot-blue-soft: #fff0b3;
      --bot-eye-dark: #08070a;
      --bot-eye-mid: #1f2937;
      --bot-eye-rose: #fb7185;
      --bot-eye-light: #ffffff;
      --bot-eye-shine: #ffffff;
      --bot-line: #07070a;
      --bot-cheek: #fb923c;
      --bot-seat: rgba(255, 255, 255, 0.0);
      --bot-seat-line: rgba(240, 111, 147, 0.0);
      --bot-ui-panel: rgba(255, 255, 255, 0.92);
      --bot-ui-line: rgba(147, 197, 253, 0.62);
      --bot-shadow: rgba(42, 38, 54, 0.22);
      --bot-ground-shadow: rgba(64, 45, 56, 0.14);
    }

    .pixie-avatar-stage::after {
      content: '';
      position: absolute;
      left: 36px;
      bottom: 4px;
      width: 60px;
      height: 11px;
      border-radius: 999px;
      background: radial-gradient(ellipse at center, var(--bot-ground-shadow) 0%, rgba(64, 45, 56, 0.08) 42%, transparent 72%);
      filter: blur(2px);
      opacity: 0.72;
      transform: translateY(1px);
      z-index: 0;
    }

    .pixie-avatar {
      position: absolute;
      left: -3px;
      bottom: 0;
      width: 138px;
      height: 142px;
      transform-origin: 50% 92%;
      filter: drop-shadow(0 14px 22px var(--bot-shadow));
      pointer-events: auto;
      cursor: pointer;
      z-index: 1;
      will-change: transform;
      animation: avatarBreathe 3.45s ease-in-out infinite, avatarSway 6.6s ease-in-out infinite;
    }

    .pixie-avatar svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pixie-root,
    .pixie-body,
    .pixie-head,
    .pixie-face,
    .pixie-pupils,
    .pixie-eye-open,
    .pixie-brows,
    .pixie-status-light,
    .pixie-status-ring,
    .pixie-side-pod-left,
    .pixie-side-pod-right,
    .pixie-arm-left,
    .pixie-arm-right,
    .pixie-hand-right,
    .pixie-tablet,
    .pixie-tablet-lines,
    .pixie-mouth-idle,
    .pixie-processor,
    .pixie-zzz {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform, opacity;
    }

    .pixie-root {
      animation: avatarTinyFloat 4.9s ease-in-out infinite;
    }

    .pixie-body {
      animation: avatarBodySettle 4.7s ease-in-out infinite;
    }

    .pixie-head {
      transform-origin: 50% 84%;
      animation: avatarHeadIdle 5.7s cubic-bezier(.45, 0, .25, 1) infinite;
    }

    .pixie-face {
      animation: avatarLookAround 7.1s cubic-bezier(.45, 0, .25, 1) infinite;
    }

    .pixie-pupils {
      animation: avatarPupilLife 6.5s cubic-bezier(.45, 0, .25, 1) infinite;
    }

    .pixie-eye-open {
      animation: avatarBlink 3.05s infinite;
    }

    .pixie-status-light {
      animation: avatarStatusPulse 3.8s ease-in-out infinite;
    }

    .pixie-status-ring {
      animation: avatarStatusRing 3.8s ease-in-out infinite;
    }

    .pixie-side-pod-left {
      transform-origin: 78% 50%;
      animation: avatarPodLeft 6.4s ease-in-out infinite;
    }

    .pixie-side-pod-right {
      transform-origin: 22% 50%;
      animation: avatarPodRight 6.1s ease-in-out infinite;
    }

    .pixie-mouth-idle {
      animation: avatarSoftSmile 5.8s ease-in-out infinite;
    }

    .pixie-eye-smile,
    .pixie-eye-think,
    .pixie-eye-sleep,
    .pixie-eye-curious,
    .pixie-brows-happy,
    .pixie-brows-think,
    .pixie-brows-focused,
    .pixie-mouth-happy,
    .pixie-mouth-big,
    .pixie-mouth-open,
    .pixie-mouth-think,
    .pixie-mouth-focused,
    .pixie-mouth-sleepy,
    .pixie-tablet-lines,
    .pixie-processor,
    .pixie-zzz {
      opacity: 0;
    }

    .pixie-arm-left {
      transform-origin: 86% 24%;
      animation: avatarIdleArmLeft 5.8s ease-in-out infinite;
    }

    .pixie-arm-right {
      transform-origin: 14% 24%;
      animation: avatarIdleArmRight 6.2s ease-in-out infinite;
    }


    .pixie-tablet {
      opacity: 0.14;
      transform: translateY(4px) scale(0.96);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .pixie-avatar[data-state="typing"] {
      transform: translateY(-1px) rotate(-0.3deg) scale(1.01);
    }

    .pixie-avatar[data-state="typing"] .pixie-head {
      transform: rotate(2.8deg) translateY(1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-face {
      transform: translate(2px, 1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-pupils {
      transform: translate(2.2px, 1.2px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-side-pod-left {
      transform: rotate(-5deg) translateY(-1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-side-pod-right {
      transform: rotate(5deg) translateY(-1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-mouth-idle,
    .pixie-avatar[data-state="typing"] .pixie-brows-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="typing"] .pixie-mouth-open,
    .pixie-avatar[data-state="typing"] .pixie-brows-focused {
      opacity: 1;
    }

    .pixie-avatar[data-state="typing"] .pixie-status-light {
      animation: avatarStatusTyping 900ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="typing"] .pixie-tablet,
    .pixie-avatar[data-state="answering"] .pixie-tablet {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .pixie-avatar[data-state="sent"],
    .pixie-avatar.avatar-bounce {
      animation: avatarSentJump 520ms cubic-bezier(.2, .9, .25, 1.18), avatarBreathe 3.45s ease-in-out infinite 520ms;
    }

    .pixie-avatar[data-state="sent"] .pixie-side-pod-left,
    .pixie-avatar[data-state="success"] .pixie-side-pod-left,
    .pixie-avatar.avatar-celebrate .pixie-side-pod-left {
      transform: rotate(-8deg) translateY(-2px);
      animation: none;
    }

    .pixie-avatar[data-state="sent"] .pixie-side-pod-right,
    .pixie-avatar[data-state="success"] .pixie-side-pod-right,
    .pixie-avatar.avatar-celebrate .pixie-side-pod-right {
      transform: rotate(8deg) translateY(-2px);
      animation: none;
    }

    .pixie-avatar[data-state="sent"] .pixie-eye-smile,
    .pixie-avatar.avatar-celebrate .pixie-eye-smile,
    .pixie-avatar[data-state="success"] .pixie-eye-smile,
    .pixie-avatar[data-state="sent"] .pixie-brows-happy,
    .pixie-avatar.avatar-celebrate .pixie-brows-happy,
    .pixie-avatar[data-state="success"] .pixie-brows-happy {
      opacity: 1;
    }

    .pixie-avatar[data-state="sent"] .pixie-eye-open,
    .pixie-avatar.avatar-celebrate .pixie-eye-open,
    .pixie-avatar[data-state="success"] .pixie-eye-open,
    .pixie-avatar[data-state="sent"] .pixie-brows-idle,
    .pixie-avatar.avatar-celebrate .pixie-brows-idle,
    .pixie-avatar[data-state="success"] .pixie-brows-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="sent"] .pixie-mouth-happy,
    .pixie-avatar.avatar-celebrate .pixie-mouth-big,
    .pixie-avatar[data-state="success"] .pixie-mouth-big {
      opacity: 1;
    }

    .pixie-avatar[data-state="sent"] .pixie-mouth-idle,
    .pixie-avatar.avatar-celebrate .pixie-mouth-idle,
    .pixie-avatar[data-state="success"] .pixie-mouth-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="sent"] .pixie-status-light,
    .pixie-avatar[data-state="success"] .pixie-status-light,
    .pixie-avatar.avatar-celebrate .pixie-status-light {
      animation: avatarStatusCelebrate 520ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="thinking"] .pixie-head {
      transform: rotate(-4deg) translateY(-1px);
      animation: avatarThinkNod 2.3s ease-in-out infinite;
    }

    .pixie-avatar[data-state="thinking"] .pixie-face {
      transform: translate(-1px, -2px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-pupils {
      transform: translate(0, -3px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-side-pod-left {
      transform: rotate(4deg) translateY(1px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-side-pod-right {
      transform: rotate(-4deg) translateY(-1px);
      animation: none;
    }


    .pixie-avatar[data-state="thinking"] .pixie-arm-left {
      transform: rotate(-22deg) translate(2px, -1px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-arm-right {
      transform: rotate(8deg) translateY(1px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-eye-open,
    .pixie-avatar[data-state="thinking"] .pixie-brows-idle,
    .pixie-avatar[data-state="thinking"] .pixie-mouth-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="thinking"] .pixie-eye-think,
    .pixie-avatar[data-state="thinking"] .pixie-brows-think,
    .pixie-avatar[data-state="thinking"] .pixie-mouth-think,
    .pixie-avatar[data-state="thinking"] .pixie-processor {
      opacity: 1;
    }

    .pixie-avatar[data-state="thinking"] .pixie-processor {
      animation: avatarProcessor 1.6s ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-head {
      transform: rotate(1.4deg);
      animation: avatarFocusedNod 2.1s ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-face {
      transform: translate(1px, .8px);
      animation: none;
    }

    .pixie-avatar[data-state="answering"] .pixie-pupils {
      transform: translate(1.1px, .8px);
      animation: none;
    }

    .pixie-avatar[data-state="answering"] .pixie-brows-idle,
    .pixie-avatar[data-state="answering"] .pixie-mouth-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="answering"] .pixie-brows-focused,
    .pixie-avatar[data-state="answering"] .pixie-mouth-focused {
      opacity: 1;
    }

    .pixie-avatar[data-state="answering"] .pixie-tablet-lines {
      opacity: 1;
      animation: avatarTabletLines 980ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-arm-left {
      animation: avatarTinyTypeLeft 520ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-arm-right {
      animation: avatarTinyTypeRight 560ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="success"] {
      animation: avatarSuccessBounce 780ms ease-out both, avatarBreathe 3.45s ease-in-out infinite 780ms;
    }

    .pixie-avatar.avatar-wave .pixie-arm-right {
      animation: avatarWave 1.15s ease-in-out both;
    }

    .pixie-avatar.avatar-stretch .pixie-root {
      animation: avatarStretch 1.05s ease-in-out both;
    }

    .pixie-avatar.avatar-sleepy .pixie-root {
      animation: avatarSleepCurl 1.2s ease-in-out both;
    }

    .pixie-avatar.avatar-sleepy .pixie-eye-open,
    .pixie-avatar.avatar-sleepy .pixie-brows-idle,
    .pixie-avatar.avatar-sleepy .pixie-mouth-idle {
      opacity: 0;
    }

    .pixie-avatar.avatar-sleepy .pixie-eye-smile,
    .pixie-avatar.avatar-sleepy .pixie-mouth-focused,
    .pixie-avatar.avatar-sleepy .pixie-zzz {
      opacity: 1;
    }


    .pixie-avatar.avatar-sleepy .pixie-eye-smile,
    .pixie-avatar.avatar-sleepy .pixie-mouth-focused {
      opacity: 0;
    }

    .pixie-avatar.avatar-sleepy .pixie-eye-sleep,
    .pixie-avatar.avatar-sleepy .pixie-mouth-sleepy,
    .pixie-avatar.avatar-sleepy .pixie-zzz {
      opacity: 1;
    }

    .pixie-avatar.avatar-look-left .pixie-brows-think,

      const delay = 6000 + Math.random() * 4000;
      avatarIdleTimer = window.setTimeout(() => {
        if (avatarLifeEnabled && !pixieIsTyping && pixieAvatar?.dataset.state === 'idle') {
          avatarMicro(random(['avatar-wave', 'avatar-stretch', 'avatar-look-left', 'avatar-look-right', 'avatar-curious']), 1500);
        }
        scheduleAvatarIdleTrick();
      }, delay);
    }

    async function animatePixieAnswer(replySource) {
      traceFunction('animatePixieAnswer');
      const answerId = ++activePixieReplyId;
      let safeReply = '';
      let row = null;
      let bubble = null;
      let savedToHistory = false;

      try {
        logChat('animatePixieAnswer started', { answerId });
        pixieIsTyping = true;
        updateSendButtonState();
        avatarReactThinking();

        const shell = createPixieShell();
        row = shell.row;
        bubble = shell.bubble;
        if (!row || !bubble || !messagesEl) throw new Error('Pixie reply shell could not be created');

        bubble.classList.add('thinking-bubble');
        bubble.innerHTML = `
        <div class="simple-thinking" aria-label="Pixie is thinking">
          <span>${random(['✨ Thinking...', '💡 Let me think...', '🚀 Working on that...', 'Typing...'])}</span>
          <span class="thinking-dots"><i></i><i></i><i></i></span>
        </div>
      `;
        messagesEl.appendChild(row);
        logChat('typing indicator appears');
        scrollToBottom();

        safeReply = typeof replySource === 'function' ? String(replySource() || getFallbackReply()) : String(replySource || getFallbackReply());
        logChat('response generated');

        await wait(Math.min(1100, Math.max(520, stripInteractiveTokens(safeReply).length * 1.2)));

        avatarReactAnswering();
        bubble.className = 'bubble answer-bubble';
        bubble.innerHTML = '<span class="live-answer"></span><span class="live-cursor">▌</span>';
        const answerEl = bubble.querySelector('.live-answer');
        const cursor = bubble.querySelector('.live-cursor');
        const typedReply = stripInteractiveTokens(safeReply);

        if (answerEl) {
          await typeLiveText(answerEl, typedReply);
        } else {
          logChatError('live answer element missing; rendering response without typing animation');
        }
        if (cursor) cursor.classList.add('done');

        renderFormattedText(bubble, safeReply);
        logChat('response rendered');

        history.push({ role: 'pixie', text: safeReply });
        savedToHistory = true;
        saveHistory();
        logChat('response saved');
      } catch (error) {
        logChatError('animatePixieAnswer failed; falling back to direct render', error);
        safeReply = safeReply || getFallbackReply();
        if (bubble) {
          renderFormattedText(bubble, safeReply);
          logChat('response rendered by fallback');
        } else {
          appendMessage('pixie', safeReply, true);
        }
        if (!savedToHistory) {
          history.push({ role: 'pixie', text: safeReply });
          saveHistory();
          logChat('fallback response saved');
        }
      } finally {
        if (answerId === activePixieReplyId) {
          pixieIsTyping = false;
          avatarReactReplyComplete(safeReply || getFallbackReply());
          updateSendButtonState();
          safeFocusElement(input);
          scrollToBottom();
          logChat('typing indicator removed');
          logChat('sendMessage finished');
        }
      }
    }

    async function typeLiveText(element, text) {
      traceFunction('typeLiveText');
      if (!element) return;
      try {
        element.textContent = '';
        const characters = Array.from(text || '');

        for (let i = 0; i < characters.length; i += 1) {
          const char = characters[i];
          element.textContent += char;
          if (i % 2 === 0) scrollToBottom();
          await wait(getLiveTypingDelay(char, i, characters));
        }
        scrollToBottom();
      } catch (error) {
        logChatError('typeLiveText failed', error);
        element.textContent = String(text || '');
      }
    }

    function getLiveTypingDelay(char, index, characters) {
      traceFunction('getLiveTypingDelay');
      let delay = 29 + Math.random() * 21;
      if (char === ',' || char === ';' || char === ':') delay += 100 + Math.random() * 65;
      if (char === '.' || char === '?' || char === '!') delay += 185 + Math.random() * 115;
      if (char === '\n') delay += 215 + Math.random() * 150;
      if (char === '✨' || char === '🚀' || char === '😊' || char === '💡') delay += 130;

      const next = characters[index + 1] || '';
      if (char === '\n' && next === '\n') delay += 150;
      return delay;
    }

    function createPixieShell() {
      traceFunction('createPixieShell');
      const row = document.createElement('div');
      row.className = 'message-row pixie';

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      row.appendChild(bubble);
      return { row, bubble };
    }

    function wait(ms) {
      traceFunction('wait');
      return new Promise((resolve) => window.setTimeout(resolve, ms));
    }

    function renderFormattedText(element, text) {
      traceFunction('renderFormattedText');
      try {
        if (!element) return;
        const escaped = escapeHtml(text);
        const withLinks = escaped.replace(/\[([^\]]+)\]\((tel:[^)]+|https?:\/\/[^)]+)\)/g, (match, label, href) => {
          const safeHref = sanitizeHref(href.replace(/&amp;/g, '&'));
          if (!safeHref) return label;
          const target = safeHref.startsWith('http') ? ' target="_blank" rel="noopener noreferrer"' : '';
          return `<a href="${safeHref}"${target}>${label}</a>`;
        });
        element.innerHTML = withLinks
          .replace(/\n/g, '<br>')
          .replace(/\[\[CONTACT_CARDS\]\]/g, getContactCardsHtml());
      } catch (error) {
        logChatError('renderFormattedText failed', error);
        if (element) element.textContent = String(text || '');
      }
    }

    function escapeHtml(value) {
      traceFunction('escapeHtml');
      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function stripInteractiveTokens(text) {
      traceFunction('stripInteractiveTokens');
      return String(text || '').replace(/\n?\[\[CONTACT_CARDS\]\]/g, '').trimEnd();
    }

    function getContactCardsHtml() {
      traceFunction('getContactCardsHtml');
      try {
        const team = Array.isArray(KNOWLEDGE_BASE.team) ? KNOWLEDGE_BASE.team : [];
        return `<div class="contact-card-grid">${team.map((member) => `
        <article class="contact-card">
          <div class="contact-name">${escapeHtml(member.name)}</div>
          <div class="contact-role">${escapeHtml(member.label)}</div>
          <div class="contact-actions">
            <a class="contact-action call" href="${sanitizeHref(member.callLink)}">Call</a>
            <a class="contact-action whatsapp" href="${sanitizeHref(member.whatsappLink)}" target="_blank" rel="noopener noreferrer">WhatsApp</a>
          </div>
        </article>
      `).join('')}</div>`;
      } catch (error) {
        logChatError('contact card generation failed', error);
        return '';
      }
    }

    function sanitizeHref(value) {
      traceFunction('sanitizeHref');
      const href = String(value || '').trim();
      if (/^(tel:|https?:\/\/)/i.test(href)) return href.replace(/"/g, '&quot;');
      return '';
    }

    function safeCreatePixieReply(rawMessage) {
      traceFunction('safeCreatePixieReply');
      try {
        discovery = sanitizeDiscovery(discovery);
        const reply = createPixieReply(String(rawMessage || ''));
        return String(reply || getFallbackReply());
      } catch (error) {
        logChatError('response generation failed', error);
        return getFallbackReply();
      }
    }

    function getFallbackReply() {
      traceFunction('getFallbackReply');
      return "I’m still here ✨\n\nSomething went wrong while preparing that answer, but the chat is okay. Please send that message again or tell me what you want to build — website, app, software, automation, or AI solution.";
    }

    function createPixieReply(rawMessage) {
      traceFunction('createPixieReply');
      const text = rawMessage.trim();
      const message = normalize(text);
      const previousStage = discovery.stage;

      if (isReset(message)) {
        discovery = { ...defaultDiscovery };
        saveDiscovery();
        return "Fresh start ✨\n\nWhat are you trying to build — a website, mobile app, software platform, automation, AI solution, or are you not sure yet?";
      }

      if (isLeadCaptureActive()) {
        return handleLeadCapture(text);
      }

      if (isGreeting(message) && message.length <= 12 && history.filter((item) => item.role === 'user').length <= 1) {
        return "Hey 👋\n\nI’m Pixie — the digital consultant inside this Pixel Code Media portfolio.\n\nYou can ask me about the team, services, pricing, or tell me what you want to build.";
      }

      const knowledgeReply = getKnowledgeReply(message);
      if (knowledgeReply) return withLeadConversion(message, knowledgeReply, {
        reason: getLeadConversionReason(message),
        explicit: isContactIntent(message)
      });

      if (isClearlyUnrelated(message) || !isBusinessRelevant(message)) {
        return getBusinessOnlyRedirect();
      }

      const wantsResult = matches(message, ['generate', 'summary', 'proposal', 'estimate', 'quote', 'result', 'recommendation', 'recommend']) ||
        (matches(message, ['cost', 'budget', 'timeline', 'price', 'how long']) && hasEnoughForSnapshot());

      const insight = analyzeMessage(text, previousStage);
      updateDiscovery(text, insight, previousStage);

      if (wantsResult && hasMinimumForSnapshot()) {
        if (!hasLeadDetails()) return askForLeadDetails();
        discovery.resultGenerated = true;
        discovery.stage = 'complete';
        saveDiscovery();
        return generateProjectSnapshot();
      }

      const nextStage = getNextStage();
      discovery.stage = nextStage;
      saveDiscovery();

      if (nextStage === 'complete') {
        if (!hasLeadDetails()) return askForLeadDetails();
        discovery.resultGenerated = true;
        saveDiscovery();
        return generateProjectSnapshot();
      }

      return withLeadConversion(message, buildDiscoveryReply(insight, previousStage, nextStage), {
        reason: isDiscoveryRequest(message) ? 'project' : getLeadConversionReason(message),
        force: isDiscoveryRequest(message)
      });
    }

    function withLeadConversion(message, reply, options = {}) {
      traceFunction('withLeadConversion');
      const reason = options.reason || getLeadConversionReason(message);
      const explicit = Boolean(options.explicit);
      const force = Boolean(options.force);

      if (!shouldOfferContact(message, { reason, explicit, force })) return reply;

      if (!explicit) {
        discovery.contactOfferCount = (discovery.contactOfferCount || 0) + 1;
        discovery.lastContactOfferTurn = getUserTurnCount();
        saveDiscovery();
      }

      return `${reply}\n\n${getSoftContactCTA(reason)}\n\n[[CONTACT_CARDS]]`;
    }

    function shouldOfferContact(message, options = {}) {
      traceFunction('shouldOfferContact');
      if (options.explicit) return true;
      const reason = options.reason || getLeadConversionReason(message);
      if (!reason && !options.force) return false;

      const count = discovery.contactOfferCount || 0;
      const lastTurn = typeof discovery.lastContactOfferTurn === 'number' ? discovery.lastContactOfferTurn : -99;
      const turn = getUserTurnCount();

      if (count >= 2) return false;
      if (!options.force && turn - lastTurn < 3) return false;
      if (options.force && count > 0 && turn - lastTurn < 2) return false;

      return true;
    }

    function getLeadConversionReason(message) {
      traceFunction('getLeadConversionReason');
      if (isContactIntent(message)) return 'contact';
      if (isCostIntent(message)) return 'pricing';
      if (isHireOrQuoteIntent(message)) return 'quote';
      if (matches(message, ['timeline', 'how long', 'deadline', 'delivery time'])) return 'timeline';
      if (isDiscoveryRequest(message)) return 'project';
      if (isCapabilityIntent(message)) return 'capability';
      if (isHighIntent(message)) return 'general';
      return null;
    }

    function isBusinessRelevant(message) {
      traceFunction('isBusinessRelevant');
      if (hasActiveBusinessContext()) return true;
      if (isHighIntent(message) || isDiscoveryRequest(message) || isCostIntent(message) || isTimelineIntent(message)) return true;
      if (detectProjectType(message) || detectIndustry(message) || detectGoal(message, discovery.stage)) return true;

      const parts = text.split(/[\n,;]/).map((part) => cleanSentence(part)).filter(Boolean);

    function detectTimeline(message, previousStage) {
      traceFunction('detectTimeline');
      const timePattern = /\b(\d+\s*(day|days|week|weeks|month|months)|\d+\s*-\s*\d+\s*(week|weeks|month|months))\b/i;
      const match = message.match(timePattern);
      if (match) return match[0];
      if (matches(message, ['urgent', 'asap', 'immediately', 'soon'])) return 'urgent / as soon as possible';
      if (matches(message, ['few weeks'])) return 'a few weeks';
      if (matches(message, ['1-2 months', '1 to 2 months', 'one to two months'])) return '1–2 months';

    function detectBudget(message, previousStage) {
      traceFunction('detectBudget');
      const hasBudgetSignal = /(₹|rs\.?|inr|budget|price|cost|quote|k\b|lakh|Lakhs|crore|cr\b|thousand|rupees|premium|affordable|cheap)/i.test(message);
      const looksLikeTimeline = /\b(day|days|week|weeks|month|months|urgent|asap|deadline)\b/i.test(message);

      if (matches(message, ['low budget', 'small budget', 'cheap', 'affordable'])) return 'low / lean budget';
      if (matches(message, ['medium budget', 'moderate'])) return 'medium budget';
      if (matches(message, ['premium', 'high budget', 'enterprise'])) return 'premium budget';
      if (matches(message, ['not sure', 'no budget', 'unknown']) && previousStage === 'budget') return 'not sure yet';

      if (!hasBudgetSignal && previousStage !== 'budget') return null;
      if (looksLikeTimeline && !hasBudgetSignal) return null;

      const budgetPattern = /((₹|rs\.?|inr)?\s*\d+[\d,]*(\.\d+)?\s*(k|lakh|Lakhs|crore|cr|thousand|rupees)?)(\s*(-|to)\s*(₹|rs\.?|inr)?\s*\d+[\d,]*(\.\d+)?\s*(k|lakh|Lakhs|crore|cr|thousand|rupees)?)?/i;
      const match = message.match(budgetPattern);
      if (match) return match[0].trim();

      if (previousStage === 'budget' && message.length > 1 && !looksLikeTimeline) return cleanSentence(message);
      return null;
    }

    function getObjectionReply(key){traceFunction('getObjectionReply');const ind=displayIndustry(discovery.industry), play=getPlaybook(discovery.industry);if(key==='expensive')return`Totally fair — if something feels expensive, it should be questioned, not forced 😊\n\nFor ${withArticle(ind)}, I’d judge value before price. Requirements, complexity, features, integrations, design quality, content readiness, and timeline affect pricing.\n\nA safer path is phased:\n• Phase 1: smallest useful version\n• Phase 2: automation/reporting after usage\n• Phase 3: advanced features only if ROI is clear\n\nNo pressure — build only where it clearly saves time, improves trust, or brings enquiries.`;
      if(key==='noWebsite')return`That can be completely valid. Not every business needs a website immediately.\n\nA website helps when you need Google visibility, trust before a call, service explanation, enquiry capture, appointment flow, or campaign landing pages. If referrals and WhatsApp already convert well, we may start smaller — maybe Google Business Profile, a one-page landing page, or WhatsApp enquiry automation.\n\nAdvisor-first answer: build only if it supports a real goal.`;
      if(key==='alreadyWhatsapp')return`WhatsApp is a strength, especially for Indian SMEs. I wouldn’t replace it.\n\nThe opportunity is to make WhatsApp more organised: enquiry source tracking, auto-replies, follow-up reminders, lead status labels, missed enquiry recovery, and a simple CRM/dashboard behind it.\n\nSo the question is not “website or WhatsApp?” It’s “how do we stop losing WhatsApp leads?”`;
      if(key==='smallBusiness')return`Small businesses should be careful with digital spending — I agree.\n\nFor ${withArticle(ind)}, I’d avoid a big system at the start. Start with a trust-building page, WhatsApp/call lead capture, a basic enquiry tracker, or one automation that saves daily time.\n\nStart lean, prove value, then scale.`;
      if(key==='noSoftware')return`That’s reasonable. Software is not automatically needed.\n\nYou need software only when manual work becomes hard to control — repeated follow-ups, missed payments, scattered data, staff dependency, reporting delays, or too much Excel cleanup.\n\nIf operations are simple, improve the process first. If it becomes repetitive, build module by module.`;
      if(key==='alreadyExcel')return`Excel is a good starting point — many businesses should start there.\n\nThe warning signs are multiple people editing, missed follow-ups, slow reports, duplicated data, poor mobile access, or no live status for the owner.\n\nA custom system should not replace Excel for style; it should replace the messy parts with a cleaner workflow.`;
      if(key==='customersNoWebsite')return`That may be true for direct buying behaviour. Many customers may not “use websites” daily.\n\nBut websites often support trust silently: Google search, Maps, reviews, service proof, photos, package clarity, and a quick path to WhatsApp/call.\n\nIf needed, build it as a trust + enquiry bridge, not a brochure.`;
      if(key==='noBudget'){const idea=play?`start with ${listFew(play.leads,1)} or ${listFew(play.automation,1)}`:'improve Google Business Profile and track WhatsApp enquiries';return`No problem — then the priority is clarity, not spending.\n\nBefore development, ${idea}, collect reviews, and track every enquiry source for 2–3 weeks.\n\nWhen there is budget, build the part that already shows business value. That keeps risk low.`}return`No pressure. Tell me the concern and I’ll suggest the least risky digital path.`}
    function isSupportIntent(message){traceFunction('isSupportIntent');return matches(message,['support','maintenance','after launch','post launch','bug fixing','updates','hosting support','do you provide support'])}
    function isMarketingBrandingIntent(message){traceFunction('isMarketingBrandingIntent');return matches(message,['digital marketing','marketing','lead generation','seo','ads','branding','brand identity','logo','ui ux','ui/ux','user experience','prototype'])}
    function getSupportReply(){traceFunction('getSupportReply');return`Yes — support can be provided after launch.\n\nThe support model depends on the project. Websites may need content, maintenance, hosting, and updates. Apps/software may need bug fixes, backups, monitoring, security checks, and feature improvements.\n\nSupport scope, response time, and monthly cost should be agreed clearly because requirements and complexity affect effort.`}
    function getMarketingBrandingReply(message){traceFunction('getMarketingBrandingReply');if(matches(message,['branding','brand','logo','identity']))return`Yes — branding can be planned as part of digital growth. Branding is not just a logo; it is positioning, trust, visual consistency, messaging, and how customers remember you.\n\nA practical branding direction should answer: who should trust you, why should they choose you, and where will the brand appear most?`;if(matches(message,['ui ux','ui/ux','ux','interface','user experience','prototype']))return`Yes — UI/UX is core for websites, apps, and software. Good UX reduces confusion, improves conversion, and makes staff workflows easier.\n\nThe first step is mapping the main user journey and designing key screens before development.`;return`Yes — digital marketing and lead generation can be planned around the business goal.\n\nFor Indian SMEs, marketing works best when connected to a funnel: landing page/website → WhatsApp/call enquiry → source tracking → follow-up reminders → simple CRM/reporting.`}

    function createPixieReply(rawMessage){traceFunction('createPixieReply');const text=rawMessage.trim(),message=normalize(text),previousStage=discovery.stage;if(isReset(message)){discovery={...defaultDiscovery};pixieVariationMemory=Object.create(null);saveDiscovery();return`Fresh start ✨\n\n${variation('greetings')}`}if(isLeadCaptureActive())return handleLeadCapture(text);if(isGreeting(message)&&message.length<=18&&history.filter(i=>i.role==='user').length<=1)return variation('greetings');const insight=analyzeMessage(text,previousStage),objection=detectObjection(message);if(objection){if(insight.projectType||insight.industry||insight.goal||insight.audience||insight.features.length||insight.timeline||insight.budget){updateDiscovery(text,insight,previousStage);discovery.stage=getNextStage();saveDiscovery()}return`${getObjectionReply(objection)}\n\n${variation('closings')}`}if(isClearlyUnrelated(message)||!isBusinessRelevant(message))return getBusinessOnlyRedirect();const fresh=Boolean(insight.projectType||insight.industry||insight.goal||insight.audience||insight.features.length||insight.timeline||insight.budget);if(fresh&&(isCostIntent(message)||isTimelineIntent(message)||isCapabilityIntent(message)||isHireOrQuoteIntent(message))){updateDiscovery(text,insight,previousStage);discovery.stage=getNextStage();saveDiscovery()}const knowledgeReply=getKnowledgeReply(message);if(knowledgeReply)return withLeadConversion(message,advisorWrap(knowledgeReply,message),{reason:getLeadConversionReason(message),explicit:isContactIntent(message)});const wantsResult=matches(message,['generate','summary','proposal','estimate','quote','result','recommendation','recommend','plan','snapshot'])||(matches(message,['cost','budget','timeline','price','how long'])&&hasEnoughForSnapshot());if(!(fresh&&(isCostIntent(message)||isTimelineIntent(message)||isCapabilityIntent(message)||isHireOrQuoteIntent(message))))updateDiscovery(text,insight,previousStage);if(wantsResult&&hasMinimumForSnapshot()){discovery.resultGenerated=true;discovery.stage='complete';saveDiscovery();return withLeadConversion(message,generateProjectSnapshot(),{reason:'project'})}const nextStage=getNextStage();discovery.stage=nextStage;saveDiscovery();if(nextStage==='complete'){discovery.resultGenerated=true;saveDiscovery();return withLeadConversion(message,generateProjectSnapshot(),{reason:'project'})}return withLeadConversion(message,buildDiscoveryReply(insight,previousStage,nextStage),{reason:isDiscoveryRequest(message)?'project':getLeadConversionReason(message)})}
    function advisorWrap(reply,message){traceFunction('advisorWrap');if(!reply||isContactIntent(message)||isIdentityIntent(message)||isTeamIntent(message)||isWebsiteOwnerIntent(message))return reply;if(qualifyLeadIntent(message).level==='Low Intent')return reply;return`${reply}\n\n${random([variation('closings'),variation('recommendations')])}`}
    function getKnowledgeReply(message){traceFunction('getKnowledgeReply');if(isDiscoveryRequest(message))return null;if(isContactIntent(message))return getContactReply();if(isSupportIntent(message))return getSupportReply();if(isTeamIntent(message))return getTeamReply();if(isWebsiteOwnerIntent(message))return getWebsiteOwnerReply();if(isIdentityIntent(message))return getIdentityReply();if(isServicesIntent(message))return getServicesReply();if(isMarketingBrandingIntent(message))return getMarketingBrandingReply(message);if(isCapabilityIntent(message))return getCapabilityReply(message);if(isCostIntent(message))return getCostReply(message);if(isTimelineIntent(message))return getTimelineReply(message);if(isHireOrQuoteIntent(message))return getHireQuoteReply();return null}
    function withLeadConversion(message,reply,options={}){traceFunction('withLeadConversion');const reason=options.reason||getLeadConversionReason(message),explicit=Boolean(options.explicit);if(!shouldOfferContact(message,{reason,explicit}))return reply;discovery.contactOfferCount=(discovery.contactOfferCount||0)+1;discovery.lastContactOfferTurn=getUserTurnCount();saveDiscovery();return`${reply}\n\n${getSoftContactCTA(reason)}\n\n[[CONTACT_CARDS]]`}
    function shouldOfferContact(message,options={}){traceFunction('shouldOfferContact');if(options.explicit)return true;const reason=options.reason||getLeadConversionReason(message);if(!reason)return false;const count=discovery.contactOfferCount||0,last=typeof discovery.lastContactOfferTurn==='number'?discovery.lastContactOfferTurn:-99,turn=getUserTurnCount();if(count>=2||turn<2||turn-last<3)return false;if(qualifyLeadIntent(message).level!=='High Intent')return false;if(getContextScore()<3&&discovery.stage!=='complete')return false;return['pricing','quote','timeline','project','capability','general'].includes(reason)}
    function getSoftContactCTA(reason){traceFunction('getSoftContactCTA');if(reason==='contact')return'Here are the direct contact options:';if(reason==='pricing')return'Now that the basics are clearer, the team can give a more realistic estimate if you’d like.';if(reason==='quote')return'For a proper quotation, the team can review scope, complexity, features, and timeline.';if(reason==='timeline')return'If timing is important, the team can quickly check feasibility with you.';return'If this direction feels right, you can discuss it with the team without pressure.'}
    function isBusinessRelevant(message){traceFunction('isBusinessRelevant');if(hasActiveBusinessContext())return true;if(isHighIntent(message)||isDiscoveryRequest(message)||isCostIntent(message)||isTimelineIntent(message)||isMarketingBrandingIntent(message)||isSupportIntent(message))return true;if(detectProjectType(message)||detectIndustry(message)||detectGoal(message,discovery.stage))return true;return matches(message,['lead generation','grow online','online growth','digital marketing','digitize','digital transformation','operations','workflow','branding','ui ux','ui/ux'])}
    function getBusinessOnlyRedirect(){traceFunction('getBusinessOnlyRedirect');return`I’m mainly here to help with digital solutions, websites, apps, software, automation, AI, digital marketing, branding, UI/UX, lead generation, and business growth 😊\n\nIf you’re planning something for a business, tell me the industry and goal. I’ll think like an advisor, not a scripted support bot.`}
    function getServicesReply(){traceFunction('getServicesReply');const services=unique([...KNOWLEDGE_BASE.company.services,'Digital Marketing','Lead Generation Systems','Branding','UI/UX Strategy','Business Growth Consulting','Digital Transformation for Indian SMEs','WhatsApp Automation','Internal AI Tools','HRMS / Attendance / Booking / Inventory Systems']);return`Pixel Code Media can help across:\n\n${services.map(s=>`• ${s}`).join('\n')}\n\nThe value is choosing the right solution for the business problem — not forcing a website, app, or software when another path is smarter.\n\nTell me your industry and goal, and I’ll recommend the best-fit direction.`}
    function getCapabilityReply(message){traceFunction('getCapabilityReply');const type=detectProjectType(message);if(type&&PIXIE_SOLUTION_PLAYBOOK[type]){const d=PIXIE_SOLUTION_PLAYBOOK[type];return`Yes — Pixel Code Media can help with ${type.toLowerCase()} projects.\n\nPixie understands: ${d.understands.join(', ')}.\n\nA smart first version usually includes: ${d.mvp.join(', ')}.\n\nThe right scope depends on users, workflow, integrations, timeline, and budget.`}return getServicesReply()}
    function getCostReply(message){traceFunction('getCostReply');const contextual=getContextualCostReply(message);if(contextual)return contextual;const note='Pricing is not fixed. Requirements, complexity, features, integrations, design depth, content readiness, and timeline affect the final estimate.';for(const [type,d] of Object.entries(PIXIE_SOLUTION_PLAYBOOK)){const key=type.toLowerCase();if(matches(message,[key,'website','app','software','automation','ai','marketing','branding','ui ux','ui/ux'].filter(Boolean))&&((type==='Website'&&matches(message,['website','web development','landing page','ecommerce website']))||(type==='Mobile app'&&matches(message,['app','mobile app','android','ios','flutter']))||(type==='Software platform'&&matches(message,['software','platform','crm','erp','dashboard','hrms','inventory','booking system']))||(type==='AI solution'&&matches(message,['ai','chatbot','assistant','document ai','knowledge base']))||(type==='Automation'&&matches(message,['automation','whatsapp automation','email automation']))||(type==='Digital marketing'&&matches(message,['digital marketing','marketing','lead generation','seo','ads']))||(type==='Branding'&&matches(message,['branding','brand identity','logo']))||(type==='UI/UX design'&&matches(message,['ui ux','ui/ux','prototype','user experience']))))return`${type} cost depends on scope. A practical Indian range is ${d.range}.\n\nA focused first version usually includes ${d.mvp.join(', ')}.\n\n${note}`}
      return`Costs depend on what you’re building, how complex it is, and how polished it needs to feel.\n\nQuick INR guide:\n• Website: ₹6,990–₹24,990+\n• Mobile app: custom phased app pricing\n• Software: custom phased software pricing\n• Automation: custom workflow-based pricing\n• AI solution: custom affordable AI pricing\n\n${note}`}
    function getContextualCostReply(message){traceFunction('getContextualCostReply');if(matches(message,['website','app','mobile app','software','platform','crm','erp','dashboard','ai','chatbot','automation','digital marketing','branding','ui ux','ui/ux']))return null;if(!hasActiveBusinessContext())return null;const play=getPlaybook(discovery.industry),note='Requirements, complexity, features, integrations, design quality, and timeline affect pricing — this is a practical INR range, not a fixed quote.';if(discovery.industry==='tuition centres')return`For tuition centre software, cost depends on modules like students, batches, attendance, fees, staff roles, parent communication, reports, and admin dashboard.\n\nA focused first version may start around flexible module-wise pricing. A fuller platform with parent/student portal, payments, automation, and advanced reports can go higher. If the goal is admissions only, a conversion-focused website may start around ₹6,990–₹14,990 and move toward ₹24,990+ with stronger lead systems.\n\n${note}`;if(play)return`For ${withArticle(displayIndustry(discovery.industry))}, pricing depends on whether the priority is growth, operations, or both.\n\nA website/landing page with ${listFew(play.website,2)} may start around ₹6,990–₹14,990 and move toward ₹14,990–₹24,990+. Custom software with ${listFew(play.software,3)} may start around custom module-wise pricing for a focused MVP and increase with roles, reports, APIs, and automation.\n\n${note}`;return null}
    function buildDiscoveryReply(insight,previousStage,nextStage){traceFunction('buildDiscoveryReply');return[getUnderstanding(insight,previousStage),getStrategicInsight(nextStage),getRecommendation(nextStage),getQuestion(nextStage)].filter(Boolean).join('\n\n')}
    function getStrategicInsight(nextStage){traceFunction('getStrategicInsight');const play=getPlaybook(discovery.industry);if(play&&discovery.goal)return`Business consultant view: the opportunity is probably around ${listFew(play.leads,1)} and ${listFew(play.automation,1)}. But I’d validate the core workflow before adding too many features.`;if(discovery.projectType&&PIXIE_SOLUTION_PLAYBOOK[discovery.projectType])return`Architecture view: ${discovery.projectType} projects work best when version one focuses on ${listFew(PIXIE_SOLUTION_PLAYBOOK[discovery.projectType].mvp,3)}. Everything else can be phased.`;if(nextStage==='budget')return'For Indian SMEs, the safest approach is: validate demand → capture leads properly → reduce one manual workflow → add software/automation only where it saves time or increases revenue.';return null}
    function getRecommendation(nextStage){traceFunction('getRecommendation');const play=getPlaybook(discovery.industry),goal=normalize(discovery.goal||'');const line=getIndustryConsultantLine(nextStage);if(line)return line;if(play&&goal){if(matches(goal,['lead','growth','customer','admission','appointment']))return`${variation('recommendations')}\n\nFor ${withArticle(displayIndustry(discovery.industry))}, I’d lean toward ${listFew(play.website,3)} plus follow-up automation like ${listFew(play.automation,2)}.`;if(matches(goal,['management','operation','tracking','report']))return`${variation('recommendations')}\n\nThis sounds like an operations system: ${listFew(play.software,4)} matters more than a brochure-style website.`}if(nextStage==='project_type')return'I’d choose the solution based on the business problem first: website for visibility/trust, app for repeat mobile usage, software for operations, automation for repeated manual work, AI for guided decisions, and marketing/branding/UI-UX for growth and perception.';return variation('recommendations')}
    function getIndustryConsultantLine(nextStage){traceFunction('getIndustryConsultantLine');const play=getPlaybook();if(!play)return null;const ind=displayIndustry(discovery.industry);if(nextStage==='goal')return`For ${withArticle(ind)}, common pressure points are ${listFew(play.problems,3)}. The right solution depends on which pain is most costly now.`;if(nextStage==='features')return`I’d split features into growth and operations. Growth could be ${listFew(play.website,3)}; operations could be ${listFew(play.software,3)}.`;if(nextStage==='budget')return`For budget planning, start with immediate value, then add automation like ${listFew(play.automation,2)} after the core flow works.`;return null}
    function getQuestion(stage){traceFunction('getQuestion');const q={clinics:'Is the main goal more appointments, patient follow-up, clinic management, reviews, or staff scheduling?',hospitals:'Is the main goal OP appointments, doctor scheduling, patient follow-up, or hospital workflow?',restaurants:'Is the main goal menu visibility, online orders, table bookings, offers, or repeat customers?',manufacturing:'Is the main goal B2B enquiries, product catalog, quotation tracking, inventory, or production status?',logistics:'Is the main goal shipment enquiries, tracking, booking management, driver coordination, or client reporting?',builders:'Is the main goal project enquiries, site visit bookings, unit inventory, broker coordination, or buyer follow-up?','service businesses':'Is the main goal local enquiries, quote requests, booking slots, staff assignment, follow-up, or reviews?'};if(stage==='project_type')return'What are you trying to build — website, mobile app, software platform, automation, AI solution, digital marketing, branding, UI/UX, or not sure yet?';if(stage==='industry')return'Which industry is this for? For example: tuition centre, school, recruitment, clinic, hospital, home nursing, retail, real estate, builder, construction, interior design, travel, manufacturing, logistics, restaurant, gym, or service business.';if(stage==='goal')return q[discovery.industry]||'What’s the main goal: get more customers, manage operations, automate work, add AI, improve branding/UI, take bookings/payments, or something else?';if(stage==='audience')return'Who will use this most — customers, staff, admins, students/parents, patients, candidates, agents, vendors, clients, or management?';if(stage==='features')return'What features feel important for version one? You can list booking, payments, dashboard, reports, CRM, attendance, inventory, notifications, WhatsApp, AI assistant — or say “not sure.”';if(stage==='timeline')return'When would you ideally like this to go live — urgently, in a few weeks, 1–2 months, 3+ months, or no fixed deadline?';if(stage==='budget')return'Do you have a rough INR budget range in mind — low, medium, premium, ₹6,990, ₹9,990, ₹14,990, ₹24,990, or “not sure”?';return'Want me to turn this into a suggested solution, timeline, budget estimate, and growth plan?'}
    function askForLeadDetails(){traceFunction('askForLeadDetails');discovery.askedLeadCapture=true;discovery.stage='complete';discovery.leadStage=getNextLeadStage();saveDiscovery();return`I have enough to create a useful project snapshot ✨\n\nYou can send your name, phone, email, and business name — or type “show plan” and I’ll show the recommendation without contact details.\n\nNo pressure — the plan comes first.`}
    function detectProjectType(message){traceFunction('detectProjectType');if(matches(message,['not sure','unsure',"don't know",'dont know','idk','no idea']))return'not sure yet';if(matches(message,['digital marketing','marketing campaign','seo','ads','lead generation','growth campaign']))return'Digital marketing';if(matches(message,['branding','brand identity','logo','brand design']))return'Branding';if(matches(message,['ui ux','ui/ux','ux design','prototype','wireframe','interface design']))return'UI/UX design';if(matches(message,['ai','chatbot','assistant','gpt','machine learning','ml','recommendation engine','document ai','knowledge base']))return'AI solution';if(matches(message,['automation','automate','workflow','zapier','integration','integrations','whatsapp automation','email automation']))return'Automation';if(matches(message,['mobile app','ios','android','native app','flutter app','staff app','business app']))return'Mobile app';if(matches(message,['software platform','platform','saas','portal','dashboard','crm','erp','hrms','attendance system','fee management','student management','recruitment system','clinic management','inventory system','booking system','management system','admin system']))return'Software platform';if(matches(message,['website','web site','landing page','site','webpage','ecommerce website','e-commerce website','portfolio website','appointment website','school website','clinic website','recruitment website']))return'Website';if(matches(message,['app']))return'Mobile app';return null}
    function detectIndustry(message){traceFunction('detectIndustry');const industries=[['coaching institutes',['coaching institute','coaching centre','neet coaching','jee coaching','ielts coaching']],['tuition centres',['tuition','tuition centre','tuition center','tutoring','learning centre']],['kindergartens',['kindergarten','preschool','play school','playschool','nursery school']],['overseas recruitment',['overseas recruitment','manpower agency','gulf recruitment','abroad recruitment']],['dental clinics',['dental clinic','dentist','dental hospital','orthodontic','implant clinic']],['eye hospitals',['eye hospital','eye clinic','ophthalmology','lasik','cataract']],['home nursing',['home nursing','home care','elder care','caregiver','nursing service','nurse at home']],['clinics',['clinic','clinics','doctor clinic','polyclinic']],['hospitals',['hospital','hospitals','medical centre','medical center']],['builders',['builder','builders','real estate developer','flat project','apartment project']],['interior design',['interior design','interior designer','interiors','renovation design']],['real estate',['real estate','property','properties','realtor','broker','apartment','rental']],['recruitment',['recruitment','hiring','staffing','hr','jobs','job portal','candidate']],['construction',['construction','contractor','civil work','architecture firm','construction company']],['manufacturing',['manufacturing','factory','industrial','manufacturer','production unit']],['logistics',['logistics','transport','courier','shipping','fleet','warehouse','delivery company']],['restaurants',['restaurant','restaurants','cafe','hotel','food business','cloud kitchen','bakery']],['schools',['school','schools','academy','college']],['travel',['travel agency','travel','tour','tourism','holiday','trip','booking agency']],['gyms',['gym','fitness centre','fitness center','fitness studio','health club']],['retail',['retail','shop','store','ecommerce','e-commerce','boutique','supermarket']],['service businesses',['service business','salon','spa','repair service','cleaning service','agency']],['local businesses',['local business','small business','local shop','local service']],['other businesses',['business','company','other']]];for(const [ind,keys] of industries){if(matches(message,keys))return ind}return null}
    function displayIndustry(industry){traceFunction('displayIndustry');if(!industry)return'your business';if(discovery.industryDetail)return discovery.industryDetail;const labels={'tuition centres':'tuition centre','coaching institutes':'coaching institute',schools:'school',kindergartens:'kindergarten',healthcare:'healthcare business',clinics:'clinic',hospitals:'hospital','dental clinics':'dental clinic','eye hospitals':'eye hospital',recruitment:'recruitment business','overseas recruitment':'overseas recruitment agency','home nursing':'home nursing service',travel:'travel agency','real estate':'real estate business',builders:'builder / real estate developer',construction:'construction company','interior design':'interior design business',gyms:'gym or fitness business',retail:'retail business',manufacturing:'manufacturing business',logistics:'logistics business',restaurants:'restaurant or food business','service businesses':'service business','local businesses':'local business','other businesses':'business'};return labels[industry]||industry}



    function estimateBudgetV3Marker(){return true}
    function suggestSolution(){traceFunction('suggestSolution');const ind=discovery.industry, type=discovery.projectType, play=getPlaybook(ind), biz=discovery.industryDetail||displayIndustry(ind);if(type&&PIXIE_SOLUTION_PLAYBOOK[type]){const d=PIXIE_SOLUTION_PLAYBOOK[type];if(play)return`A ${type.toLowerCase()} direction for ${biz}, focused on ${listFew(d.mvp,3)} and supported by industry needs like ${listFew(play.website.concat(play.software),3)}.`;return`A practical ${type.toLowerCase()} for ${biz}, starting with ${listFew(d.mvp,4)} and expanding only after the core value is proven.`}if(play)return`A practical digital growth + operations setup for ${biz}: use ${listFew(play.website,3)} for trust/leads and ${listFew(play.software,3)} if daily management is painful.`;return`A practical digital solution for ${biz}: start with the core customer or operations workflow, then expand into automation, reporting, and AI when useful.`}
    function suggestFeatures(){traceFunction('suggestFeatures');const ind=discovery.industry,type=discovery.projectType,play=getPlaybook(ind),features=[];if(play){const goal=normalize(discovery.goal||'');if(goal.includes('lead')||goal.includes('growth')||goal.includes('customer')||goal.includes('admission')||goal.includes('appointment'))features.push(...play.website,...play.leads,...play.automation);else if(goal.includes('management')||goal.includes('operation')||goal.includes('tracking')||goal.includes('report'))features.push(...play.software,...play.automation);else features.push(...play.website.slice(0,3),...play.software.slice(0,3),...play.automation.slice(0,2))}if(type&&PIXIE_SOLUTION_PLAYBOOK[type])features.push(...PIXIE_SOLUTION_PLAYBOOK[type].mvp);features.push(...(discovery.features||[]));if(!features.length)features.push('Lead/request capture','Admin dashboard','Core workflow management','Reports','Notifications','WhatsApp/call actions');return unique(features).slice(0,9)}
