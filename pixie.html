      return buildUnifiedDiscoveryResponse(state, lang, 'default');
    }

    function createEmptyUnifiedState() {
      traceFunction('createEmptyUnifiedState');
      return {
        businessOwner: null,
        businessType: null,
        industry: null,
        primaryGoal: null,
        currentChallenges: [],
        leadSource: null,
        websiteExists: null,
        existingSystems: [],
        targetCustomers: null,
        growthStage: null,
        budget: null,
        timeline: null,
        decisionMakerStatus: null,
        solutionInterest: null,
        numberOfUsers: null,
        integrations: [],
        automationNeeds: [],
        aiRequirements: null,
        securityRequirements: null,
        customDevelopment: null,
        competitorContext: null,
        previousAnswers: {},
        askedFields: [],
        questionHistory: [],
        lastQuestionField: null,
        lastQuestionText: null,
        knownFacts: [],
        missingInfo: [],
        languagePreference: 'en',
        updatedAt: new Date().toISOString()
      };
    }

    function resetUnifiedConversationState(lang = 'en') {
      traceFunction('resetUnifiedConversationState');
      discovery = { ...defaultDiscovery };
      discovery.businessProfile = createEmptyBusinessProfile();
      discovery.unifiedState = createEmptyUnifiedState();
      discovery.unifiedState.languagePreference = lang;
      discovery.stage = 'business_discovery';
      pixieVariationMemory = Object.create(null);
      saveDiscovery();
    }

    function loadUnifiedConversationState() {
      traceFunction('loadUnifiedConversationState');
      ensureConsultantProfile();
      const saved = discovery.unifiedState && typeof discovery.unifiedState === 'object' ? discovery.unifiedState : {};
      const state = { ...createEmptyUnifiedState(), ...saved };
      ['currentChallenges','existingSystems','integrations','automationNeeds','askedFields','questionHistory','knownFacts','missingInfo'].forEach((k) => {
        state[k] = Array.isArray(state[k]) ? state[k] : [];
      });
      state.previousAnswers = state.previousAnswers && typeof state.previousAnswers === 'object' ? state.previousAnswers : {};
      discovery.unifiedState = state;
      return state;
    }

    function rebuildUnifiedStateFromHistory(state) {
      traceFunction('rebuildUnifiedStateFromHistory');
      // Keep durable question memory, but re-read facts from the conversation so reasoning does not reset.
      const durable = {
        askedFields: unique(state.askedFields || []),
        questionHistory: Array.isArray(state.questionHistory) ? state.questionHistory.slice(-20) : [],
        previousAnswers: { ...(state.previousAnswers || {}) },
        lastQuestionField: state.lastQuestionField,
        lastQuestionText: state.lastQuestionText,
        languagePreference: state.languagePreference || 'en'
      };
      const fresh = createEmptyUnifiedState();
      Object.assign(state, fresh, durable);

      const safeHistory = Array.isArray(history) ? history : [];
      safeHistory.forEach((item) => {
        if (!item || item.role !== 'user') return;
        const t = String(item.text || '').trim();
        if (!t) return;
        extractUnifiedFacts(state, t, normalize(t), false);
      });
      refreshUnifiedKnownMissing(state);
    }

    function updateUnifiedStateFromMessage(state, text, message) {
      traceFunction('updateUnifiedStateFromMessage');
      // If the previous turn asked one field, treat this answer as evidence for that field first.
      if (state.lastQuestionField && text.length > 0) {
        applyAnswerToUnifiedField(state, state.lastQuestionField, text, message);
      }
      extractUnifiedFacts(state, text, message, true);
      state.updatedAt = new Date().toISOString();
      refreshUnifiedKnownMissing(state);
    }

    function extractUnifiedFacts(state, text, message, isCurrent) {
      traceFunction('extractUnifiedFacts');
      const ind = detectIndustry(message);
      const project = detectProjectType(message);
      const budget = detectBudget(message, discovery.stage || 'business_discovery') || detectBudgetExpectation(message);
      const timeline = detectTimeline(message, discovery.stage || 'business_discovery');
      const stage = detectGrowthStage(message);
      const decision = detectDecisionMakerStatus(message);
      const systems = detectExistingSystems(message);
      const challenges = detectCurrentChallenges(message);
      const goals = detectBusinessGoals(message, detectGoal(message, discovery.stage || 'business_discovery'));
      const customers = detectTargetCustomers(message, detectAudience(message, discovery.stage || 'business_discovery'));
      const bType = detectBusinessType(message, project);
      const automation = detectAutomationOpportunities(message).map((o) => o.label);
      const competitors = extractCompetitorNames(text);

      if (ind) state.industry = displayIndustry(ind);
      if (bType) state.businessType = bType;
      if (project) state.solutionInterest = project;
      if (budget) state.budget = budget;
      if (timeline) state.timeline = timeline;
      if (stage) state.growthStage = stage;
      if (decision) state.decisionMakerStatus = decision;
      if (systems.length) state.existingSystems = unique([...state.existingSystems, ...systems]).slice(0, 10);
      if (challenges.length) state.currentChallenges = unique([...state.currentChallenges, ...challenges]).slice(0, 10);
      if (goals.length) state.primaryGoal = state.primaryGoal || goals[0];
      if (goals.length) state.businessGoals = unique([...(state.businessGoals || []), ...goals]).slice(0, 10);
      if (customers) state.targetCustomers = customers;
      if (automation.length) state.automationNeeds = unique([...state.automationNeeds, ...automation]).slice(0, 10);
      if (competitors.length) state.competitorContext = competitors.join(', ');

      if (matches(message, ['i am owner', "i'm owner", 'owner', 'founder', 'my business', 'business owner'])) state.businessOwner = true;
      if (matches(message, ['not owner', 'for my client', 'client project'])) state.businessOwner = false;
      if (matches(message, ['website exists', 'already have website', 'we have website', 'existing website', 'old website'])) state.websiteExists = true;
      if (matches(message, ['no website', "don't have website", 'dont have website', 'website illa', 'website nahi'])) state.websiteExists = false;
      if (matches(message, ['instagram', 'facebook', 'google ads', 'seo', 'referral', 'walk in', 'walk-in', 'phone calls', 'whatsapp'])) state.leadSource = extractLeadSourceLabel(message) || state.leadSource;
      if (matches(message, ['ai', 'chatbot', 'voice agent', 'document extraction', 'assistant'])) state.aiRequirements = 'AI requirement mentioned';
      if (matches(message, ['security', 'secure', 'permission', 'permissions', 'patient records', 'finance', 'government', 'kyc', 'medical'])) state.securityRequirements = 'stronger security / permissions likely';
      if (matches(message, ['custom', 'custom development', 'portal', 'dashboard', 'admin panel', 'software platform'])) state.customDevelopment = true;

      const users = text.match(/\b(\d+\s*(users|staff|employees|admins|branches|students|patients|agents|team members))\b/i);
      if (users) state.numberOfUsers = users[0];
    }

    function extractLeadSourceLabel(message) {
      traceFunction('extractLeadSourceLabel');
      const sources = [];
      if (matches(message, ['instagram'])) sources.push('Instagram');
      if (matches(message, ['facebook'])) sources.push('Facebook');
      if (matches(message, ['google ads'])) sources.push('Google Ads');
      if (matches(message, ['seo', 'google search'])) sources.push('Google/Search');
      if (matches(message, ['referral', 'word of mouth'])) sources.push('referrals');
      if (matches(message, ['walk in', 'walk-in'])) sources.push('walk-ins');
      if (matches(message, ['phone calls'])) sources.push('phone calls');
      if (matches(message, ['whatsapp'])) sources.push('WhatsApp');
      return sources.length ? sources.join(', ') : null;
    }

    function applyAnswerToUnifiedField(state, field, text, message) {
      traceFunction('applyAnswerToUnifiedField');
      const answer = cleanSentence(text);
      if (!answer) return;
      state.previousAnswers[field] = answer;
      if (field === 'businessType' && !state.businessType) state.businessType = answer;
      if (field === 'industry' && !state.industry) state.industry = answer;
      if (field === 'primaryGoal' && !state.primaryGoal) state.primaryGoal = answer;
      if (field === 'currentChallenges' && !state.currentChallenges.length) state.currentChallenges = [answer];
      if (field === 'existingSystems' && !state.existingSystems.length) state.existingSystems = [answer];
      if (field === 'targetCustomers' && !state.targetCustomers) state.targetCustomers = answer;
      if (field === 'growthStage' && !state.growthStage) state.growthStage = answer;
      if (field === 'budget' && !state.budget) state.budget = answer;
      if (field === 'timeline' && !state.timeline) state.timeline = answer;
      if (field === 'decisionMakerStatus' && !state.decisionMakerStatus) state.decisionMakerStatus = answer;
      if (field === 'leadSource' && !state.leadSource) state.leadSource = answer;
      if (field === 'websiteExists' && state.websiteExists == null) state.websiteExists = matches(message, ['yes', 'have', 'already']) ? true : (matches(message, ['no', 'not', 'illa', 'nahi']) ? false : answer);
    }

    function refreshUnifiedKnownMissing(state) {
      traceFunction('refreshUnifiedKnownMissing');
      const known = [];
      function add(label, value) { if (value !== null && value !== undefined && value !== '' && !(Array.isArray(value) && !value.length)) known.push(`${label}: ${Array.isArray(value) ? value.join(', ') : value}`); }
      add('Business owner', state.businessOwner === null ? null : (state.businessOwner ? 'yes' : 'no/for someone else'));
      add('Business type', state.businessType);
      add('Industry', state.industry);
      add('Primary goal', state.primaryGoal || (state.businessGoals || [])[0]);
      add('Challenges', state.currentChallenges);
      add('Lead source', state.leadSource);
      add('Website exists', state.websiteExists === null ? null : (state.websiteExists ? 'yes' : 'no'));
      add('Existing systems', state.existingSystems);
      add('Target customers', state.targetCustomers);
      add('Growth stage', state.growthStage);
      add('Budget', state.budget);
      add('Timeline', state.timeline);
      add('Decision status', state.decisionMakerStatus);
      add('Solution interest', state.solutionInterest);
      add('Users', state.numberOfUsers);
      add('Automation needs', state.automationNeeds);
      add('AI requirements', state.aiRequirements);
      add('Security requirements', state.securityRequirements);
      add('Competitors', state.competitorContext);
      state.knownFacts = known;
      state.missingInfo = getUnifiedMissingFields(state).map((x) => x.field);
    }

    function getUnifiedKnownFactCount(state) {
      traceFunction('getUnifiedKnownFactCount');
      refreshUnifiedKnownMissing(state);
      return state.knownFacts.length;
    }

    function getUnifiedMissingFields(state) {
      traceFunction('getUnifiedMissingFields');
      const p = ensureConsultantProfile();
      const fields = [];
      function missing(field, label, priority, question) {
        const alreadyKnown = isUnifiedFieldKnown(state, field);
        const alreadyAsked = (state.askedFields || []).includes(field);
        if (!alreadyKnown && !alreadyAsked) fields.push({ field, label, priority, question });
      }

      missing('businessType', 'business type', 100, 'What type of business is this?');
      missing('industry', 'industry', 95, 'Which industry are you in?');
      missing('currentChallenges', 'current challenge', 90, 'What is the main operational or growth challenge right now?');
      missing('primaryGoal', 'primary goal', 88, 'What business outcome matters most: revenue growth, acquisition, retention, time saving, cost reduction, or scale?');
      missing('existingSystems', 'existing systems', 82, 'What are you using today: WhatsApp, Excel, calls, paper records, existing software, or something else?');
      missing('targetCustomers', 'target customers', 76, 'Who is the main customer or user group this should serve?');
      missing('leadSource', 'lead source', 68, 'Where do most leads or customers come from today?');
      missing('websiteExists', 'website status', 62, 'Do you already have a website or digital presence?');
      missing('numberOfUsers', 'number of users', 58, 'Roughly how many people or roles will use this system?');
      missing('growthStage', 'growth stage', 54, 'Is the business starting, growing, scaling, or improving an established operation?');
      missing('budget', 'budget expectation', 42, 'Should the first phase be lean, growth-level, professional, or enterprise-grade?');
      missing('timeline', 'timeline', 40, 'Is there any timeline pressure, or is rollout flexible?');
      missing('decisionMakerStatus', 'decision-maker status', 35, 'Who needs to approve the direction and rollout?');

      // Context-aware priority boosts.
      if (state.currentChallenges.length || state.primaryGoal) {
        fields.forEach((f) => {
          if (f.field === 'existingSystems') f.priority += 20;
          if (f.field === 'targetCustomers') f.priority += 10;
        });
      }
      if (state.automationNeeds.length) {
        fields.forEach((f) => {
          if (f.field === 'existingSystems') f.priority += 25;
          if (f.field === 'numberOfUsers') f.priority += 12;
        });
      }
      if (state.industry && state.primaryGoal && state.currentChallenges.length) {
        fields.forEach((f) => {
          if (f.field === 'budget' || f.field === 'timeline') f.priority += 10;
        });
      }
      return fields.sort((a, b) => b.priority - a.priority);
    }

    function isUnifiedFieldKnown(state, field) {
      traceFunction('isUnifiedFieldKnown');
      if (field === 'businessType') return Boolean(state.businessType);
      if (field === 'industry') return Boolean(state.industry);
      if (field === 'currentChallenges') return Boolean(state.currentChallenges && state.currentChallenges.length);
      if (field === 'primaryGoal') return Boolean(state.primaryGoal || (state.businessGoals && state.businessGoals.length));
      if (field === 'existingSystems') return Boolean(state.existingSystems && state.existingSystems.length);
      if (field === 'targetCustomers') return Boolean(state.targetCustomers);
      if (field === 'leadSource') return Boolean(state.leadSource);
      if (field === 'websiteExists') return state.websiteExists !== null && state.websiteExists !== undefined;
      if (field === 'numberOfUsers') return Boolean(state.numberOfUsers);
      if (field === 'growthStage') return Boolean(state.growthStage);
      if (field === 'budget') return Boolean(state.budget);
      if (field === 'timeline') return Boolean(state.timeline);
      if (field === 'decisionMakerStatus') return Boolean(state.decisionMakerStatus);
      return false;
    }

    function getHighestValueUnknown(state) {
      traceFunction('getHighestValueUnknown');
      return getUnifiedMissingFields(state)[0] || null;
    }

    function recordUnifiedQuestion(state, unknown) {
      traceFunction('recordUnifiedQuestion');
      if (!unknown) return;
      state.lastQuestionField = unknown.field;
      state.lastQuestionText = unknown.question;
      state.askedFields = unique([...(state.askedFields || []), unknown.field]);
      state.questionHistory = [...(state.questionHistory || []), { field: unknown.field, question: unknown.question, at: new Date().toISOString() }].slice(-20);
      discovery.unifiedState = state;
      saveDiscovery();
    }

    function syncUnifiedStateToDiscovery(state) {
      traceFunction('syncUnifiedStateToDiscovery');
      ensureConsultantProfile();
      discovery.unifiedState = state;
      const p = discovery.businessProfile;
      if (state.businessType) p.businessType = state.businessType;
      if (state.industry) p.industry = state.industry;
      if (state.currentChallenges.length) p.currentChallenges = unique([...(p.currentChallenges || []), ...state.currentChallenges]).slice(0, 10);
      if (state.primaryGoal) p.businessGoals = unique([...(p.businessGoals || []), state.primaryGoal, ...((state.businessGoals || []))]).filter(Boolean).slice(0, 10);
      if (state.existingSystems.length) p.existingSystems = unique([...(p.existingSystems || []), ...state.existingSystems]).slice(0, 10);
      if (state.targetCustomers) p.targetCustomers = state.targetCustomers;
      if (state.growthStage) p.growthStage = state.growthStage;
      if (state.budget) p.budgetExpectations = state.budget;
      if (state.timeline) p.timeline = state.timeline;
      if (state.decisionMakerStatus) p.decisionMakerStatus = state.decisionMakerStatus;
      if (state.solutionInterest) p.solutionInterest = state.solutionInterest;
      if (state.industry) discovery.industry = normalizeIndustryLabelToKey(state.industry) || discovery.industry;
      if (state.primaryGoal) discovery.goal = state.primaryGoal;
      if (state.budget) discovery.budget = state.budget;
      if (state.timeline) discovery.timeline = state.timeline;
      if (state.targetCustomers) discovery.audience = state.targetCustomers;
      discovery.stage = state.missingInfo.length ? 'business_discovery' : 'solution_architect';
    }

    function normalizeIndustryLabelToKey(label) {
      traceFunction('normalizeIndustryLabelToKey');
      const l = normalize(label);
      for (const [key, play] of Object.entries(PIXIE_DEEP_INDUSTRY_PLAYBOOK || {})) {
        if (normalize(play.label) === l || (play.examples || []).some((x) => l.includes(normalize(x)))) return key;
      }
      return null;
    }

    function buildUnifiedDiscoveryResponse(state, lang, mode) {
      traceFunction('buildUnifiedDiscoveryResponse');
      refreshUnifiedKnownMissing(state);
      const unknown = getHighestValueUnknown(state);
      if (unknown) recordUnifiedQuestion(state, unknown);
      const known = formatUnifiedKnownFacts(state, lang);
      const question = unknown ? localizeUnifiedQuestion(unknown, lang, state) : localizeUnifiedText(lang, 'I have enough context to move into solution architecture. Should I structure the recommended solution now?');

      if (lang === 'ml') {
        return `${mode === 'greeting' ? 'നമസ്കാരം. ' : ''}ഞാൻ conversation context തുടർച്ചയായി build ചെയ്യുകയാണ്.\n\nഇപ്പോൾ അറിയുന്നത്\n${known}\n\nഇപ്പോൾ ഏറ്റവും valuable missing information:\n${question}`;
      }
      if (lang === 'hi') {
        return `${mode === 'greeting' ? 'नमस्ते। ' : ''}मैं conversation context लगातार build कर रहा/रही हूँ।\n\nअभी तक जो पता है\n${known}\n\nअभी सबसे valuable missing information:\n${question}`;
      }
      return `${mode === 'greeting' ? 'Hello. ' : ''}I’ll build the business context continuously and avoid repeating questions.\n\nWhat I know so far\n${known}\n\nHighest-value missing information\n${question}`;
    }

    function buildUnifiedConsultantResponse(state, lang, message) {
      traceFunction('buildUnifiedConsultantResponse');
      refreshUnifiedKnownMissing(state);
      const unknown = getHighestValueUnknown(state);
      if (unknown) recordUnifiedQuestion(state, unknown);
      const known = formatUnifiedKnownFacts(state, lang);
      const analysis = generateStateBasedStrategicAnalysis(state, lang);
      const question = unknown ? localizeUnifiedQuestion(unknown, lang, state) : localizeUnifiedText(lang, 'I have enough context to prepare a practical solution architecture. Should I structure it now?');
      const response = `${analysis}\n\nKnown context used\n${known}\n\nNext most valuable question\n${question}`;
      return lang === 'en' ? response : localizeUnifiedStrategicResponse(response, lang);
    }

    function generateStateBasedStrategicAnalysis(state, lang) {
      traceFunction('generateStateBasedStrategicAnalysis');
      const play = getPlaybook();
      const challenge = state.currentChallenges.length ? listFew(state.currentChallenges, 3) : 'the current business bottleneck';
      const goal = state.primaryGoal || ((state.businessGoals || [])[0]) || 'business improvement';
      const industry = state.industry || displayIndustry(discovery.industry);
      const systems = state.existingSystems.length ? listFew(state.existingSystems, 3) : 'the current process';
      const automation = state.automationNeeds.length ? listFew(state.automationNeeds, 3) : null;

      return `Strategic read\nCurrent situation: ${industry} context, with ${challenge}, aiming for ${goal}.\nRoot cause: the issue is likely workflow visibility and follow-up discipline, not just lack of a digital asset.\nOperational bottleneck: ${systems} may not be giving enough structure for ownership, status tracking, reminders, and reporting.\nTechnology opportunity: ${play ? `connect ${listFew(play.website, 2)} with ${listFew(play.software, 3)} and measured automation` : 'build structured intake, CRM/status tracking, automation where useful, and management reporting'}.${automation ? ` Detected automation angle: ${automation}.` : ''}\nBusiness impact: the priority is to increase revenue or conversion, save staff time, reduce missed work, improve customer experience, and scale operations without adding unnecessary manual load.`;
    }

    function applyStateAwareQuestionPolicy(reply, state, lang, options = {}) {
      traceFunction('applyStateAwareQuestionPolicy');
      refreshUnifiedKnownMissing(state);
      let out = cleanConsultantTone(String(reply || ''));
      const unknown = options.allowQuestion === false ? null : getHighestValueUnknown(state);
      if (!unknown) return out;
      const q = localizeUnifiedQuestion(unknown, lang, state);
      // Avoid adding a duplicate if the same field/question is already present in the response.
      if (normalize(out).includes(normalize(q)) || (state.lastQuestionField === unknown.field && (state.askedFields || []).includes(unknown.field))) return out;
      recordUnifiedQuestion(state, unknown);
      if (lang === 'ml') return `${out}\n\nNext most valuable detail\n${q}`;
      if (lang === 'hi') return `${out}\n\nNext most valuable detail\n${q}`;
      return `${out}\n\nNext most valuable detail\n${q}`;
    }

    function formatUnifiedKnownFacts(state, lang) {
      traceFunction('formatUnifiedKnownFacts');
      refreshUnifiedKnownMissing(state);
      if (!state.knownFacts.length) {
        if (lang === 'ml') return '• ഇനിയും business context confirm ചെയ്തിട്ടില്ല';
        if (lang === 'hi') return '• अभी business context confirm नहीं हुआ है';
        return '• No business facts confirmed yet';
      }
      return state.knownFacts.slice(0, 8).map((x) => `• ${x}`).join('\n');
    }

    function localizeUnifiedQuestion(unknown, lang, state) {

      const f = unknown.field;
      const play = getPlaybook();
      if (lang === 'ml') {
        const ml = {
          businessType: 'ഇത് ഏത് type business ആണ്?',

          currentChallenges: play ? `ഇപ്പോൾ main bottleneck ഏതാണ് — ${listFew(play.problems, 4)} ഇതിൽ ഏത്, അല്ലെങ്കിൽ മറ്റൊന്നോ?` : 'ഇപ്പോൾ main challenge എന്താണ് — leads, follow-up, manual work, cost, customer experience, അല്ലെങ്കിൽ scaling?',
          primaryGoal: 'ഇപ്പോൾ ഏറ്റവും പ്രധാന business outcome ഏതാണ് — revenue growth, customer acquisition, retention, time saving, cost reduction, അല്ലെങ്കിൽ scale?',
          existingSystems: 'ഇപ്പോൾ process handle ചെയ്യുന്നത് എന്തിലൂടെ ആണ് — WhatsApp, Excel, calls, paper records, existing software, അല്ലെങ്കിൽ മറ്റൊന്നോ?',
          targetCustomers: play && play.customerGroups ? `Main users ആരാണ് — ${play.customerGroups.join(', ')}, അല്ലെങ്കിൽ മറ്റാരെങ്കിലും?` : 'Main customers/users ആരാണ്?',
          leadSource: 'ഇപ്പോൾ leads/customers കൂടുതലായി എവിടെ നിന്നാണ് വരുന്നത്?',

          decisionMakerStatus: 'Direction approve ചെയ്യേണ്ടത് ആരാണ് — നിങ്ങൾ, partner, management, അല്ലെങ്കിൽ client?'
        };
        return ml[f] || unknown.question;
      }
      if (lang === 'hi') {
        const hi = {
          businessType: 'यह किस type का business है?',
          industry: 'Industry कौन सी है?',
          currentChallenges: play ? `अभी main bottleneck क्या है — ${listFew(play.problems, 4)} में से कौन सा, या कुछ और?` : 'अभी main challenge क्या है — leads, follow-up, manual work, cost, customer experience, या scaling?',
          primaryGoal: 'अभी सबसे important business outcome क्या है — revenue growth, customer acquisition, retention, time saving, cost reduction, या scale?',

    function enforceMasterSalesPolicy(reply, message) {
      traceFunction('enforceMasterSalesPolicy');
      let out = String(reply || '');

      // Remove backend/lead-capture style language. Pixie cannot store visitor data.
      const prohibited = [
        /.*send me your name.*$/ig,
        /.*send your name.*$/ig,
        /.*phone.*email.*business name.*$/ig,
        /.*what.*phone number.*$/ig,
        /.*what.*email.*$/ig,
        /.*leave your.*$/ig,
        /.*submit your.*$/ig,
        /.*our team will contact you.*$/ig,
        /.*team will contact you.*$/ig,
        /.*I’ve got what I need.*$/ig,
        /.*I've got what I need.*$/ig,
        /.*Prepared for.*$/ig
      ];
      prohibited.forEach((rx) => { out = out.replace(rx, ''); });

      // Replace old pricing with official pricing if any older engine leaked it.
      out = out.replace(/₹10,000\+/g, '₹5,999');
      out = out.replace(/₹10,000/g, '₹5,999');
      out = out.replace(/₹25,000\+/g, '₹7,999');
      out = out.replace(/₹25,000/g, '₹7,999');
      out = out.replace(/₹6,990[^\n]*/g, '₹5,999');
      out = out.replace(/₹7,990[^\n]*/g, '₹7,999');
      out = out.replace(/expensive/ig, 'budget-sensitive');
      out = out.replace(/premium pricing/ig, 'flexible pricing');
      out = out.replace(/enterprise pricing/ig, 'custom pricing');
      out = out.replace(/costly/ig, 'feature-dependent');

      // Avoid contact-card token unless deliberately rendered by UI; use official text for sales contexts.
      if (isMasterSalesPricingIntent(message, true) || isMasterSalesProceedIntent(message) || isMasterSalesContactIntent(message, true)) {
        out = out.replace(/\n?\[\[CONTACT_CARDS\]\]/g, '');
        if (!out.includes(PIXIE_OFFICIAL_CONTACT.email)) out += `\n\n${masterSalesContactLines()}`;
      }

      out = out.replace(/\n{3,}/g, '\n\n').trim();
      if (!out) return 'How can I help you with your project?';
      return out;
    }

      traceFunction('random');
      const list = Array.isArray(items) ? items.filter((item) => item !== undefined && item !== null) : [];
      if (!list.length) return '';
      return list[Math.floor(Math.random() * list.length)];
