<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pixie Chat — Pixel Code Media</title>
  <style>
    :root {
      --bg-start: #fff7fb;
      --bg-mid: #f4edff;
      --bg-end: #eefcff;
      --text: #30283d;
      --muted: #7d728c;
      --primary: #8b5cf6;
      --primary-2: #ec4899;
      --accent: #fbbf24;
      --surface: rgba(255, 255, 255, 0.72);
      --surface-strong: rgba(255, 255, 255, 0.92);
      --border: rgba(139, 92, 246, 0.14);
      --shadow: 0 22px 70px rgba(91, 33, 182, 0.15);
      --bubble-shadow: 0 14px 34px rgba(91, 33, 182, 0.11);
      --header-height: 72px;
      --composer-height: 88px;
    }

    * {
      box-sizing: border-box;
    }

    body,
    .app,
    .chat-header,
    .composer-shell,
    .composer,
    .bubble,
    .contact-card {
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 8% 4%, rgba(251, 191, 36, 0.28), transparent 30%),
        radial-gradient(circle at 92% 0%, rgba(236, 72, 153, 0.22), transparent 28%),
        radial-gradient(circle at 78% 86%, rgba(34, 211, 238, 0.17), transparent 34%),
        linear-gradient(135deg, var(--bg-start), var(--bg-mid) 52%, var(--bg-end));
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    .app {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, 0.18);
    }

    .chat-header {
      height: calc(var(--header-height) + env(safe-area-inset-top));
      padding: env(safe-area-inset-top) 18px 0;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(139, 92, 246, 0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.82), rgba(255,255,255,0.56));
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
      box-shadow: 0 8px 34px rgba(91, 33, 182, 0.08);
      z-index: 3;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }


    .title {
      font-weight: 850;
      font-size: 18px;
      letter-spacing: -0.035em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(255,255,255,0.68);
      border: 1px solid rgba(139, 92, 246, 0.12);
      color: #5f5370;
      font-size: 13px;
      font-weight: 750;
      box-shadow: 0 10px 25px rgba(91, 33, 182, 0.08);
      flex: 0 0 auto;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #34d399;
      box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.16);
    }

    .messages {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scroll-behavior: smooth;
      padding: 22px max(16px, calc((100vw - 900px) / 2)) 128px;
    }

    .messages::-webkit-scrollbar {
      width: 10px;
    }

    .messages::-webkit-scrollbar-thumb {
      border: 3px solid transparent;
      border-radius: 999px;
      background: rgba(139, 92, 246, 0.2);
      background-clip: content-box;
    }

    .message-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      margin: 0 0 15px;
      animation: messageIn 230ms ease-out both;
    }

    .message-row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: min(72%, 680px);
      padding: 14px 16px;
      border-radius: 24px;
      font-size: 15px;
      line-height: 1.56;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: var(--bubble-shadow);
    }

    .pixie .bubble {
      border-bottom-left-radius: 10px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(139, 92, 246, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .user .bubble {
      border-bottom-right-radius: 10px;
      color: white;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      box-shadow: 0 18px 38px rgba(139, 92, 246, 0.23);
    }

    .typing .bubble {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-width: 78px;
      min-height: 46px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #a78bfa;
      animation: bounce 1s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: 0.14s;
    }

    .dot:nth-child(3) {
      animation-delay: 0.28s;
    }

    .thinking-bubble {
      min-width: 116px;
    }

    .simple-thinking {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #6d45d7;
      font-size: 14px;
      font-weight: 850;
      letter-spacing: -0.01em;
    }

    .thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .thinking-dots i {
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: #a78bfa;
      animation: bounce 1s infinite ease-in-out;
    }

    .thinking-dots i:nth-child(2) {
      animation-delay: 0.14s;
    }

    .thinking-dots i:nth-child(3) {
      animation-delay: 0.28s;
    }

    .answer-bubble {
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .live-cursor {
      display: inline-block;
      width: 0.55em;
      margin-left: 2px;
      color: var(--primary);
      font-weight: 900;
      animation: blink 0.85s steps(2, start) infinite;
    }

    .live-cursor.done {
      opacity: 0;
      animation: none;
      transition: opacity 160ms ease;
    }

    .pixie .bubble a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 4px 5px 4px 0;
      padding: 8px 11px;
      border-radius: 999px;
      color: #7046d4;
      text-decoration: none;
      font-size: 13px;
      font-weight: 850;
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.11), rgba(236, 72, 153, 0.10));
      border: 1px solid rgba(139, 92, 246, 0.16);
      box-shadow: 0 8px 22px rgba(91, 33, 182, 0.08);
      transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
    }

    .pixie .bubble a:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(91, 33, 182, 0.13);
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.16), rgba(236, 72, 153, 0.14));
    }

    .contact-card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 10px;
    }

    .contact-card {
      position: relative;
      overflow: hidden;
      padding: 14px;
      border-radius: 18px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #151C38;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.20);
    }

    .contact-card.email-card {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #121A35, #1C2450);
    }

    .contact-name {
      color: #ffffff;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: -0.025em;
      line-height: 1.2;
    }

    .contact-role {
      margin-top: 3px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 12px;
      font-weight: 750;
      line-height: 1.35;
    }

    .contact-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 11px;
    }

    .pixie .bubble .contact-actions a.contact-action {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      margin: 0;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 850;
      color: #fff;
      text-decoration: none;
      border: 0;
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.25);
      transition: transform 160ms ease, box-shadow 160ms ease, filter 160ms ease;
    }

    .pixie .bubble .contact-actions a.contact-action:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.35);
      filter: brightness(1.08);
    }

    .pixie .bubble .contact-actions a.call {
      background: linear-gradient(135deg, #7C4DFF, #A855F7);
    }

    .pixie .bubble .contact-actions a.whatsapp {
      background: #25D366;
    }

    .pixie .bubble .contact-actions a.email {
      grid-column: 1 / -1;
      background: linear-gradient(135deg, #0EA5E9, #6366F1);
    }

    .contact-section-header {
      color: #ffffff;
      font-size: 15px;
      font-weight: 900;
      margin-bottom: 4px;
    }

    .contact-section-subtitle {
      color: rgba(255, 255, 255, 0.65);
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 12px;
    }


    /* Pixie living avatar system */
    .pixie-avatar-stage {
      position: absolute;
      left: max(12px, calc((100vw - 900px) / 2 + 14px));
      bottom: calc(100% - 18px);
      width: 138px;
      height: 144px;
      z-index: 12;
      pointer-events: none;
      --bot-shell: #ffe8aa;
      --bot-shell-2: #ffc75a;
      --bot-shell-3: #f59e0b;
      --bot-panel: #fff5cf;
      --bot-panel-2: #ffc65a;
      --bot-silver: #ffb21f;
      --bot-silver-2: #fff1b8;
      --bot-accent: #f97316;
      --bot-accent-soft: #ffd36b;
      --bot-coral: #fb923c;
      --bot-blue: #60a5fa;
      --bot-blue-soft: #fff0b3;
      --bot-eye-dark: #08070a;
      --bot-eye-mid: #1f2937;
      --bot-eye-rose: #fb7185;
      --bot-eye-light: #ffffff;
      --bot-eye-shine: #ffffff;
      --bot-line: #07070a;
      --bot-cheek: #fb923c;
      --bot-seat: rgba(255, 255, 255, 0.0);
      --bot-seat-line: rgba(240, 111, 147, 0.0);
      --bot-ui-panel: rgba(255, 255, 255, 0.92);
      --bot-ui-line: rgba(147, 197, 253, 0.62);
      --bot-shadow: rgba(42, 38, 54, 0.22);
      --bot-ground-shadow: rgba(64, 45, 56, 0.14);
    }

    .pixie-avatar-stage::after {
      content: '';
      position: absolute;
      left: 36px;
      bottom: 4px;
      width: 60px;
      height: 11px;
      border-radius: 999px;
      background: radial-gradient(ellipse at center, var(--bot-ground-shadow) 0%, rgba(64, 45, 56, 0.08) 42%, transparent 72%);
      filter: blur(2px);
      opacity: 0.72;
      transform: translateY(1px);
      z-index: 0;
    }

    .pixie-avatar {
      position: absolute;
      left: -3px;
      bottom: 0;
      width: 138px;
      height: 142px;
      transform-origin: 50% 92%;
      filter: drop-shadow(0 14px 22px var(--bot-shadow));
      pointer-events: auto;
      cursor: pointer;
      z-index: 1;
      will-change: transform;
      animation: avatarBreathe 3.45s ease-in-out infinite, avatarSway 6.6s ease-in-out infinite;
    }

    .pixie-avatar svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .pixie-root,
    .pixie-body,
    .pixie-head,
    .pixie-face,
    .pixie-pupils,
    .pixie-eye-open,
    .pixie-brows,
    .pixie-status-light,
    .pixie-status-ring,
    .pixie-side-pod-left,
    .pixie-side-pod-right,
    .pixie-arm-left,
    .pixie-arm-right,
    .pixie-hand-right,
    .pixie-tablet,
    .pixie-tablet-lines,
    .pixie-mouth-idle,
    .pixie-processor,
    .pixie-zzz {
      transform-box: fill-box;
      transform-origin: center;
      will-change: transform, opacity;
    }

    .pixie-root {
      animation: avatarTinyFloat 4.9s ease-in-out infinite;
    }

    .pixie-body {
      animation: avatarBodySettle 4.7s ease-in-out infinite;
    }

    .pixie-head {
      transform-origin: 50% 84%;
      animation: avatarHeadIdle 5.7s cubic-bezier(.45, 0, .25, 1) infinite;
    }

    .pixie-face {
      animation: avatarLookAround 7.1s cubic-bezier(.45, 0, .25, 1) infinite;
    }

    .pixie-pupils {
      animation: avatarPupilLife 6.5s cubic-bezier(.45, 0, .25, 1) infinite;
    }

    .pixie-eye-open {
      animation: avatarBlink 3.05s infinite;
    }

    .pixie-status-light {
      animation: avatarStatusPulse 3.8s ease-in-out infinite;
    }

    .pixie-status-ring {
      animation: avatarStatusRing 3.8s ease-in-out infinite;
    }

    .pixie-side-pod-left {
      transform-origin: 78% 50%;
      animation: avatarPodLeft 6.4s ease-in-out infinite;
    }

    .pixie-side-pod-right {
      transform-origin: 22% 50%;
      animation: avatarPodRight 6.1s ease-in-out infinite;
    }

    .pixie-mouth-idle {
      animation: avatarSoftSmile 5.8s ease-in-out infinite;
    }

    .pixie-eye-smile,
    .pixie-eye-think,
    .pixie-eye-sleep,
    .pixie-eye-curious,
    .pixie-brows-happy,
    .pixie-brows-think,
    .pixie-brows-focused,
    .pixie-mouth-happy,
    .pixie-mouth-big,
    .pixie-mouth-open,
    .pixie-mouth-think,
    .pixie-mouth-focused,
    .pixie-mouth-sleepy,
    .pixie-tablet-lines,
    .pixie-processor,
    .pixie-zzz {
      opacity: 0;
    }

    .pixie-arm-left {
      transform-origin: 86% 24%;
      animation: avatarIdleArmLeft 5.8s ease-in-out infinite;
    }

    .pixie-arm-right {
      transform-origin: 14% 24%;
      animation: avatarIdleArmRight 6.2s ease-in-out infinite;
    }


    .pixie-tablet {
      opacity: 0.14;
      transform: translateY(4px) scale(0.96);
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .pixie-avatar[data-state="typing"] {
      transform: translateY(-1px) rotate(-0.3deg) scale(1.01);
    }

    .pixie-avatar[data-state="typing"] .pixie-head {
      transform: rotate(2.8deg) translateY(1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-face {
      transform: translate(2px, 1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-pupils {
      transform: translate(2.2px, 1.2px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-side-pod-left {
      transform: rotate(-5deg) translateY(-1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-side-pod-right {
      transform: rotate(5deg) translateY(-1px);
      animation: none;
    }

    .pixie-avatar[data-state="typing"] .pixie-mouth-idle,
    .pixie-avatar[data-state="typing"] .pixie-brows-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="typing"] .pixie-mouth-open,
    .pixie-avatar[data-state="typing"] .pixie-brows-focused {
      opacity: 1;
    }

    .pixie-avatar[data-state="typing"] .pixie-status-light {
      animation: avatarStatusTyping 900ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="typing"] .pixie-tablet,
    .pixie-avatar[data-state="answering"] .pixie-tablet {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .pixie-avatar[data-state="sent"],
    .pixie-avatar.avatar-bounce {
      animation: avatarSentJump 520ms cubic-bezier(.2, .9, .25, 1.18), avatarBreathe 3.45s ease-in-out infinite 520ms;
    }

    .pixie-avatar[data-state="sent"] .pixie-side-pod-left,
    .pixie-avatar[data-state="success"] .pixie-side-pod-left,
    .pixie-avatar.avatar-celebrate .pixie-side-pod-left {
      transform: rotate(-8deg) translateY(-2px);
      animation: none;
    }

    .pixie-avatar[data-state="sent"] .pixie-side-pod-right,
    .pixie-avatar[data-state="success"] .pixie-side-pod-right,
    .pixie-avatar.avatar-celebrate .pixie-side-pod-right {
      transform: rotate(8deg) translateY(-2px);
      animation: none;
    }

    .pixie-avatar[data-state="sent"] .pixie-eye-smile,
    .pixie-avatar.avatar-celebrate .pixie-eye-smile,
    .pixie-avatar[data-state="success"] .pixie-eye-smile,
    .pixie-avatar[data-state="sent"] .pixie-brows-happy,
    .pixie-avatar.avatar-celebrate .pixie-brows-happy,
    .pixie-avatar[data-state="success"] .pixie-brows-happy {
      opacity: 1;
    }

    .pixie-avatar[data-state="sent"] .pixie-eye-open,
    .pixie-avatar.avatar-celebrate .pixie-eye-open,
    .pixie-avatar[data-state="success"] .pixie-eye-open,
    .pixie-avatar[data-state="sent"] .pixie-brows-idle,
    .pixie-avatar.avatar-celebrate .pixie-brows-idle,
    .pixie-avatar[data-state="success"] .pixie-brows-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="sent"] .pixie-mouth-happy,
    .pixie-avatar.avatar-celebrate .pixie-mouth-big,
    .pixie-avatar[data-state="success"] .pixie-mouth-big {
      opacity: 1;
    }

    .pixie-avatar[data-state="sent"] .pixie-mouth-idle,
    .pixie-avatar.avatar-celebrate .pixie-mouth-idle,
    .pixie-avatar[data-state="success"] .pixie-mouth-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="sent"] .pixie-status-light,
    .pixie-avatar[data-state="success"] .pixie-status-light,
    .pixie-avatar.avatar-celebrate .pixie-status-light {
      animation: avatarStatusCelebrate 520ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="thinking"] .pixie-head {
      transform: rotate(-4deg) translateY(-1px);
      animation: avatarThinkNod 2.3s ease-in-out infinite;
    }

    .pixie-avatar[data-state="thinking"] .pixie-face {
      transform: translate(-1px, -2px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-pupils {
      transform: translate(0, -3px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-side-pod-left {
      transform: rotate(4deg) translateY(1px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-side-pod-right {
      transform: rotate(-4deg) translateY(-1px);
      animation: none;
    }


    .pixie-avatar[data-state="thinking"] .pixie-arm-left {
      transform: rotate(-22deg) translate(2px, -1px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-arm-right {
      transform: rotate(8deg) translateY(1px);
      animation: none;
    }

    .pixie-avatar[data-state="thinking"] .pixie-eye-open,
    .pixie-avatar[data-state="thinking"] .pixie-brows-idle,
    .pixie-avatar[data-state="thinking"] .pixie-mouth-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="thinking"] .pixie-eye-think,
    .pixie-avatar[data-state="thinking"] .pixie-brows-think,
    .pixie-avatar[data-state="thinking"] .pixie-mouth-think,
    .pixie-avatar[data-state="thinking"] .pixie-processor {
      opacity: 1;
    }

    .pixie-avatar[data-state="thinking"] .pixie-processor {
      animation: avatarProcessor 1.6s ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-head {
      transform: rotate(1.4deg);
      animation: avatarFocusedNod 2.1s ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-face {
      transform: translate(1px, .8px);
      animation: none;
    }

    .pixie-avatar[data-state="answering"] .pixie-pupils {
      transform: translate(1.1px, .8px);
      animation: none;
    }

    .pixie-avatar[data-state="answering"] .pixie-brows-idle,
    .pixie-avatar[data-state="answering"] .pixie-mouth-idle {
      opacity: 0;
    }

    .pixie-avatar[data-state="answering"] .pixie-brows-focused,
    .pixie-avatar[data-state="answering"] .pixie-mouth-focused {
      opacity: 1;
    }

    .pixie-avatar[data-state="answering"] .pixie-tablet-lines {
      opacity: 1;
      animation: avatarTabletLines 980ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-arm-left {
      animation: avatarTinyTypeLeft 520ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="answering"] .pixie-arm-right {
      animation: avatarTinyTypeRight 560ms ease-in-out infinite;
    }

    .pixie-avatar[data-state="success"] {
      animation: avatarSuccessBounce 780ms ease-out both, avatarBreathe 3.45s ease-in-out infinite 780ms;
    }

    .pixie-avatar.avatar-wave .pixie-arm-right {
      animation: avatarWave 1.15s ease-in-out both;
    }

    .pixie-avatar.avatar-stretch .pixie-root {
      animation: avatarStretch 1.05s ease-in-out both;
    }

    .pixie-avatar.avatar-sleepy .pixie-root {
      animation: avatarSleepCurl 1.2s ease-in-out both;
    }

    .pixie-avatar.avatar-sleepy .pixie-eye-open,

  function parseIndianNumber(numText, unitText) {
    var cleaned = String(numText || '').replace(/,/g, '');
    var n = parseFloat(cleaned);
    if (!isFinite(n)) return null;
    var u = String(unitText || '').toLowerCase().trim();
    var mult = 1;
    if (u === 'k' || u === 'thousand') mult = 1000;
    else if (u === 'lakh' || u === 'lakhs' || u === 'lac' || u === 'lacs' || u === 'l') mult = 100000;
    else if (u === 'crore' || u === 'crores' || u === 'cr') mult = 10000000;
    return Math.round(n * mult);
  }

  function formatINR(v) {
    if (typeof v === 'number' && isFinite(v)) return '₹' + Math.round(v).toLocaleString('en-IN');

  function budgetKeywordPositions(raw) {
    var text = String(raw || '').toLowerCase();
    var keywords = [
      'budget', 'cost', 'spend', 'investment', 'invest', 'pricing', 'price', 'quote', 'estimate',
      'around', 'approximately', 'approx', 'upto', 'up to', 'up-to',
      '₹', 'rs', 'inr', 'rupee', 'rupees', 'lakh', 'lakhs', 'lac', 'lacs', 'crore', 'crores', 'thousand'
    ];
    var pos = [];
    for (var i = 0; i < keywords.length; i++) {
      var k = keywords[i], idx = text.indexOf(k);
      while (idx !== -1) {
        pos.push({ key: k, index: idx, strong: /^(budget|cost|spend|investment|invest|pricing|price|quote|estimate|₹|rs|inr|rupee|rupees)$/.test(k) });
        idx = text.indexOf(k, idx + k.length);
      }
    }
    return pos;
  }

  function nearestBudgetKeyword(raw, start, end) {
    var positions = budgetKeywordPositions(raw);
    var best = { distance: Infinity, key: null, strong: false };
    for (var i = 0; i < positions.length; i++) {
      var p = positions[i];
      var d = p.index < start ? start - (p.index + p.key.length) : p.index - end;
      if (d < 0) d = 0;
      if (d < best.distance) best = { distance: d, key: p.key, strong: p.strong };
    }
    return best;
  }

  function hasQuantityNounNear(raw, start, end) {
    var before = String(raw || '').slice(Math.max(0, start - 20), start);
    var after = String(raw || '').slice(end, Math.min(String(raw || '').length, end + 34));
    var qty = /(doctor|doctors|branch|branches|student|students|teacher|teachers|employee|employees|staff|bed|beds|room|rooms|year|years|member|members|class|classes|department|departments|location|locations|seat|seats|people|workers|users|shops|stores)/i;
    return qty.test(before) || qty.test(after);
  }

  function extractBusinessQuantities(text) {
    var raw = String(text || '');
    var out = {};
    var map = [
      ['doctors', /\b(\d[\d,]*)\s*(?:doctors?|drs?)\b/i],
      ['branches', /\b(\d[\d,]*)\s*branches\b/i],
      ['students', /\b(\d[\d,]*)\s*students\b/i],
      ['teachers', /\b(\d[\d,]*)\s*teachers\b/i],
      ['employees', /\b(\d[\d,]*)\s*(?:employees|staff|workers)\b/i],
      ['beds', /\b(\d[\d,]*)\s*beds\b/i]
    ];
    for (var i = 0; i < map.length; i++) {
      var m = raw.match(map[i][1]);
      if (m) out[map[i][0]] = parseInt(String(m[1]).replace(/,/g, ''), 10);
    }
    return out;
  }

  function extractBudgetInfo(text) {
    var raw = String(text || '');
    var candidates = [];
    var re = /((?:₹|rs\.?|inr|rupees?)\s*)?(\d[\d,]*(?:\.\d+)?)\s*(k|thousand|lakh|lakhs|lac|lacs|l|crore|crores|cr)?\b/gi;
    var m;
    while ((m = re.exec(raw)) !== null) {
      var prefix = m[1] || '';
      var numText = m[2];
      var unit = m[3] || '';
      var full = m[0];
      var start = m.index;
      var end = start + full.length;
      var value = parseIndianNumber(numText, unit);
      if (value === null) continue;

      var hasCurrency = /₹|rs\.?|inr|rupee/i.test(prefix);
      var hasUnit = !!unit;
      var unitBudget = /^(k|thousand|lakh|lakhs|lac|lacs|l|crore|crores|cr)$/i.test(unit);
      var hasComma = String(numText).indexOf(',') !== -1;
      var nearest = nearestBudgetKeyword(raw, start, end);
      var nearStrong = nearest.strong && nearest.distance <= 55;
      var nearAny = nearest.distance <= 38;
      var qtyNear = hasQuantityNounNear(raw, start, end);

      // Never treat business quantities as budget, even if another budget appears nearby.
      if (qtyNear && !hasCurrency && !unitBudget) continue;

      // Extract only from budget/currency/unit context. Plain unrelated numbers are ignored.
      var inBudgetContext = hasCurrency || unitBudget || nearStrong || nearAny;
      if (!inBudgetContext) continue;

      var score = 0;
      if (hasCurrency) score += 80;
      if (unitBudget) score += 70;
      if (nearStrong) score += 90;
      else if (nearAny) score += 35;
      if (hasComma) score += 20;
      if (qtyNear) score -= 100;
      if (nearest.distance !== Infinity) score -= Math.min(nearest.distance, 120) / 4;

      var confidence = 'medium';
      if (hasCurrency || nearStrong || unitBudget) confidence = 'high';
      if (!hasCurrency && !unitBudget && !nearStrong && nearAny) confidence = 'medium';

      candidates.push({
        value: value,
        confidence: confidence,
        raw: full.trim(),
        context: raw.slice(Math.max(0, start - 45), Math.min(raw.length, end + 45)).trim(),
        distance: nearest.distance,
        score: score
      });
    }

    if (!candidates.length) return { value: null, confidence: null, raw: null, context: null };
    candidates.sort(function (a, b) {
      if (b.score !== a.score) return b.score - a.score;
      return a.distance - b.distance;
    });
    return candidates[0];
  }

    var directContactIntent = match(msg, ['contact', 'contact team', 'callback', 'call back', 'call me', 'phone number', 'whatsapp number', 'email', 'talk to', 'speak with', 'reach you', 'connect with team']) || mlMatch(text, ['കോൺടാക്റ്റ്', 'ബന്ധപ്പെട', 'കാൾ ബാക്ക്', 'തിരിച്ചു വിളി', 'എന്നെ വിളിക്ക', 'ഫോൺ നമ്പർ', 'വാട്ട്സ്ആപ്പ് നമ്പർ', 'ഇമെയിൽ']);
    var proceedIntent = match(msg, ['start project', 'start the project', 'begin project', 'begin the project', 'move forward', 'proceed', 'how to proceed', 'how can we start', 'how do we start', 'next step', 'next steps', 'hire you', 'work with you', 'ready to start']) || mlMatch(text, ['പ്രോജക്റ്റ് തുടങ്ങണം', 'തുടങ്ങണം', 'എങ്ങനെ തുടങ്ങാം', 'എങ്ങനെ മുന്നോട്ട് പോകാം', 'നെക്സ്റ്റ് സ്റ്റെപ്പ്', 'ഹയർ ചെയ്യണം', 'വർക്ക് ചെയ്യണം']);
    var contactIntent = pricingIntent || quoteIntent || directContactIntent || proceedIntent;
    // If the user is asking general company/pricing info, answer from KB. If they gave a project brief or pricing request, let the reasoning engine handle it.
    if (kb && !(quickReq.business && quickReq.service && (pricingIntent || match(msg, ['need', 'want', 'looking for', 'build', 'create', 'make', 'develop'])))) {
      if (contactIntent && kb.indexOf('[[CONTACT_CARDS]]') === -1) kb += '\n\n[[CONTACT_CARDS]]';
      return kb;
    }

    var ctx = loadCtx();
    var oldBusiness = ctx.business, oldService = ctx.service;
    console.log('CTX BEFORE', ctx);
    ctx = updateState(ctx, text);
    ctx = normalizeCtx(ctx);
    var topicChanged = !!((quickReq.business && oldBusiness && quickReq.business !== oldBusiness) || (quickReq.service && oldService && quickReq.service !== oldService));
    if (topicChanged) ctx.detailedMode = false;
    if (wantsDetailed) ctx.detailedMode = true;
    console.log('CTX AFTER', ctx);

    // Step 6: generate a custom answer whenever enough context exists.
    var hasProjectContext = !!(ctx.business && ctx.service && ctx.businessConfidence !== 'low' && ctx.serviceConfidence !== 'low');
    var wantsCommercialAnswer = pricingIntent || quoteIntent || proceedIntent;
    var reply = '';
    if (hasProjectContext && wantsBrief) reply = buildProjectBrief(ctx);
    else if (hasProjectContext && wantsCommercialAnswer) reply = ctx.detailedMode ? buildCustomProjectAnswer(ctx, true) : buildShortProjectAnswer(ctx, true);
    else if (hasProjectContext) reply = buildResponse(ctx, text);
    else if (pricingIntent) reply = buildGeneralPricingReply(ctx);
    else reply = buildResponse(ctx, text);

    if (contactIntent && reply.indexOf('[[CONTACT_CARDS]]') === -1) reply += '\n\n[[CONTACT_CARDS]]';
    if (reply.indexOf('[[CONTACT_CARDS]]') !== -1) ctx.waiting_for_contact_confirmation = false;
    else if (reply.indexOf('Contact Team') !== -1) ctx.waiting_for_contact_confirmation = true;
    var missing = missingFields(ctx);
    var reason = deriveReason(ctx, missing);

    console.log('Requirement extraction:', JSON.stringify(PixieExtractor.extract(text)));
    console.log('Industry match:', ctx.business ? (INDUSTRIES[ctx.business] ? INDUSTRIES[ctx.business].label : ctx.business) : 'none');
    console.log('Known state:', JSON.stringify(ctx));
    console.log('Missing fields:', missing.join(', ') || 'none');
    console.log('Reason for next question:', reason);

    saveCtx(ctx);
    return reply;
  }

  function buildResponse(ctx, text) {
    if (!ctx.business || ctx.businessConfidence === 'low') return askBusiness(ctx);
    if (!ctx.service || ctx.serviceConfidence === 'low') return askService(ctx);
    if (ctx.business && ctx.service) {
      if (!ctx.goal) ctx.goal = defaultGoal(ctx.business);
      return ctx.detailedMode ? generateRecommendation(ctx) : buildShortProjectAnswer(ctx, false);
    }
    return ctx.detailedMode ? generateRecommendation(ctx) : buildShortProjectAnswer(ctx, false);
  }

  function generateRecommendation(ctx) {

  /* ── Safe response fallback ── */
  function safeFallbackReply(raw) {
    var text = String(raw || '').trim();
    var ctx = clone(DEFAULT);
    var req = null;
    try { ctx = loadCtx(); } catch (e1) { ctx = clone(DEFAULT); }
    try { req = PixieExtractor.extract(text); } catch (e2) { req = null; }

    if (req) {
      if (req.business) ctx.business = req.business;
      if (req.service) ctx.service = req.service;
      if (req.goal) ctx.goal = req.goal;
      if (req.features && req.features.length) ctx.features = mergeUnique(ctx.features || [], req.features, 8);
    }

    var info = pricingInfo(ctx.service);
    var businessName = ctx.business ? titleCase((INDUSTRIES[ctx.business] && INDUSTRIES[ctx.business].label) || ctx.business) : null;

    if (ctx.business && ctx.service) {
      var features = ctx.features && ctx.features.length ? ctx.features.join(', ') : 'the essential first-version features';
      return pick([
        'Based on the details available, a focused ' + businessName + ' ' + info.label + ' is the right starting point. Start with ' + features + ', keep the first version lean, and expand after launch. Estimated starting point: ' + info.estimate + '.',
        'From what I can understand, this should be planned as a ' + businessName + ' ' + info.label + '. The safest approach is to launch with ' + features + ' first. Starting estimate: ' + info.estimate + '.',
        'A practical direction is to build a clean ' + businessName + ' ' + info.label + ' with ' + features + '. That keeps the scope affordable and professional from day one. Estimated start: ' + info.estimate + '.'
      ]);
    }

    if (ctx.business) {
      return pick([

        'For ' + businessName + ', I can suggest the right digital solution once you share what you want to build.'

        'For a ' + info.label + ', I need the business type next — for example clinic, restaurant, school, gym, travel agency, or real estate.'

  /* ── UI Layer ── */
  var STARTER = [{
    role: 'pixie',
    text: "Hey there \u2728\n\nI'm Pixie \u2014 your digital business consultant.\n\nI help businesses grow with websites, apps, software, automation, and AI.\n\nTell me what you're working on, and I'll share the smartest path forward."
  }];

  var msgEl = gEl('messages'), formEl = gEl('chatForm'), inpEl = gEl('messageInput'), btnEl = gEl('sendButton'), avEl = gEl('pixieAvatar');
  var history = sGet(H_KEY, STARTER.map(function (m) { return { role: m.role, text: m.text }; }));
  var typing = 0;

  function init() {
    if (!msgEl || !formEl || !inpEl || !btnEl) { return; }
    console.log('[PIXIE] Chat initialized');
    renderAll(); bindUI(); autoSize(); updBtn();
    setTimeout(function () { if (inpEl) inpEl.focus(); }, 100);
  }

  function bindUI() {
    if (formEl._px) return;
    formEl._px = 1;
    formEl.addEventListener('submit', function (e) { e.preventDefault(); send(); });
    inpEl.addEventListener('input', function () { autoSize(); updBtn(); });
    inpEl.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
  }

  function send() {
    var t = (inpEl.value || '').trim();
    if (!t || typing) return;
    typing = 1; updBtn();
    addHist('user', t);
    if (avEl) avEl.dataset.state = 'sent';
    inpEl.value = ''; autoSize(); updBtn();

    // Always show the typing indicator before generating/rendering Pixie's response.
    showTyp();
    if (avEl) avEl.dataset.state = 'typing';

    setTimeout(function () {
      var r = '';
      try {
        r = generateReply(t);
      } catch (err) {
        r = safeFallbackReply(t);
      }
      if (!r) r = safeFallbackReply(t);

      hideTyp();
      if (avEl) avEl.dataset.state = 'answering';
      typePixieResponse(r, function () {
        typing = 0; updBtn();
        if (avEl) setTimeout(function () { avEl.dataset.state = 'idle'; }, 700);
        if (inpEl) inpEl.focus();
        scrollDn();
      });
    }, 260 + Math.floor(Math.random() * 180));
  }

  function commitHist(role, text) {
    history.push({ role: role, text: text });
    if (history.length > 160) history = history.slice(-160);
    sSet(H_KEY, history);
  }

  function addHist(role, text) {
    commitHist(role, text);
    renderMsg(role, text);
    scrollDn();
  }

  function typePixieResponse(text, done) {
    if (!msgEl) { commitHist('pixie', text); if (done) done(); return; }
    var row = document.createElement('div'); row.className = 'message-row pixie';
    var b = document.createElement('div'); b.className = 'bubble';
    row.appendChild(b); msgEl.appendChild(row);

    var displayText = String(text || '').replace(/\n?\[\[CONTACT_CARDS\]\]/g, '');
    var chars = Array.from(displayText);
    var i = 0;

    function delayFor(ch) {
      if (ch === '\n') return 34;
      if (/[.!?]/.test(ch)) return 46;
      if (/[,;:]/.test(ch)) return 28;
      if (ch === ' ') return 7;
      return 10;
    }

    function step() {
      if (i >= chars.length) {
        b.innerHTML = fmt(text);
        commitHist('pixie', text);
        scrollDn();
        if (done) done();
        return;
      }
      b.textContent += chars[i];
      var d = delayFor(chars[i]);
      i++;
      scrollDn();
      setTimeout(step, d);
    }

    step();
  }

  function renderMsg(role, text) {
    if (!msgEl) return;
    var row = document.createElement('div'); row.className = 'message-row ' + (role === 'user' ? 'user' : 'pixie');
    var b = document.createElement('div'); b.className = 'bubble';
    if (role === 'user') b.textContent = text;
    else b.innerHTML = fmt(text);
    row.appendChild(b); msgEl.appendChild(row);
  }

        c += '<a href="' + esc(TEAM[i].wa) + '" target="_blank" rel="noopener" class="contact-action whatsapp">WhatsApp ' + esc(TEAM[i].name) + '</a>';
        c += '</div></article>';

      c += '<article class="contact-card email-card">';
      c += '<div class="contact-name">Email Team</div>';
